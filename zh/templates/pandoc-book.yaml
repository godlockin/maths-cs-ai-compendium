## 二 · LaTeX 模板 (zh/templates/tex/zh-book.tex)

```latex
% zh-book.tex - 中文教材排版模板
\documentclass[$if(fontsize)$$fontsize$,$endif$$if(papersize)$$papersize$,$endif$]{book}

% 中文支持
\usepackage{xeCJK}
\usepackage{fontspec}
$if(mainfont)$\setCJKmainfont{$mainfont$}$endif$
$if(sansfont)$\setCJKsansfont{$sansfont$}$endif$
$if(monofont)$\setCJKmonofont{$monofont$}$endif$

% 几何
\usepackage[$geometry$]{geometry}

% 颜色
\usepackage{xcolor}
\definecolor{chaptercolor}{RGB}{26, 84, 144}
\definecolor{sectioncolor}{RGB}{74, 144, 226}

% 章节标题
\usepackage{titlesec}
\titleformat{\chapter}[display]
  {\normalfont\Large\bfseries\color{chaptercolor}}
  {\chaptertitlename\ \thechapter}{20pt}{\Huge}
\titleformat{\section}
  {\normalfont\large\bfseries\color{sectioncolor}}
  {\thesection}{1em}{}
\titleformat{\subsection}
  {\normalfont\normalsize\bfseries}
  {\thesubsection}{1em}{}

% 代码块
\usepackage{listings}
\usepackage{xcolor}
\lstset{
  basicstyle=\ttfamily\small,
  backgroundcolor=\color{gray!10},
  keywordstyle=\color{blue}\bfseries,
  commentstyle=\color{green!50!black},
  stringstyle=\color{red},
  frame=single,
  framerule=0pt,
  breaklines=true,
  showstringspaces=false
}

% 数学
\usepackage{amsmath, amssymb, amsthm}
\usepackage{mathtools}

% 图形
\usepackage{graphicx}
\graphicspath{{./}{./zh/images/}}

% SVG 支持 (可选)
\usepackage{svg}

% 表格
\usepackage{booktabs}
\usepackage{longtable}

% 超链接
\usepackage{hyperref}
\hypersetup{
  colorlinks=true,
  linkcolor=blue,
  citecolor=blue,
  urlcolor=blue,
  bookmarksnumbered=true
}

% 目录
\usepackage{tocloft}
\renewcommand{\cftchapfont}{\color{chaptercolor}\bfseries}

% 行距
\linespread{$linestretch$}

% 标题页
\title{$title$\\$if(subtitle)$\large $subtitle$\\$endif$}
\author{$author$}
\date{$date$}

\begin{document}

% === 标题页 ===
\begin{titlepage}
\centering
\vspace*{2cm}
{\Huge\bfseries\color{chaptercolor} $title$\par}
\vspace{1cm}
{\Large $subtitle$\par}
\vspace{2cm}
{\large $author$\par}
\vspace{1cm}
{\large $date$\par}
\vspace{2cm}
{\small 中文版 v1.0\par}
\vfill
\end{titlepage}

% === 目录 ===
\tableofcontents
\listoffigures
\listoftables

% === 正文 ===
$body$

% === 参考文献 ===
$if(bibliography)$
\bibliography{$bibliography$}
$endif$

\end{document}
```

