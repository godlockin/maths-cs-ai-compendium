## 四 · 排版注意事项

### 4.1 中文断行

```latex
% 在 zh-book.tex 加
\XeTeXlinebreaklocale "zh"
\XeTeXlinebreakskip = 0pt plus 1pt
```

### 4.2 中文标点

- 全角逗号 `,` 而非半角 `,`
- 全角句号 `。` 而非半角 `.`
- 全角引号 `"..."` 而非 `"..."`
- 数字 / 英文之间留空格

### 4.3 代码块语言

每个代码块注明语言:
```python
# python
```
```cpp
// cpp
```
```bash
# bash
```

### 4.4 图引用

在 Markdown 中:
```markdown
![LLM 推理架构](../images/svgs/llm_inference_arch.svg)
```

Pandoc 自动转换为 LaTeX `\includegraphics`。

### 4.5 公式

行内公式: `$E = mc^2$`
块级公式:
```latex
$$
\mathcal{L} = -\sum_i y_i \log(\hat{y}_i)
$$
```

