## 六 · 出版建议

| 出版社 | 适合模板 |
|--------|----------|
| **Springer** | svmono (英文) / 中文用自定义 |
| **Manning** | 自定义 Manning 风格 (蓝绿配色) |
| **图灵** | 中文简化版 (国内最常见) |
| **机械工业** | 标准教材模板 |
| **自出版** | 现成 + 配图丰富 |

**推荐**: 先做 **数字版** (PDF / EPUB / 网页), 验证内容; 再考虑**纸质出版**。

---

## 七 · 一句话总结

> **Pandoc + XeLaTeX + 思源宋体 = 出版级 PDF**。
> 本模板基于开源工具链, 零成本, 高度可定制。
> **2-3 小时配置 + 1 次编译** 即可生成完整 PDF。
