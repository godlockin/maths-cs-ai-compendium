# Pandoc 配置: 中文版《数学 · 计算机 · AI 全栈》

> **用途**: 用 Pandoc 将 `zh/` Markdown 转为出版级 PDF
> **依赖**: `pandoc 3.x` + `xelatex` (TeX Live) + 中文字体 (思源宋体/方正书宋)
> **命令**: `pandoc -d book.yaml -o book.pdf`

---

## 一 · book.yaml (元数据 + 章节列表)

```yaml
# book.yaml
title: "数学 · 计算机 · AI 全栈 — 从理论到实战"
subtitle: "中文版 v1.0 (2026-07-31)"
author: "Henry Ndubuaku 等 · 中文翻译组"
date: "2026-07-31"
lang: zh-CN
toc: true
toc-depth: 3
number-sections: true
secnumdepth: 3

# 字体 (Linux/macOS)
mainfont: "Source Han Serif SC"
sansfont: "Source Han Sans SC"
monofont: "Sarasa Mono SC"

# 引用风格
citeproc: true
link-citations: true

# 输入文件 (按顺序)
input-files:
  - "zh/前言.md"
  - "zh/LEARNING_OBJECTIVES.md"
  - "zh/TRANSLATION_GUIDE.md"
  - "zh/INDEX.md"
  - "zh/BIBLIOGRAPHY.md"
  - "zh/GLOSSARY.md"
  - "zh/教辅/全局概览.md"
  - "zh/教辅/整本书脉络地图.md"
  # === 第 1-25 章 ===
  - "zh/第01章 - 向量/*.md"
  - "zh/第02章 - 矩阵/*.md"
  - "zh/第03章 - 微积分/*.md"
  - "zh/第04章 - 统计学/*.md"
  - "zh/第05章 - 概率论/*.md"
  - "zh/第06章 - 机器学习/*.md"
  - "zh/第07章 - 计算语言学/*.md"
  - "zh/第08章 - 计算机视觉/*.md"
  - "zh/第09章 - 音频与语音/*.md"
  - "zh/第10章 - 多模态学习/*.md"
  - "zh/第11章 - 自主系统/*.md"
  - "zh/第12章 - 图神经网络/*.md"
  - "zh/第13章 - 计算与操作系统/*.md"
  - "zh/第14章 - 数据结构与算法/*.md"
  - "zh/第15章 - 生产级软件工程/*.md"
  - "zh/第16章 - SIMD 与 GPU 编程/*.md"
  - "zh/第17章 - AI 推理/*.md"
  - "zh/第18章 - 机器学习系统设计/*.md"
  - "zh/第19章 - 应用 AI/*.md"
  - "zh/第20章 - 前沿 AI/*.md"
  - "zh/第21章 - 对齐、安全与可解释性/*.md"
  - "zh/第22章 - LLM Evaluation 方法学/*.md"
  - "zh/第23章 - AI Agent 与工具使用/*.md"
  - "zh/第24章 - 数值分析与凸优化补遗/*.md"
  - "zh/第25章 - AI 系统实战面试指南/*.md"

output: pdf

# PDF 引擎
pdf-engine: xelatex
pdf-engine-opts:
  - "-halt-on-error"
  - "-file-line-error"

# 变量 (供模板使用)
variables:
  documentclass: book
  papersize: a4
  fontsize: 10pt
  geometry: "left=2.5cm, right=2.5cm, top=2.5cm, bottom=2.5cm"
  linestretch: 1.3
  toc-title: 目录
  lof-title: 插图清单
  lot-title: 表格清单
  biblio-title: 参考文献
```

