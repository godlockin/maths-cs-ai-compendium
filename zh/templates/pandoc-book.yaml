## 三 · 转换命令

### 3.1 基础命令

```bash
# 安装依赖 (macOS)
brew install pandoc
brew install --cask mactex
brew install --cask font-source-han-serif

# 生成 PDF
pandoc -d book.yaml -o book.pdf
```

### 3.2 高级命令 (含 SVG)

```bash
# 使用 SVG (需 inkscape)
pandoc -d book.yaml \
  --pdf-engine=xelatex \
  --listings \
  -V geometry:margin=2.5cm \
  -o book.pdf
```

### 3.3 批量转换 (HTML/EPUB)

```bash
# HTML 单文件
pandoc -d book.yaml -t html5 --self-contained -o book.html

# EPUB
pandoc -d book.yaml -t epub3 --epub-cover-image=cover.jpg -o book.epub

# DOCX (Word)
pandoc -d book.yaml -o book.docx
```

