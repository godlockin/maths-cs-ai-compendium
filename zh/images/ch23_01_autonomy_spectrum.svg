<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style> text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; } </style>
<rect width="720" height="380" fill="#fafbfc"/>
<defs>
  <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  <linearGradient id="autonomy" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#16a34a" stop-opacity="0.15"/>
    <stop offset="50%" stop-color="#d97706" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#dc2626" stop-opacity="0.4"/>
  </linearGradient>
</defs>

<!-- 顶部 Banner -->
<rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
<text x="360" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="white">自主性光谱: Level 0 → Level 4 能力与失败风险递增</text>

<!-- 渐变背景条 -->
<rect x="60" y="100" width="600" height="30" rx="15" fill="url(#autonomy)"/>
<!-- 箭头 -->
<line x1="60" y1="115" x2="660" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#a-64748b)"/>

<!-- 5 个 Level -->
<g font-size="12" font-weight="600" text-anchor="middle">
  <g>
    <circle cx="90" cy="115" r="14" fill="#16a34a" stroke="#fff" stroke-width="2"/>
    <text x="90" y="120" fill="white">0</text>
    <text x="90" y="160" fill="#16a34a">纯 LLM Chat</text>
    <text x="90" y="178" font-size="10" font-weight="400" fill="#475569">无工具 无循环</text>
    <text x="90" y="195" font-size="10" font-weight="400" fill="#94a3b8">写 · 翻译 · 头脑风暴</text>
  </g>
  <g>
    <circle cx="220" cy="115" r="14" fill="#65a30d" stroke="#fff" stroke-width="2"/>
    <text x="220" y="120" fill="white">1</text>
    <text x="220" y="160" fill="#65a30d">Function Call</text>
    <text x="220" y="178" font-size="10" font-weight="400" fill="#475569">单步工具调用</text>
    <text x="220" y="195" font-size="10" font-weight="400" fill="#94a3b8">查天气 · 一次查询</text>
  </g>
  <g>
    <circle cx="350" cy="115" r="14" fill="#d97706" stroke="#fff" stroke-width="2"/>
    <text x="350" y="120" fill="white">2</text>
    <text x="350" y="160" fill="#d97706">Workflow</text>
    <text x="350" y="178" font-size="10" font-weight="400" fill="#475569">人定义 DAG</text>
    <text x="350" y="195" font-size="10" font-weight="400" fill="#94a3b8">客服流水线 · RAG</text>
  </g>
  <g>
    <circle cx="480" cy="115" r="14" fill="#ea580c" stroke="#fff" stroke-width="2"/>
    <text x="480" y="120" fill="white">3</text>
    <text x="480" y="160" fill="#ea580c">Agent</text>
    <text x="480" y="178" font-size="10" font-weight="400" fill="#475569">LLM 自主规划</text>
    <text x="480" y="195" font-size="10" font-weight="400" fill="#94a3b8">Claude Code · SWE-Agent</text>
  </g>
  <g>
    <circle cx="620" cy="115" r="14" fill="#dc2626" stroke="#fff" stroke-width="2"/>
    <text x="620" y="120" fill="white">4</text>
    <text x="620" y="160" fill="#dc2626">Multi-Agent</text>
    <text x="620" y="178" font-size="10" font-weight="400" fill="#475569">多角色协作</text>
    <text x="620" y="195" font-size="10" font-weight="400" fill="#94a3b8">AutoGen · MetaGPT</text>
  </g>
</g>

<!-- 能力与失败风险双轴标签 -->
<text x="360" y="74" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">能力上限 ↑</text>
<text x="360" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">失败风险 / 成本 / 延迟 ↑</text>

<!-- 铁律卡片 -->
<rect x="60" y="260" width="600" height="88" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="80" y="285" font-size="12" font-weight="700" fill="#dc2626">Anthropic 铁律</text>
<text x="80" y="306" font-size="13" font-style="italic" fill="#7f1d1d">"Don't build an agent when a workflow will do."</text>
<text x="80" y="328" font-size="11" fill="#475569">公式: Autonomy(S) = α·H_decision + β·|T| + γ·d_plan − δ·n_human</text>
<text x="80" y="345" font-size="10" fill="#94a3b8">决策越自主 / 工具越丰富 / 规划越深 / 人工越少 → 自主性越高, 但失败风险 ↑↑↑</text>
</svg>
