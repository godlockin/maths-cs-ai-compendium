<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="240" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="white">AI 药物发现的杠杆效应</text>

  <!-- Funnel: 4 stages -->
  <!-- Stage 1: 靶点发现 / 命中生成 x1000 -->
  <rect x="40" y="70" width="640" height="26" rx="3" fill="#16a34a" fill-opacity="0.85"/>
  <text x="56" y="88" font-size="12" font-weight="600" fill="white">前期 候选分子生成</text>
  <text x="664" y="88" text-anchor="end" font-size="13" font-weight="700" fill="white">× 1000</text>

  <!-- Stage 2: ADMET 筛选 x10 -->
  <rect x="100" y="106" width="520" height="26" rx="3" fill="#2563eb" fill-opacity="0.75"/>
  <text x="116" y="124" font-size="12" font-weight="600" fill="white">中期 ADMET 筛选</text>
  <text x="604" y="124" text-anchor="end" font-size="13" font-weight="700" fill="white">× 10</text>

  <!-- Stage 3: 临床前 -->
  <rect x="160" y="142" width="400" height="26" rx="3" fill="#d97706" fill-opacity="0.75"/>
  <text x="176" y="160" font-size="12" font-weight="600" fill="white">临床前 (动物实验)</text>
  <text x="544" y="160" text-anchor="end" font-size="13" font-weight="700" fill="white">× 1.5</text>

  <!-- Stage 4: 临床试验 -->
  <rect x="220" y="178" width="280" height="26" rx="3" fill="#dc2626" fill-opacity="0.75"/>
  <text x="236" y="196" font-size="12" font-weight="600" fill="white">后期 临床试验 (II/III 期)</text>
  <text x="484" y="196" text-anchor="end" font-size="13" font-weight="700" fill="white">≈ 1×</text>

  <!-- Annotation under funnel -->
  <text x="360" y="224" text-anchor="middle" font-size="11" fill="#475569">越前期 AI 杠杆越大; 临床试验阶段 AI 帮不上太多, 瓶颈仍在生物学</text>
</svg>
