<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="700" height="320" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
    <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
    <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="36" fill="#2563eb"/>
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">替代梯度的直觉</text>

  <!-- Axes -->
  <g transform="translate(60,55)">
    <line x1="0" y1="120" x2="580" y2="120" stroke="#475569" stroke-width="1"/>
    <line x1="290" y1="-10" x2="290" y2="160" stroke="#475569" stroke-width="1"/>
    <!-- zero level for step -->
    <line x1="290" y1="65" x2="290" y2="65" stroke="#94a3b8"/>
    <text x="290" y="135" text-anchor="middle" font-size="10" fill="#64748b">V - V_th = 0</text>
    <text x="588" y="135" text-anchor="end" font-size="10" fill="#64748b">V - V_th</text>
    <text x="284" y="0" font-size="10" text-anchor="end" fill="#64748b">S / ∂S/∂V</text>

    <!-- Forward step (blue) -->
    <path d="M 0,120 L 290,120 L 290,30 L 580,30" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="200" y="115" font-size="11" fill="#2563eb" font-weight="700">前向: 硬 Heaviside</text>
    <text x="200" y="100" font-size="10" fill="#64748b">S = 1[V ≥ V_th]</text>

    <!-- Backward arctan surrogate (orange, dashed) -->
    <path d="M 80,30 Q 290,90 290,30 Q 290,-30 500,30"
          fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="380" y="-5" font-size="11" fill="#d97706" font-weight="700">反向: 平滑替代</text>
    <text x="380" y="14" font-size="10" fill="#64748b">∂S/∂V ≈ β / [π(1+(β(V-V_th))²)]</text>

    <!-- infty arrow on classic derivative -->
    <line x1="290" y1="120" x2="290" y2="-10" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="295" y="-15" font-size="10" fill="#dc2626">真实导数 = 0/∞ 不可微</text>
  </g>

  <!-- bottom: forward vs backward pipeline boxes -->
  <g transform="translate(60,235)">
    <rect x="0" y="0" width="200" height="55" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="100" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">前向传播</text>
    <text x="100" y="38" text-anchor="middle" font-size="10" fill="#475569">硬 spike: S = 1[V ≥ V_th]</text>
    <text x="100" y="50" text-anchor="middle" font-size="10" fill="#64748b">(离散, 不可微)</text>

    <line x1="200" y1="28" x2="240" y2="28" stroke="#64748b" stroke-width="1.4" marker-end="url(#a-64748b)"/>

    <rect x="240" y="0" width="200" height="55" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
    <text x="340" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#d97706">反向传播 (BPTT)</text>
    <text x="340" y="38" text-anchor="middle" font-size="10" fill="#475569">用反正弦/ATan 替代梯度</text>
    <text x="340" y="50" text-anchor="middle" font-size="10" fill="#64748b">近似∂S/∂V, 即可微</text>

    <line x1="440" y1="28" x2="480" y2="28" stroke="#64748b" stroke-width="1.4" marker-end="url(#a-64748b)"/>

    <rect x="480" y="0" width="140" height="55" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="550" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">梯度更新</text>
    <text x="550" y="38" text-anchor="middle" font-size="10" fill="#475569">SGD / Adam</text>
    <text x="550" y="50" text-anchor="middle" font-size="10" fill="#64748b">优化 θ</text>
  </g>

  <text x="350" y="308" text-anchor="middle" font-size="10" font-style="italic" fill="#64748b">Neftci et al., "Surrogate Gradient Learning in Spiking Neural Networks", IEEE SPM 2019</text>

</svg>