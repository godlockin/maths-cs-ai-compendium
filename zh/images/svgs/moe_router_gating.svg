<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/></marker>
  </defs>
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="bold">MoE 路由与门控机制</text>

  <!-- Input tokens layer -->
  <rect x="300" y="65" width="200" height="40" rx="6" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <text x="400" y="90" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Input Tokens</text>

  <!-- Arrow to router -->
  <line x1="400" y1="105" x2="400" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- Router / Gating -->
  <rect x="250" y="125" width="300" height="50" rx="8" fill="#7c3aed" fill-opacity="0.25" stroke="#a78bfa" stroke-width="2"/>
  <text x="400" y="148" text-anchor="middle" fill="#ddd6fe" font-size="14" font-weight="700">Router / Gating Network</text>
  <text x="400" y="166" text-anchor="middle" fill="#a78bfa" font-size="11">softmax(Top-K(W_g · x + b))</text>

  <!-- 3 arrows to 3 experts -->
  <line x1="200" y1="150" x2="120" y2="230" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="110" y="195" text-anchor="middle" fill="#22c55e" font-size="10">w₁ = 0.5</text>
  <line x1="400" y1="175" x2="400" y2="215" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="430" y="200" text-anchor="middle" fill="#22c55e" font-size="10">w₂ = 0.3</text>
  <line x1="600" y1="150" x2="680" y2="230" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="690" y="195" text-anchor="middle" fill="#22c55e" font-size="10">w₃ = 0.2</text>

  <!-- Expert 1 -->
  <rect x="40" y="230" width="160" height="60" rx="6" fill="#166534" stroke="#22c55e" stroke-width="1.5"/>
  <text x="120" y="255" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="700">Expert 1</text>
  <text x="120" y="275" text-anchor="middle" fill="#86efac" font-size="10">FFN (4d→d→4d)</text>

  <!-- Expert 2 -->
  <rect x="320" y="215" width="160" height="60" rx="6" fill="#166534" stroke="#22c55e" stroke-width="1.5"/>
  <text x="400" y="240" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="700">Expert 2</text>
  <text x="400" y="260" text-anchor="middle" fill="#86efac" font-size="10">FFN (4d→d→4d)</text>

  <!-- Expert 3 (inactive) -->
  <rect x="600" y="230" width="160" height="60" rx="6" fill="#166534" fill-opacity="0.2" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="680" y="255" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">Expert 3</text>
  <text x="680" y="275" text-anchor="middle" fill="#4ade80" font-size="10">Inactive (w₃=0)</text>

  <!-- Combine outputs -->
  <line x1="120" y1="290" x2="120" y2="340" stroke="#64748b" stroke-width="1.5"/>
  <line x1="400" y1="275" x2="400" y2="340" stroke="#64748b" stroke-width="1.5"/>
  <line x1="680" y1="290" x2="680" y2="340" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <rect x="300" y="340" width="200" height="40" rx="6" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <text x="400" y="365" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Combine: Σ wᵢ · Eᵢ(x)</text>

  <!-- Arrow to output -->
  <line x1="400" y1="380" x2="400" y2="405" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)"/>

  <rect x="300" y="405" width="200" height="40" rx="6" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <text x="400" y="430" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Output (sparse activation)</text>

  <!-- Legend -->
  <rect x="30" y="410" width="200" height="70" fill="#1e293b" stroke="#334155" stroke-width="1" rx="4"/>
  <text x="130" y="430" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="700">Key Concepts</text>
  <text x="40" y="448" fill="#a78bfa" font-size="9">• Top-K routing: only K experts activated/token</text>
  <text x="40" y="463" fill="#86efac" font-size="9">• Load balancing aux loss avoids expert collapse</text>
</svg>
