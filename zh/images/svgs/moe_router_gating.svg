<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="bold">Mixture of Experts (MoE) 架构</text>
  <!-- Input tokens -->
  <g transform="translate(50, 200)">
    <text x="50" y="-10" text-anchor="middle" fill="#94a3b8" font-size="14">Input Tokens</text>
    <rect x="0" y="0" width="100" height="30" fill="#3b82f6" opacity="0.5" stroke="#3b82f6"/>
    <rect x="0" y="40" width="100" height="30" fill="#3b82f6" opacity="0.5" stroke="#3b82f6"/>
    <rect x="0" y="80" width="100" height="30" fill="#3b82f6" opacity="0.5" stroke="#3b82f6"/>
  </g>
  <!-- Gating -->
  <g transform="translate(220, 180)">
    <text x="60" y="-10" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">Router Gating</text>
    <rect x="0" y="0" width="120" height="130" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="2" rx="6"/>
    <text x="60" y="35" text-anchor="middle" fill="#f59e0b" font-size="11">Softmax</text>
    <text x="60" y="60" text-anchor="middle" fill="#f59e0b" font-size="11">Top-k (k=2)</text>
    <text x="60" y="85" text-anchor="middle" fill="#f59e0b" font-size="11">Load Balance</text>
    <text x="60" y="110" text-anchor="middle" fill="#f59e0b" font-size="11">Capacity factor</text>
  </g>
  <!-- Arrows from input to gating -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="150" y1="215" x2="220" y2="220"/>
    <line x1="150" y1="255" x2="220" y2="240"/>
    <line x1="150" y1="295" x2="220" y2="260"/>
  </g>
  <!-- Experts -->
  <g transform="translate(410, 110)">
    <text x="170" y="-15" text-anchor="middle" fill="#94a3b8" font-size="14">N 个 Experts (e.g., 8 / 64 / 256)</text>
    <g><rect x="0" y="0" width="80" height="50" fill="#10b981" opacity="0.4" stroke="#10b981"/><text x="40" y="30" text-anchor="middle" fill="#fff" font-size="11">E1</text></g>
    <g><rect x="0" y="60" width="80" height="50" fill="#10b981" opacity="0.4" stroke="#10b981"/><text x="40" y="90" text-anchor="middle" fill="#fff" font-size="11">E2</text></g>
    <g><rect x="0" y="120" width="80" height="50" fill="#10b981" opacity="0.4" stroke="#10b981"/><text x="40" y="150" text-anchor="middle" fill="#fff" font-size="11">E3</text></g>
    <g><rect x="120" y="0" width="80" height="50" fill="#10b981" opacity="0.4" stroke="#10b981"/><text x="160" y="30" text-anchor="middle" fill="#fff" font-size="11">E4</text></g>
    <g><rect x="120" y="60" width="80" height="50" fill="#10b981" opacity="0.4" stroke="#10b981"/><text x="160" y="90" text-anchor="middle" fill="#fff" font-size="11">E5</text></g>
    <g><rect x="120" y="120" width="80" height="50" fill="#10b981" opacity="0.4" stroke="#10b981"/><text x="160" y="150" text-anchor="middle" fill="#fff" font-size="11">E6</text></g>
    <g><rect x="240" y="0" width="80" height="50" fill="#10b981" opacity="0.4" stroke="#10b981" opacity="0.2"/><text x="280" y="30" text-anchor="middle" fill="#fff" font-size="11">E7</text></g>
    <g><rect x="240" y="60" width="80" height="50" fill="#10b981" opacity="0.4" stroke="#10b981" opacity="0.2"/><text x="280" y="90" text-anchor="middle" fill="#fff" font-size="11">E8</text></g>
    <g><rect x="240" y="120" width="80" height="50" fill="#10b981" opacity="0.4" stroke="#10b981" opacity="0.2"/><text x="280" y="150" text-anchor="middle" fill="#fff" font-size="11">E_n</text></g>
  </g>
  <!-- Output -->
  <g transform="translate(680, 220)">
    <text x="0" y="-10" text-anchor="middle" fill="#94a3b8" font-size="14">Output</text>
    <rect x="-20" y="0" width="80" height="60" fill="#ec4899" opacity="0.5" stroke="#ec4899" rx="4"/>
    <text x="20" y="35" text-anchor="middle" fill="#fff" font-size="11">Σ wi·Ei(x)</text>
  </g>
  <text x="400" y="475" text-anchor="middle" fill="#cbd5e1" font-size="12">代表模型: Mixtral 8x7B / GPT-4 (rumored 16 experts) / DeepSeek-V3 (256 routed + 1 shared)</text>
</svg>