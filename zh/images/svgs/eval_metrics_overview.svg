<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="bold">评估指标全图 (分类·回归·排序·生成)</text>
  <!-- Classification -->
  <g transform="translate(50, 100)">
    <text x="160" y="-10" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="bold">分类</text>
    <rect x="0" y="0" width="320" height="80" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" rx="4"/>
    <text x="160" y="22" text-anchor="middle" fill="#cbd5e1" font-size="12">Accuracy / Precision / Recall / F1</text>
    <text x="160" y="42" text-anchor="middle" fill="#cbd5e1" font-size="12">AUC-ROC / AUC-PR / MCC</text>
    <text x="160" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">不平衡:F1 / PR-AUC 优于 Accuracy</text>
  </g>
  <!-- Regression -->
  <g transform="translate(430, 100)">
    <text x="160" y="-10" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">回归</text>
    <rect x="0" y="0" width="320" height="80" fill="#10b981" opacity="0.2" stroke="#10b981" rx="4"/>
    <text x="160" y="22" text-anchor="middle" fill="#cbd5e1" font-size="12">MSE / RMSE / MAE / MAPE</text>
    <text x="160" y="42" text-anchor="middle" fill="#cbd5e1" font-size="12">R² / Adjusted R²</text>
    <text x="160" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">异常敏感:Huber Loss</text>
  </g>
  <!-- Ranking -->
  <g transform="translate(50, 220)">
    <text x="160" y="-10" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">排序/检索</text>
    <rect x="0" y="0" width="320" height="80" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" rx="4"/>
    <text x="160" y="22" text-anchor="middle" fill="#cbd5e1" font-size="12">NDCG@k / MAP@k / MRR</text>
    <text x="160" y="42" text-anchor="middle" fill="#cbd5e1" font-size="12">Precision@k / Recall@k</text>
    <text x="160" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">推荐/搜索核心</text>
  </g>
  <!-- Generation -->
  <g transform="translate(430, 220)">
    <text x="160" y="-10" text-anchor="middle" fill="#ec4899" font-size="14" font-weight="bold">生成</text>
    <rect x="0" y="0" width="320" height="80" fill="#ec4899" opacity="0.2" stroke="#ec4899" rx="4"/>
    <text x="160" y="22" text-anchor="middle" fill="#cbd5e1" font-size="12">BLEU / ROUGE / METEOR</text>
    <text x="160" y="42" text-anchor="middle" fill="#cbd5e1" font-size="12">chrF / BERTScore / PPL</text>
    <text x="160" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">LLM:MT-Bench/Arena Elo</text>
  </g>
  <!-- Bottom -->
  <g transform="translate(50, 340)">
    <text x="350" y="0" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="bold">业务核心指标 (北极星)</text>
    <text x="350" y="25" text-anchor="middle" fill="#cbd5e1" font-size="12">CTR / 转化率 / 留存 / GMV / 时长 / CSAT</text>
    <text x="350" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">离线指标必须与在线业务对齐, 否则上线即掉指标</text>
  </g>
</svg>