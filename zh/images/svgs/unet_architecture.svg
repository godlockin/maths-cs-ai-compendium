<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="bold">U-Net 语义分割架构</text>
  <!-- Encoder -->
  <g transform="translate(50, 100)">
    <text x="200" y="-10" text-anchor="middle" fill="#94a3b8" font-size="14">Encoder (下采样)</text>
    <rect x="0" y="0" width="100" height="50" fill="#3b82f6" opacity="0.4" stroke="#3b82f6"/>
    <text x="50" y="30" text-anchor="middle" fill="#fff" font-size="11">256×256</text>
    <rect x="0" y="60" width="100" height="50" fill="#3b82f6" opacity="0.4" stroke="#3b82f6"/>
    <text x="50" y="90" text-anchor="middle" fill="#fff" font-size="11">128×128</text>
    <rect x="0" y="120" width="100" height="50" fill="#3b82f6" opacity="0.4" stroke="#3b82f6"/>
    <text x="50" y="150" text-anchor="middle" fill="#fff" font-size="11">64×64</text>
    <rect x="0" y="180" width="100" height="50" fill="#3b82f6" opacity="0.4" stroke="#3b82f6"/>
    <text x="50" y="210" text-anchor="middle" fill="#fff" font-size="11">32×32</text>
    <rect x="0" y="240" width="100" height="50" fill="#3b82f6" opacity="0.4" stroke="#3b82f6"/>
    <text x="50" y="270" text-anchor="middle" fill="#fff" font-size="11">16×16</text>
  </g>
  <!-- Bottleneck -->
  <g transform="translate(50, 380)">
    <rect x="250" y="0" width="100" height="50" fill="#8b5cf6" stroke="#8b5cf6"/>
    <text x="300" y="30" text-anchor="middle" fill="#fff" font-size="11">Bottleneck 8×8</text>
  </g>
  <!-- Decoder -->
  <g transform="translate(450, 100)">
    <text x="200" y="-10" text-anchor="middle" fill="#94a3b8" font-size="14">Decoder (上采样)</text>
    <rect x="300" y="0" width="100" height="50" fill="#10b981" opacity="0.4" stroke="#10b981"/>
    <text x="350" y="30" text-anchor="middle" fill="#fff" font-size="11">16×16</text>
    <rect x="300" y="60" width="100" height="50" fill="#10b981" opacity="0.4" stroke="#10b981"/>
    <text x="350" y="90" text-anchor="middle" fill="#fff" font-size="11">32×32</text>
    <rect x="300" y="120" width="100" height="50" fill="#10b981" opacity="0.4" stroke="#10b981"/>
    <text x="350" y="150" text-anchor="middle" fill="#fff" font-size="11">64×64</text>
    <rect x="300" y="180" width="100" height="50" fill="#10b981" opacity="0.4" stroke="#10b981"/>
    <text x="350" y="210" text-anchor="middle" fill="#fff" font-size="11">128×128</text>
    <rect x="300" y="240" width="100" height="50" fill="#10b981" opacity="0.4" stroke="#10b981"/>
    <text x="350" y="270" text-anchor="middle" fill="#fff" font-size="11">256×256</text>
  </g>
  <!-- Skip connections -->
  <g stroke="#f59e0b" stroke-width="2" fill="none">
    <path d="M 100 25 L 800 25"/>
    <path d="M 100 85 L 800 85"/>
    <path d="M 100 145 L 800 145"/>
    <path d="M 100 205 L 800 205"/>
  </g>
  <text x="450" y="20" fill="#f59e0b" font-size="11" font-weight="bold">Skip Connections (concat/copy)</text>
  <text x="400" y="475" text-anchor="middle" fill="#94a3b8" font-size="12">U-Net: encoder-decoder + skip — 医学影像/遥感/自动驾驶广泛使用</text>
</svg>