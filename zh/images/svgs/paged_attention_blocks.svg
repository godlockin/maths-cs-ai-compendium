<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="bold">KV Cache PagedAttention</text>
  <!-- Tokens -->
  <g transform="translate(50, 200)">
    <text x="100" y="-10" text-anchor="middle" fill="#94a3b8" font-size="14">已生成 Tokens</text>
    <g><rect x="0" y="0" width="30" height="30" fill="#3b82f6" opacity="0.5"/><text x="15" y="20" text-anchor="middle" fill="#fff" font-size="10">t1</text></g>
    <g><rect x="30" y="0" width="30" height="30" fill="#3b82f6" opacity="0.5"/><text x="45" y="20" text-anchor="middle" fill="#fff" font-size="10">t2</text></g>
    <g><rect x="60" y="0" width="30" height="30" fill="#3b82f6" opacity="0.5"/><text x="75" y="20" text-anchor="middle" fill="#fff" font-size="10">t3</text></g>
    <g><rect x="90" y="0" width="30" height="30" fill="#3b82f6" opacity="0.5"/><text x="105" y="20" text-anchor="middle" fill="#fff" font-size="10">t4</text></g>
    <g><rect x="120" y="0" width="30" height="30" fill="#ec4899" opacity="0.7"/><text x="135" y="20" text-anchor="middle" fill="#fff" font-size="10">t5</text></g>
  </g>
  <!-- Traditional -->
  <g transform="translate(280, 100)">
    <text x="120" y="-10" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="bold">传统: 预分配连续显存</text>
    <rect x="0" y="0" width="240" height="40" fill="#ef4444" opacity="0.3" stroke="#ef4444"/>
    <rect x="0" y="40" width="240" height="40" fill="#ef4444" opacity="0.3" stroke="#ef4444"/>
    <rect x="0" y="80" width="240" height="40" fill="#7f1d1d" opacity="0.5" stroke="#7f1d1d"/>
    <text x="120" y="105" text-anchor="middle" fill="#fff" font-size="11">浪费 ~40-60%</text>
  </g>
  <!-- PagedAttention -->
  <g transform="translate(560, 100)">
    <text x="100" y="-10" text-anchor="middle" fill="#10b981" font-size="13" font-weight="bold">PagedAttention: 分页</text>
    <g>
      <rect x="0" y="0" width="32" height="32" fill="#10b981" opacity="0.5" stroke="#10b981"/>
      <rect x="32" y="0" width="32" height="32" fill="#10b981" opacity="0.5" stroke="#10b981"/>
      <rect x="64" y="0" width="32" height="32" fill="#10b981" opacity="0.5" stroke="#10b981"/>
      <rect x="0" y="32" width="32" height="32" fill="#10b981" opacity="0.5" stroke="#10b981"/>
      <rect x="32" y="32" width="32" height="32" fill="#10b981" opacity="0.5" stroke="#10b981"/>
      <rect x="64" y="32" width="32" height="32" fill="#10b981" opacity="0.5" stroke="#10b981"/>
      <rect x="0" y="64" width="32" height="32" fill="#10b981" opacity="0.5" stroke="#10b981"/>
      <rect x="32" y="64" width="32" height="32" fill="#10b981" opacity="0.5" stroke="#10b981"/>
      <rect x="64" y="64" width="32" height="32" fill="#10b981" opacity="0.5" stroke="#10b981"/>
    </g>
    <text x="100" y="115" text-anchor="middle" fill="#fff" font-size="11">块表映射 → 4% 浪费</text>
  </g>
  <!-- Memory usage -->
  <g transform="translate(100, 280)">
    <text x="0" y="0" fill="#94a3b8" font-size="13" font-weight="bold">吞吐量提升 (vLLM)</text>
    <rect x="0" y="15" width="600" height="20" fill="#475569"/>
    <rect x="0" y="15" width="100" height="20" fill="#ef4444" opacity="0.6"/>
    <text x="50" y="50" text-anchor="middle" fill="#fff" font-size="11">传统: 100 tok/s</text>
    <rect x="0" y="65" width="600" height="20" fill="#475569"/>
    <rect x="0" y="65" width="500" height="20" fill="#10b981" opacity="0.6"/>
    <text x="250" y="100" text-anchor="middle" fill="#fff" font-size="11">Paged: 500-2400 tok/s (2-24×)</text>
  </g>
  <text x="400" y="455" text-anchor="middle" fill="#94a3b8" font-size="12">Block size 典型 16 tokens; OS-style 虚拟内存分页; 解决了 fragmentation 问题</text>
</svg>