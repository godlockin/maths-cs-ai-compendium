<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #1a1a1a; }
      .label { font: 13px sans-serif; fill: #333; }
      .small { font: 11px sans-serif; fill: #555; }
      .box-train { fill: #4a90e2; stroke: #1a5490; stroke-width: 2; }
      .box-quant { fill: #7ed321; stroke: #417505; stroke-width: 2; }
      .box-serve { fill: #f5a623; stroke: #a06c00; stroke-width: 2; }
      .box-monitor { fill: #bd10e0; stroke: #730080; stroke-width: 2; }
      .arrow { stroke: #555; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <text x="400" y="35" text-anchor="middle" class="title">LLM 推理部署全景架构</text>

  <!-- Top: User Request -->
  <rect x="320" y="65" width="160" height="40" rx="20" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" class="label">用户请求 (HTTP/gRPC)</text>

  <!-- CDN/Edge -->
  <rect x="300" y="125" width="200" height="40" rx="6" fill="#fff3cd" stroke="#856404" stroke-width="2"/>
  <text x="400" y="150" text-anchor="middle" class="label">CDN / Edge Cache</text>

  <!-- API Gateway -->
  <rect x="290" y="185" width="220" height="40" rx="6" fill="#d4edda" stroke="#155724" stroke-width="2"/>
  <text x="400" y="210" text-anchor="middle" class="label">API Gateway (限流 + 认证 + 路由)</text>

  <!-- Load Balancer -->
  <rect x="320" y="245" width="160" height="30" rx="6" fill="#f8d7da" stroke="#721c24" stroke-width="2"/>
  <text x="400" y="265" text-anchor="middle" class="small">Load Balancer</text>

  <!-- 3 GPU Servers -->
  <rect x="60" y="305" width="180" height="80" rx="8" class="box-serve"/>
  <text x="150" y="330" text-anchor="middle" fill="white" class="label">推理 Pod 1</text>
  <text x="150" y="350" text-anchor="middle" fill="white" class="small">vLLM</text>
  <text x="150" y="365" text-anchor="middle" fill="white" class="small">4× H100 (TP=4)</text>
  <text x="150" y="380" text-anchor="middle" fill="white" class="small">PagedAttention</text>

  <rect x="310" y="305" width="180" height="80" rx="8" class="box-serve"/>
  <text x="400" y="330" text-anchor="middle" fill="white" class="label">推理 Pod 2</text>
  <text x="400" y="350" text-anchor="middle" fill="white" class="small">vLLM</text>
  <text x="400" y="365" text-anchor="middle" fill="white" class="small">4× H100 (TP=4)</text>
  <text x="400" y="380" text-anchor="middle" fill="white" class="small">Speculative</text>

  <rect x="560" y="305" width="180" height="80" rx="8" class="box-serve"/>
  <text x="650" y="330" text-anchor="middle" fill="white" class="label">推理 Pod 3</text>
  <text x="650" y="350" text-anchor="middle" fill="white" class="small">vLLM</text>
  <text x="650" y="365" text-anchor="middle" fill="white" class="small">4× H100 (TP=4)</text>
  <text x="650" y="380" text-anchor="middle" fill="white" class="small">Prompt Cache</text>

  <!-- Model Storage -->
  <rect x="60" y="410" width="180" height="50" rx="6" class="box-train"/>
  <text x="150" y="435" text-anchor="middle" fill="white" class="label">模型仓库 (S3)</text>
  <text x="150" y="453" text-anchor="middle" fill="white" class="small">Llama-3-70B (AWQ)</text>

  <!-- Quantization -->
  <rect x="310" y="410" width="180" height="50" rx="6" class="box-quant"/>
  <text x="400" y="435" text-anchor="middle" fill="white" class="label">量化 (AWQ / GPTQ)</text>
  <text x="400" y="453" text-anchor="middle" fill="white" class="small">INT4 → 35 GB</text>

  <!-- Monitoring -->
  <rect x="560" y="410" width="180" height="50" rx="6" class="box-monitor"/>
  <text x="650" y="435" text-anchor="middle" fill="white" class="label">监控 (Prometheus + Grafana)</text>
  <text x="650" y="453" text-anchor="middle" fill="white" class="small">TTFT / TPOT / QPS</text>

  <!-- Arrows -->
  <path d="M400 105 L400 125" class="arrow"/>
  <path d="M400 165 L400 185" class="arrow"/>
  <path d="M400 225 L400 245" class="arrow"/>
  <path d="M400 275 L150 305" class="arrow"/>
  <path d="M400 275 L400 305" class="arrow"/>
  <path d="M400 275 L650 305" class="arrow"/>

  <!-- Vertical arrows from GPU pods to bottom boxes -->
  <path d="M150 385 L150 410" class="arrow"/>
  <path d="M400 385 L400 410" class="arrow"/>
  <path d="M650 385 L650 410" class="arrow"/>
</svg>
