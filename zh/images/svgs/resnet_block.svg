<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="bold">ResNet 残差连接</text>
  <!-- Plain vs ResNet -->
  <g transform="translate(100, 100)">
    <text x="120" y="-10" text-anchor="middle" fill="#94a3b8" font-size="14">Plain Network</text>
    <rect x="0" y="0" width="240" height="40" fill="#3b82f6" opacity="0.4" stroke="#3b82f6"/>
    <text x="120" y="25" text-anchor="middle" fill="#fff" font-size="12">Conv 1</text>
    <rect x="0" y="50" width="240" height="40" fill="#3b82f6" opacity="0.4" stroke="#3b82f6"/>
    <text x="120" y="75" text-anchor="middle" fill="#fff" font-size="12">Conv 2</text>
    <rect x="0" y="100" width="240" height="40" fill="#3b82f6" opacity="0.4" stroke="#3b82f6"/>
    <text x="120" y="125" text-anchor="middle" fill="#fff" font-size="12">Conv 3</text>
    <line x1="0" y1="40" x2="0" y2="50" stroke="#94a3b8" stroke-width="2"/>
    <line x1="240" y1="40" x2="240" y2="50" stroke="#94a3b8" stroke-width="2"/>
    <line x1="0" y1="90" x2="0" y2="100" stroke="#94a3b8" stroke-width="2"/>
    <line x1="240" y1="90" x2="240" y2="100" stroke="#94a3b8" stroke-width="2"/>
    <text x="120" y="170" text-anchor="middle" fill="#cbd5e1" font-size="13">x → H(x) = F(x)</text>
    <text x="120" y="195" text-anchor="middle" fill="#94a3b8" font-size="11">梯度消失 / 难恒等</text>
  </g>
  <g transform="translate(460, 100)">
    <text x="120" y="-10" text-anchor="middle" fill="#94a3b8" font-size="14">ResNet</text>
    <rect x="0" y="0" width="240" height="40" fill="#10b981" opacity="0.4" stroke="#10b981"/>
    <text x="120" y="25" text-anchor="middle" fill="#fff" font-size="12">Conv 1</text>
    <rect x="0" y="50" width="240" height="40" fill="#10b981" opacity="0.4" stroke="#10b981"/>
    <text x="120" y="75" text-anchor="middle" fill="#fff" font-size="12">Conv 2</text>
    <rect x="0" y="100" width="240" height="40" fill="#10b981" opacity="0.4" stroke="#10b981"/>
    <text x="120" y="125" text-anchor="middle" fill="#fff" font-size="12">Conv 3</text>
    <!-- skip connection -->
    <path d="M 0 20 Q -50 20 -50 80 Q -50 120 0 120" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <circle cx="120" cy="120" r="4" fill="#f59e0b"/>
    <text x="120" y="170" text-anchor="middle" fill="#cbd5e1" font-size="13">x → H(x) = F(x) + x</text>
    <text x="120" y="195" text-anchor="middle" fill="#94a3b8" font-size="11">梯度直达 / 易恒等</text>
  </g>
  <!-- Variants -->
  <g transform="translate(100, 320)">
    <text x="0" y="0" fill="#94a3b8" font-size="14" font-weight="bold">变体</text>
    <text x="0" y="30" fill="#cbd5e1" font-size="12">· Identity: y = F(x) + x</text>
    <text x="0" y="55" fill="#cbd5e1" font-size="12">· Projection (维度变化): y = F(x) + W_s · x</text>
    <text x="0" y="80" fill="#cbd5e1" font-size="12">· Pre-activation: x → LN → ReLU → Conv</text>
    <text x="0" y="105" fill="#cbd5e1" font-size="12">· ResNeXt: 分组卷积 (cardinality)</text>
  </g>
  <g transform="translate(450, 320)">
    <text x="0" y="0" fill="#94a3b8" font-size="14" font-weight="bold">里程碑</text>
    <text x="0" y="30" fill="#cbd5e1" font-size="12">· ResNet-50/101/152 (ILSVRC 2015)</text>
    <text x="0" y="55" fill="#cbd5e1" font-size="12">· 3.57% top-5 错误 (超越人类 5.1%)</text>
    <text x="0" y="80" fill="#cbd5e1" font-size="12">· 现代 Transformer 也广泛使用残差</text>
    <text x="0" y="105" fill="#cbd5e1" font-size="12">· 与 LayerNorm 配合构建大模型</text>
  </g>
</svg>