<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #1a1a1a; }
      .label { font: 13px sans-serif; fill: #333; }
      .small { font: 11px sans-serif; fill: #555; }
      .box-blue { fill: #4a90e2; stroke: #1a5490; stroke-width: 2; }
      .box-green { fill: #7ed321; stroke: #417505; stroke-width: 2; }
      .box-orange { fill: #f5a623; stroke: #a06c00; stroke-width: 2; }
      .box-purple { fill: #bd10e0; stroke: #730080; stroke-width: 2; }
      .arrow { stroke: #555; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <text x="400" y="35" text-anchor="middle" class="title">AI Agent 5 大协议栈 (2024-2026)</text>

  <!-- Layer 0: User -->
  <rect x="320" y="60" width="160" height="40" rx="20" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" class="label">用户 / 应用</text>

  <!-- Layer 1: LLM -->
  <rect x="280" y="115" width="240" height="45" rx="8" class="box-purple"/>
  <text x="400" y="135" text-anchor="middle" fill="white" class="label">LLM (Claude / GPT / Gemini)</text>
  <text x="400" y="150" text-anchor="middle" fill="white" class="small">推理引擎</text>

  <!-- Layer 2: MCP -->
  <rect x="80" y="180" width="320" height="60" rx="8" class="box-blue"/>
  <text x="240" y="200" text-anchor="middle" fill="white" class="label">MCP (Model Context Protocol)</text>
  <text x="240" y="218" text-anchor="middle" fill="white" class="small">Anthropic 2024-11 · 1000+ Tools</text>
  <text x="240" y="232" text-anchor="middle" fill="white" class="small">Resources + Tools + Prompts</text>

  <!-- Layer 3: A2A / ANP -->
  <rect x="420" y="180" width="320" height="60" rx="8" class="box-green"/>
  <text x="580" y="200" text-anchor="middle" fill="white" class="label">A2A / ANP / ACP</text>
  <text x="580" y="218" text-anchor="middle" fill="white" class="small">Google 2025 · IBM ACP · ANP 开源</text>
  <text x="580" y="232" text-anchor="middle" fill="white" class="small">Agent ↔ Agent</text>

  <!-- Layer 4: Tools -->
  <rect x="60" y="265" width="180" height="60" rx="8" class="box-orange"/>
  <text x="150" y="290" text-anchor="middle" fill="white" class="label">Tools (工具)</text>
  <text x="150" y="308" text-anchor="middle" fill="white" class="small">API / 数据库 / 文件</text>

  <rect x="260" y="265" width="180" height="60" rx="8" class="box-orange"/>
  <text x="350" y="290" text-anchor="middle" fill="white" class="label">Agents (Agent)</text>
  <text x="350" y="308" text-anchor="middle" fill="white" class="small">其他 AI / 工具</text>

  <rect x="460" y="265" width="180" height="60" rx="8" class="box-orange"/>
  <text x="550" y="290" text-anchor="middle" fill="white" class="label">Memory (记忆)</text>
  <text x="550" y="308" text-anchor="middle" fill="white" class="small">Mem0 / Letta</text>

  <rect x="660" y="265" width="120" height="60" rx="8" class="box-orange"/>
  <text x="720" y="290" text-anchor="middle" fill="white" class="small">Computer</text>
  <text x="720" y="308" text-anchor="middle" fill="white" class="small">Use</text>

  <!-- Layer 5: Multi-Agent Frameworks -->
  <rect x="80" y="350" width="640" height="50" rx="8" fill="#17a2b8" stroke="#0c5460" stroke-width="2"/>
  <text x="400" y="372" text-anchor="middle" fill="white" class="label">Multi-Agent 框架: AutoGen / CrewAI / LangGraph / Smolagents</text>
  <text x="400" y="388" text-anchor="middle" fill="white" class="small">Microsoft / CrewAI / LangChain / HuggingFace</text>

  <!-- Layer 6: 5 大自进化 -->
  <rect x="80" y="420" width="640" height="55" rx="8" fill="#e74c3c" stroke="#922b21" stroke-width="2"/>
  <text x="400" y="442" text-anchor="middle" fill="white" class="label">自进化 5 大范式: Reflexion / Voyager / Self-RAG / AlphaEvolve / AI Scientist</text>
  <text x="400" y="458" text-anchor="middle" fill="white" class="small">持续学习 + 反思 + 技能积累</text>

  <!-- Arrows -->
  <path d="M400 100 L400 115" class="arrow"/>
  <path d="M280 160 L200 180" class="arrow"/>
  <path d="M520 160 L600 180" class="arrow"/>
  <path d="M150 240 L150 265" class="arrow"/>
  <path d="M350 240 L350 265" class="arrow"/>
  <path d="M550 240 L550 265" class="arrow"/>
  <path d="M720 240 L720 265" class="arrow"/>
  <path d="M400 400 L400 420" class="arrow"/>
</svg>
