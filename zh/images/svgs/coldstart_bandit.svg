<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="bold">推荐系统冷启动与 Bandit</text>
  <!-- Cold start types -->
  <g transform="translate(50, 100)">
    <text x="160" y="-10" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="bold">3 类冷启动</text>
    <rect x="0" y="0" width="160" height="60" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" rx="3"/>
    <text x="80" y="25" text-anchor="middle" fill="#fff" font-size="12">用户冷启动</text>
    <text x="80" y="45" text-anchor="middle" fill="#cbd5e1" font-size="10">新用户无行为</text>
    <rect x="170" y="0" width="160" height="60" fill="#10b981" opacity="0.3" stroke="#10b981" rx="3"/>
    <text x="250" y="25" text-anchor="middle" fill="#fff" font-size="12">物品冷启动</text>
    <text x="250" y="45" text-anchor="middle" fill="#cbd5e1" font-size="10">新物品无交互</text>
    <rect x="0" y="70" width="160" height="60" fill="#f59e0b" opacity="0.3" stroke="#f59e0b" rx="3"/>
    <text x="80" y="95" text-anchor="middle" fill="#fff" font-size="12">系统冷启动</text>
    <text x="80" y="115" text-anchor="middle" fill="#cbd5e1" font-size="10">全新平台</text>
    <rect x="170" y="70" width="160" height="60" fill="#ec4899" opacity="0.3" stroke="#ec4899" rx="3"/>
    <text x="250" y="95" text-anchor="middle" fill="#fff" font-size="12">引导反馈</text>
    <text x="250" y="115" text-anchor="middle" fill="#cbd5e1" font-size="10">注册时收集偏好</text>
  </g>
  <!-- Bandit flow -->
  <g transform="translate(50, 260)">
    <text x="340" y="-10" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">Bandit 探索 (Thompson Sampling)</text>
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="100" height="50" fill="#10b981" opacity="0.3" stroke="#10b981"/>
      <text x="50" y="30" text-anchor="middle" fill="#fff" font-size="11">观测</text>
    </g>
    <g transform="translate(120,0)">
      <rect x="0" y="0" width="100" height="50" fill="#3b82f6" opacity="0.3" stroke="#3b82f6"/>
      <text x="50" y="30" text-anchor="middle" fill="#fff" font-size="11">采样 a~θ</text>
    </g>
    <g transform="translate(240,0)">
      <rect x="0" y="0" width="100" height="50" fill="#f59e0b" opacity="0.3" stroke="#f59e0b"/>
      <text x="50" y="30" text-anchor="middle" fill="#fff" font-size="11">推荐 a</text>
    </g>
    <g transform="translate(360,0)">
      <rect x="0" y="0" width="100" height="50" fill="#ec4899" opacity="0.3" stroke="#ec4899"/>
      <text x="50" y="30" text-anchor="middle" fill="#fff" font-size="11">观察 reward</text>
    </g>
    <g transform="translate(480,0)">
      <rect x="0" y="0" width="100" height="50" fill="#8b5cf6" opacity="0.3" stroke="#8b5cf6"/>
      <text x="50" y="30" text-anchor="middle" fill="#fff" font-size="11">更新 θ</text>
    </g>
    <g stroke="#94a3b8" stroke-width="2" fill="none">
      <line x1="100" y1="25" x2="120" y2="25" marker-end="url(#b-arr)"/>
      <line x1="220" y1="25" x2="240" y2="25" marker-end="url(#b-arr)"/>
      <line x1="340" y1="25" x2="360" y2="25" marker-end="url(#b-arr)"/>
      <line x1="460" y1="25" x2="480" y2="25" marker-end="url(#b-arr)"/>
      <line x1="530" y1="50" x2="50" y2="80" marker-end="url(#b-arr)"/>
    </g>
    <defs>
      <marker id="b-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#94a3b8"/></marker>
    </defs>
  </g>
  <text x="400" y="450" text-anchor="middle" fill="#94a3b8" font-size="12">LinUCB / Thompson Sampling / Contextual Bandit — 平衡探索与利用</text>
</svg>