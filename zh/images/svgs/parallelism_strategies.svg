<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="bold">数据并行 (DP) vs 张量并行 (TP) vs 流水线并行 (PP)</text>
  <!-- DP -->
  <g transform="translate(40, 90)">
    <text x="115" y="-10" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="bold">数据并行 DP</text>
    <rect x="0" y="0" width="230" height="40" fill="#3b82f6" opacity="0.3" stroke="#3b82f6"/>
    <text x="115" y="25" text-anchor="middle" fill="#fff" font-size="11">Model (完整副本)</text>
    <rect x="0" y="50" width="230" height="40" fill="#3b82f6" opacity="0.3" stroke="#3b82f6"/>
    <text x="115" y="75" text-anchor="middle" fill="#fff" font-size="11">Model (完整副本)</text>
    <rect x="0" y="100" width="230" height="40" fill="#3b82f6" opacity="0.3" stroke="#3b82f6"/>
    <text x="115" y="125" text-anchor="middle" fill="#fff" font-size="11">Model (完整副本)</text>
    <text x="115" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">AllReduce 同步梯度</text>
    <text x="115" y="180" text-anchor="middle" fill="#cbd5e1" font-size="10">易扩展, 但单卡需容纳完整模型</text>
  </g>
  <!-- TP -->
  <g transform="translate(290, 90)">
    <text x="115" y="-10" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">张量并行 TP</text>
    <g>
      <rect x="0" y="0" width="55" height="40" fill="#10b981" opacity="0.3" stroke="#10b981"/>
      <text x="27" y="25" text-anchor="middle" fill="#fff" font-size="10">W₁/2</text>
      <rect x="60" y="0" width="55" height="40" fill="#10b981" opacity="0.3" stroke="#10b981"/>
      <text x="87" y="25" text-anchor="middle" fill="#fff" font-size="10">W₂/2</text>
      <rect x="125" y="0" width="55" height="40" fill="#10b981" opacity="0.3" stroke="#10b981"/>
      <text x="152" y="25" text-anchor="middle" fill="#fff" font-size="10">W₃/2</text>
      <rect x="185" y="0" width="55" height="40" fill="#10b981" opacity="0.3" stroke="#10b981"/>
      <text x="212" y="25" text-anchor="middle" fill="#fff" font-size="10">W₄/2</text>
    </g>
    <text x="115" y="60" text-anchor="middle" fill="#94a3b8" font-size="10">同一层, 切分到多卡</text>
    <text x="115" y="80" text-anchor="middle" fill="#cbd5e1" font-size="10">AllReduce 通信频繁</text>
  </g>
  <!-- PP -->
  <g transform="translate(540, 90)">
    <text x="115" y="-10" text-anchor="middle" fill="#ec4899" font-size="14" font-weight="bold">流水线并行 PP</text>
    <rect x="0" y="0" width="55" height="120" fill="#ec4899" opacity="0.3" stroke="#ec4899"/>
    <text x="27" y="65" text-anchor="middle" fill="#fff" font-size="10">Layer 1-4</text>
    <rect x="60" y="0" width="55" height="120" fill="#ec4899" opacity="0.3" stroke="#ec4899"/>
    <text x="87" y="65" text-anchor="middle" fill="#fff" font-size="10">Layer 5-8</text>
    <rect x="125" y="0" width="55" height="120" fill="#ec4899" opacity="0.3" stroke="#ec4899"/>
    <text x="152" y="65" text-anchor="middle" fill="#fff" font-size="10">Layer 9-12</text>
    <rect x="185" y="0" width="55" height="120" fill="#ec4899" opacity="0.3" stroke="#ec4899"/>
    <text x="212" y="65" text-anchor="middle" fill="#fff" font-size="10">Layer 13-16</text>
    <text x="115" y="140" text-anchor="middle" fill="#94a3b8" font-size="10">不同层, 不同卡</text>
  </g>
  <!-- Combined -->
  <g transform="translate(50, 290)">
    <text x="700" y="0" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">组合策略: 3D Parallelism (DP × TP × PP)</text>
    <text x="350" y="30" text-anchor="middle" fill="#cbd5e1" font-size="11">代表: Llama-405B 训练 = 16K H100, 4-way TP + 16-way PP + 64-way DP</text>
    <text x="350" y="55" text-anchor="middle" fill="#cbd5e1" font-size="11">DeepSeek-V3 = 2048 H800, 8-way Expert Parallel + ZeRO</text>
    <text x="350" y="80" text-anchor="middle" fill="#94a3b8" font-size="10">优化: ZeRO / FSDP / Megatron / DeepSpeed / MindSpore</text>
  </g>
</svg>