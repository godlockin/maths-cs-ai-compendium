<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="bold">Mixture of Experts Router 决策</text>
  <!-- Token flow -->
  <g transform="translate(50, 200)">
    <text x="50" y="-10" text-anchor="middle" fill="#94a3b8" font-size="13">输入 x</text>
    <rect x="0" y="0" width="100" height="100" fill="#3b82f6" opacity="0.5" stroke="#3b82f6"/>
    <text x="50" y="55" text-anchor="middle" fill="#fff" font-size="14">x</text>
  </g>
  <!-- Router -->
  <g transform="translate(220, 100)">
    <text x="100" y="-10" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="bold">Router W_g</text>
    <rect x="0" y="0" width="200" height="200" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="2" rx="6"/>
    <text x="100" y="30" text-anchor="middle" fill="#f59e0b" font-size="12">g(x) = softmax(W_g · x)</text>
    <text x="100" y="55" text-anchor="middle" fill="#f59e0b" font-size="12">→ p ∈ R^N</text>
    <text x="100" y="80" text-anchor="middle" fill="#cbd5e1" font-size="11">Top-k: indices + weights</text>
    <text x="100" y="105" text-anchor="middle" fill="#94a3b8" font-size="10">Noise / load-balance loss</text>
  </g>
  <!-- Output scores -->
  <g transform="translate(460, 100)">
    <text x="140" y="-10" text-anchor="middle" fill="#94a3b8" font-size="13">路由概率分布 (N experts)</text>
    <g>
      <rect x="0" y="0" width="280" height="14" fill="#1e293b"/>
      <rect x="0" y="0" width="220" height="14" fill="#10b981" opacity="0.7"/>
      <text x="290" y="12" fill="#cbd5e1" font-size="10">E1: 0.78 ✓</text>
    </g>
    <g>
      <rect x="0" y="20" width="280" height="14" fill="#1e293b"/>
      <rect x="0" y="20" width="80" height="14" fill="#10b981" opacity="0.7"/>
      <text x="290" y="32" fill="#cbd5e1" font-size="10">E2: 0.28</text>
    </g>
    <g>
      <rect x="0" y="40" width="280" height="14" fill="#1e293b"/>
      <rect x="0" y="40" width="60" height="14" fill="#10b981" opacity="0.5"/>
      <text x="290" y="52" fill="#cbd5e1" font-size="10">E3: 0.21 ✓ (top-k=2)</text>
    </g>
    <g>
      <rect x="0" y="60" width="280" height="14" fill="#1e293b"/>
      <rect x="0" y="60" width="15" height="14" fill="#10b981" opacity="0.4"/>
      <text x="290" y="72" fill="#cbd5e1" font-size="10">E4: 0.05</text>
    </g>
    <g>
      <rect x="0" y="80" width="280" height="14" fill="#1e293b"/>
      <rect x="0" y="80" width="8" height="14" fill="#10b981" opacity="0.3"/>
      <text x="290" y="92" fill="#cbd5e1" font-size="10">E5..E8: ≈0</text>
    </g>
  </g>
  <!-- Output formula -->
  <g transform="translate(100, 380)">
    <text x="300" y="0" text-anchor="middle" fill="#cbd5e1" font-size="14">y = Σ g_i(x) · E_i(x)  其中 i ∈ TopK(g(x))</text>
    <text x="300" y="30" text-anchor="middle" fill="#94a3b8" font-size="11">负载均衡损失: L_balance = α · N · Σ f_i · p_i  (f_i = expert fraction)</text>
    <text x="300" y="55" text-anchor="middle" fill="#94a3b8" font-size="11">Mixtral 8x7B: k=2, 47B 总参数, 13B 激活 → 推理成本 ≈ 13B</text>
  </g>
</svg>