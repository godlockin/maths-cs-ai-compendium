<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="bold">Speculative Decoding 加速</text>
  <!-- Draft model -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="200" height="100" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="100" y="30" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="bold">Draft Model</text>
    <text x="100" y="50" text-anchor="middle" fill="#cbd5e1" font-size="11">(e.g. 7B small)</text>
    <text x="100" y="75" text-anchor="middle" fill="#94a3b8" font-size="10">快速生成 K 个候选</text>
  </g>
  <!-- Target model -->
  <g transform="translate(50, 290)">
    <rect x="0" y="0" width="200" height="100" fill="#10b981" opacity="0.3" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="100" y="30" text-anchor="middle" fill="#10b981" font-size="13" font-weight="bold">Target Model</text>
    <text x="100" y="50" text-anchor="middle" fill="#cbd5e1" font-size="11">(e.g. 70B large)</text>
    <text x="100" y="75" text-anchor="middle" fill="#94a3b8" font-size="10">并行验证 K 个 token</text>
  </g>
  <!-- Arrows -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M 250 180 L 320 180 L 320 230" marker-end="url(#arr1)"/>
    <path d="M 320 230 L 320 280 L 250 290" marker-end="url(#arr2)"/>
  </g>
  <defs>
    <marker id="arr1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#94a3b8"/></marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#94a3b8"/></marker>
  </defs>
  <!-- Tokens -->
  <g transform="translate(350, 100)">
    <text x="180" y="-10" text-anchor="middle" fill="#94a3b8" font-size="13">Draft 生成 (K=4-8 tokens)</text>
    <g><rect x="0" y="0" width="50" height="40" fill="#3b82f6" opacity="0.5" stroke="#3b82f6"/><text x="25" y="25" text-anchor="middle" fill="#fff" font-size="11">t1</text></g>
    <g><rect x="55" y="0" width="50" height="40" fill="#3b82f6" opacity="0.5" stroke="#3b82f6"/><text x="80" y="25" text-anchor="middle" fill="#fff" font-size="11">t2</text></g>
    <g><rect x="110" y="0" width="50" height="40" fill="#3b82f6" opacity="0.5" stroke="#3b82f6"/><text x="135" y="25" text-anchor="middle" fill="#fff" font-size="11">t3</text></g>
    <g><rect x="165" y="0" width="50" height="40" fill="#3b82f6" opacity="0.5" stroke="#3b82f6"/><text x="190" y="25" text-anchor="middle" fill="#fff" font-size="11">t4</text></g>
    <g><rect x="220" y="0" width="50" height="40" fill="#3b82f6" opacity="0.5" stroke="#3b82f6"/><text x="245" y="25" text-anchor="middle" fill="#fff" font-size="11">t5</text></g>
  </g>
  <!-- Acceptance -->
  <g transform="translate(350, 200)">
    <text x="180" y="-10" text-anchor="middle" fill="#94a3b8" font-size="13">Target 验证 (Rejection Sampling)</text>
    <g><rect x="0" y="0" width="50" height="40" fill="#10b981" opacity="0.6" stroke="#10b981"/><text x="25" y="25" text-anchor="middle" fill="#fff" font-size="10">✓</text></g>
    <g><rect x="55" y="0" width="50" height="40" fill="#10b981" opacity="0.6" stroke="#10b981"/><text x="80" y="25" text-anchor="middle" fill="#fff" font-size="10">✓</text></g>
    <g><rect x="110" y="0" width="50" height="40" fill="#ef4444" opacity="0.6" stroke="#ef4444"/><text x="135" y="25" text-anchor="middle" fill="#fff" font-size="10">✗</text></g>
    <g><rect x="165" y="0" width="50" height="40" fill="#10b981" opacity="0.6" stroke="#10b981"/><text x="190" y="25" text-anchor="middle" fill="#fff" font-size="10">✓</text></g>
    <g><rect x="220" y="0" width="50" height="40" fill="#10b981" opacity="0.6" stroke="#10b981"/><text x="245" y="25" text-anchor="middle" fill="#fff" font-size="10">✓</text></g>
  </g>
  <!-- Acceptance math -->
  <g transform="translate(50, 420)">
    <text x="350" y="0" text-anchor="middle" fill="#cbd5e1" font-size="13">r(accept) = min(1, p_target(x) / p_draft(x))</text>
    <text x="350" y="20" text-anchor="middle" fill="#94a3b8" font-size="11">无偏采样 + 2-3× 加速 (Llama-70B + 7B draft)</text>
  </g>
</svg>