<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="bold">Confusion Matrix 与 F1/Precision/Recall</text>
  <!-- Matrix -->
  <g transform="translate(150, 100)">
    <text x="0" y="-40" fill="#94a3b8" font-size="13">预测</text>
    <text x="-50" y="120" text-anchor="middle" fill="#94a3b8" font-size="13" transform="rotate(-90, -50, 120)">真实</text>
    <!-- Column headers -->
    <text x="125" y="0" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="bold">Pred +</text>
    <text x="375" y="0" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="bold">Pred −</text>
    <!-- Row headers -->
    <text x="-15" y="80" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="bold">Real +</text>
    <text x="-15" y="220" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="bold">Real −</text>
    <!-- Cells -->
    <rect x="50" y="20" width="150" height="100" fill="#10b981" opacity="0.5"/>
    <text x="125" y="60" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">TP</text>
    <text x="125" y="80" text-anchor="middle" fill="#cbd5e1" font-size="11">真阳性</text>
    <rect x="300" y="20" width="150" height="100" fill="#ef4444" opacity="0.3"/>
    <text x="375" y="60" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">FN</text>
    <text x="375" y="80" text-anchor="middle" fill="#cbd5e1" font-size="11">假阴性</text>
    <rect x="50" y="160" width="150" height="100" fill="#ef4444" opacity="0.3"/>
    <text x="125" y="200" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">FP</text>
    <text x="125" y="220" text-anchor="middle" fill="#cbd5e1" font-size="11">假阳性</text>
    <rect x="300" y="160" width="150" height="100" fill="#10b981" opacity="0.5"/>
    <text x="375" y="200" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">TN</text>
    <text x="375" y="220" text-anchor="middle" fill="#cbd5e1" font-size="11">真阴性</text>
  </g>
  <!-- Formulas -->
  <g transform="translate(50, 360)">
    <text x="350" y="0" text-anchor="middle" fill="#cbd5e1" font-size="13">Precision = TP / (TP + FP)</text>
    <text x="350" y="25" text-anchor="middle" fill="#cbd5e1" font-size="13">Recall = TP / (TP + FN)</text>
    <text x="350" y="50" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="bold">F1 = 2·P·R / (P + R) (调和平均)</text>
  </g>
</svg>