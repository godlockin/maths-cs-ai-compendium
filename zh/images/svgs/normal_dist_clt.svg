<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <style>
      .title { font: bold 22px sans-serif; fill: #1a1a1a; }
      .label { font: 13px sans-serif; fill: #333; }
      .small { font: 11px sans-serif; fill: #555; }
    </style>
  </defs>
  <text x="350" y="30" text-anchor="middle" class="title">正态分布与中心极限定理</text>

  <!-- 总体分布 (偏态) -->
  <rect x="60" y="100" width="220" height="220" fill="#f8f9fa" stroke="#333"/>
  <text x="170" y="125" text-anchor="middle" class="label">总体 (非正态, 偏态)</text>
  <path d="M 80 280 Q 120 240 160 200 Q 180 180 200 240 Q 230 280 260 280" fill="#f5a623" fill-opacity="0.3" stroke="#a06c00" stroke-width="2"/>
  <line x1="140" y1="280" x2="140" y2="285" stroke="#333" stroke-width="1"/>
  <text x="140" y="300" text-anchor="middle" class="small">μ</text>

  <!-- 抽样箭头 -->
  <path d="M 290 200 L 360 200" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/></marker>
  <text x="325" y="195" text-anchor="middle" class="small" fill="#e74c3c">抽样 n 个</text>

  <!-- 样本均值分布 (正态) -->
  <rect x="380" y="100" width="260" height="220" fill="#f8f9fa" stroke="#333"/>
  <text x="510" y="125" text-anchor="middle" class="label">样本均值 X̄ 分布 (n 大 → 正态)</text>
  <path d="M 400 280 Q 420 240 440 200 Q 480 100 510 130 Q 540 100 580 200 Q 600 240 620 280" fill="#4a90e2" fill-opacity="0.4" stroke="#1a5490" stroke-width="2"/>
  <line x1="510" y1="100" x2="510" y2="285" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="510" y="320" text-anchor="middle" class="small">μ</text>
  <text x="455" y="280" text-anchor="middle" class="small">μ-σ/√n</text>
  <text x="565" y="280" text-anchor="middle" class="small">μ+σ/√n</text>

  <!-- 公式 -->
  <rect x="60" y="370" width="580" height="100" rx="8" fill="#fff3cd" stroke="#856404"/>
  <text x="350" y="400" text-anchor="middle" class="label" fill="#856404">中心极限定理 (CLT):</text>
  <text x="350" y="425" text-anchor="middle" class="label" fill="#333">(X̄ - μ) / (σ/√n) →d N(0, 1)</text>
  <text x="350" y="450" text-anchor="middle" class="small" fill="#666">n ≥ 30 通常足够, 解释正态分布为何普遍</text>
</svg>
