<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <style>
      .title { font: bold 22px sans-serif; fill: #1a1a1a; }
      .label { font: 13px sans-serif; fill: #333; }
      .small { font: 11px sans-serif; fill: #555; }
    </style>
  </defs>
  <text x="350" y="30" text-anchor="middle" class="title">矩阵乘法 (GEMM) 示意</text>

  <!-- A 矩阵 2x3 -->
  <text x="120" y="80" text-anchor="middle" class="label" font-weight="bold">A (2×3)</text>
  <g transform="translate(60, 95)">
    <rect width="40" height="40" fill="#f8f9fa" stroke="#333"/><rect x="40" width="40" height="40" fill="#f8f9fa" stroke="#333"/><rect x="80" width="40" height="40" fill="#f8f9fa" stroke="#333"/>
    <rect y="40" width="40" height="40" fill="#f8f9fa" stroke="#333"/><rect x="40" y="40" width="40" height="40" fill="#f8f9fa" stroke="#333"/><rect x="80" y="40" width="40" height="40" fill="#f8f9fa" stroke="#333"/>
    <text x="20" y="25" text-anchor="middle" class="small">1</text>
    <text x="60" y="25" text-anchor="middle" class="small">2</text>
    <text x="100" y="25" text-anchor="middle" class="small">3</text>
    <text x="20" y="65" text-anchor="middle" class="small">4</text>
    <text x="60" y="65" text-anchor="middle" class="small">5</text>
    <text x="100" y="65" text-anchor="middle" class="small">6</text>
  </g>

  <!-- × -->
  <text x="210" y="130" text-anchor="middle" class="label" font-weight="bold">×</text>

  <!-- B 矩阵 3x2 -->
  <text x="320" y="80" text-anchor="middle" class="label" font-weight="bold">B (3×2)</text>
  <g transform="translate(260, 95)">
    <rect width="40" height="40" fill="#f8f9fa" stroke="#333"/><rect x="40" width="40" height="40" fill="#f8f9fa" stroke="#333"/>
    <rect y="40" width="40" height="40" fill="#f8f9fa" stroke="#333"/><rect x="40" y="40" width="40" height="40" fill="#f8f9fa" stroke="#333"/>
    <rect y="80" width="40" height="40" fill="#f8f9fa" stroke="#333"/><rect x="40" y="80" width="40" height="40" fill="#f8f9fa" stroke="#333"/>
    <text x="20" y="25" text-anchor="middle" class="small">7</text>
    <text x="60" y="25" text-anchor="middle" class="small">8</text>
    <text x="20" y="65" text-anchor="middle" class="small">9</text>
    <text x="60" y="65" text-anchor="middle" class="small">10</text>
    <text x="20" y="105" text-anchor="middle" class="small">11</text>
    <text x="60" y="105" text-anchor="middle" class="small">12</text>
  </g>

  <!-- = -->
  <text x="380" y="130" text-anchor="middle" class="label" font-weight="bold">=</text>

  <!-- C 矩阵 2x2 -->
  <text x="500" y="80" text-anchor="middle" class="label" font-weight="bold">C (2×2)</text>
  <g transform="translate(450, 95)">
    <rect width="50" height="50" fill="#d4edda" stroke="#155724" stroke-width="2"/><rect x="50" width="50" height="50" fill="#d4edda" stroke="#155724" stroke-width="2"/>
    <rect y="50" width="50" height="50" fill="#d4edda" stroke="#155724" stroke-width="2"/><rect x="50" y="50" width="50" height="50" fill="#d4edda" stroke="#155724" stroke-width="2"/>
    <text x="25" y="30" text-anchor="middle" class="label" fill="#155724">58</text>
    <text x="75" y="30" text-anchor="middle" class="label" fill="#155724">64</text>
    <text x="25" y="80" text-anchor="middle" class="label" fill="#155724">139</text>
    <text x="75" y="80" text-anchor="middle" class="label" fill="#155724">154</text>
  </g>

  <!-- 公式 -->
  <rect x="50" y="230" width="600" height="80" rx="8" fill="#fff3cd" stroke="#856404"/>
  <text x="60" y="255" class="small" font-weight="bold" fill="#856404">公式:</text>
  <text x="60" y="275" class="small" fill="#333">C[i,j] = Σ_k A[i,k] × B[k,j]</text>
  <text x="60" y="295" class="small" fill="#666">例: C[0,0] = 1×7 + 2×9 + 3×11 = 7 + 18 + 33 = 58</text>

  <!-- 复杂度 -->
  <rect x="50" y="340" width="600" height="120" rx="8" fill="#f8d7da" stroke="#721c24"/>
  <text x="60" y="365" class="small" font-weight="bold" fill="#721c24">复杂度与优化:</text>
  <text x="60" y="385" class="small" fill="#333">• 时间: O(m × n × k) = O(n³) (方阵)</text>
  <text x="60" y="405" class="small" fill="#333">• 内存: O(mn + nk + mk)</text>
  <text x="60" y="425" class="small" fill="#333">• 优化: Strassen (O(n^2.81)) / Coppersmith-Winograd / GPU Tensor Core</text>
  <text x="60" y="445" class="small" fill="#333">• 深度学习核心: 每层都是 GEMM → 优化 = 模型加速</text>
</svg>
