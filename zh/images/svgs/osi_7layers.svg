<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="bold">OSI 7 层网络协议栈</text>
  <!-- Layers -->
  <g transform="translate(150, 90)">
    <g><rect x="0" y="0" width="500" height="40" fill="#8b5cf6" opacity="0.5" stroke="#8b5cf6"/>
       <text x="10" y="25" fill="#fff" font-size="13" font-weight="bold">7. 应用层</text>
       <text x="490" y="25" text-anchor="end" fill="#cbd5e1" font-size="11">HTTP / gRPC / MQTT</text>
    </g>
    <g><rect x="0" y="40" width="500" height="40" fill="#3b82f6" opacity="0.5" stroke="#3b82f6"/>
       <text x="10" y="65" fill="#fff" font-size="13" font-weight="bold">6. 表示层</text>
       <text x="490" y="65" text-anchor="end" fill="#cbd5e1" font-size="11">TLS / JSON / Protobuf</text>
    </g>
    <g><rect x="0" y="80" width="500" height="40" fill="#10b981" opacity="0.5" stroke="#10b981"/>
       <text x="10" y="105" fill="#fff" font-size="13" font-weight="bold">5. 会话层</text>
       <text x="490" y="105" text-anchor="end" fill="#cbd5e1" font-size="11">RPC / WebSocket / SIP</text>
    </g>
    <g><rect x="0" y="120" width="500" height="40" fill="#f59e0b" opacity="0.5" stroke="#f59e0b"/>
       <text x="10" y="145" fill="#fff" font-size="13" font-weight="bold">4. 传输层</text>
       <text x="490" y="145" text-anchor="end" fill="#cbd5e1" font-size="11">TCP / UDP / QUIC</text>
    </g>
    <g><rect x="0" y="160" width="500" height="40" fill="#ec4899" opacity="0.5" stroke="#ec4899"/>
       <text x="10" y="185" fill="#fff" font-size="13" font-weight="bold">3. 网络层</text>
       <text x="490" y="185" text-anchor="end" fill="#cbd5e1" font-size="11">IP / ICMP / OSPF / BGP</text>
    </g>
    <g><rect x="0" y="200" width="500" height="40" fill="#06b6d4" opacity="0.5" stroke="#06b6d4"/>
       <text x="10" y="225" fill="#fff" font-size="13" font-weight="bold">2. 数据链路层</text>
       <text x="490" y="225" text-anchor="end" fill="#cbd5e1" font-size="11">Ethernet / PPP / VLAN</text>
    </g>
    <g><rect x="0" y="240" width="500" height="40" fill="#facc15" opacity="0.5" stroke="#facc15"/>
       <text x="10" y="265" fill="#fff" font-size="13" font-weight="bold">1. 物理层</text>
       <text x="490" y="265" text-anchor="end" fill="#cbd5e1" font-size="11">光纤 / WiFi / 5G NR</text>
    </g>
  </g>
  <text x="400" y="430" text-anchor="middle" fill="#94a3b8" font-size="12">面试常考点: TCP 三次握手 / TLS 1.3 / HTTP/2 多路复用 / QUIC 0-RTT / BGP 路由</text>
  <text x="400" y="455" text-anchor="middle" fill="#94a3b8" font-size="11">实际工程多用 4 层 TCP/IP 模型: 应用 / 传输 / 网络 / 链路</text>
</svg>