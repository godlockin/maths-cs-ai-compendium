<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <style>
      .title { font: bold 22px sans-serif; fill: #1a1a1a; }
      .label { font: 13px sans-serif; fill: #333; }
      .small { font: 11px sans-serif; fill: #555; }
    </style>
  </defs>
  <text x="350" y="30" text-anchor="middle" class="title">AlphaFold 2 架构总览</text>

  <!-- 输入 -->
  <rect x="50" y="80" width="120" height="50" rx="6" fill="#4a90e2" fill-opacity="0.3" stroke="#1a5490" stroke-width="2"/>
  <text x="110" y="100" text-anchor="middle" class="label" font-weight="bold">氨基酸序列</text>
  <text x="110" y="120" text-anchor="middle" class="small">M K T A Y I ...</text>

  <rect x="50" y="160" width="120" height="50" rx="6" fill="#7ed321" fill-opacity="0.3" stroke="#417505" stroke-width="2"/>
  <text x="110" y="180" text-anchor="middle" class="label" font-weight="bold">MSA</text>
  <text x="110" y="200" text-anchor="middle" class="small">多序列比对</text>

  <rect x="50" y="240" width="120" height="50" rx="6" fill="#f5a623" fill-opacity="0.3" stroke="#a06c00" stroke-width="2"/>
  <text x="110" y="260" text-anchor="middle" class="label" font-weight="bold">Pair Features</text>
  <text x="110" y="280" text-anchor="middle" class="small">配对特征</text>

  <path d="M 170 105 L 240 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M 170 185 L 240 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M 170 265 L 240 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- Evoformer -->
  <rect x="240" y="80" width="220" height="200" rx="10" fill="#fff3cd" stroke="#856404" stroke-width="2"/>
  <text x="350" y="110" text-anchor="middle" class="label" font-weight="bold" fill="#856404">Evoformer (48 层)</text>
  <text x="350" y="135" text-anchor="middle" class="small">MSA Representation</text>
  <text x="350" y="160" text-anchor="middle" class="small">+ Pair Representation</text>
  <text x="350" y="185" text-anchor="middle" class="small">↓ 交叉 attention</text>
  <text x="350" y="210" text-anchor="middle" class="small">↓ Iterative refinement</text>
  <text x="350" y="240" text-anchor="middle" class="small" fill="#666">三角注意力 (Triangle Attention)</text>
  <text x="350" y="258" text-anchor="middle" class="small" fill="#666">三角乘法更新</text>
  <text x="350" y="275" text-anchor="middle" class="small" fill="#666">外积均值</text>

  <path d="M 460 180 L 520 180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- Structure Module -->
  <rect x="520" y="80" width="130" height="200" rx="10" fill="#f8d7da" stroke="#721c24" stroke-width="2"/>
  <text x="585" y="110" text-anchor="middle" class="label" font-weight="bold" fill="#721c24">Structure Module</text>
  <text x="585" y="135" text-anchor="middle" class="small">(8 层)</text>
  <text x="585" y="160" text-anchor="middle" class="small">IPA</text>
  <text x="585" y="178" text-anchor="middle" class="small">Invariant Point Attention</text>
  <text x="585" y="200" text-anchor="middle" class="small">Backbone 更新</text>
  <text x="585" y="225" text-anchor="middle" class="small" fill="#666">+ 角 / 位置</text>
  <text x="585" y="255" text-anchor="middle" class="small" fill="#666">循环 refine</text>

  <path d="M 650 180 L 670 180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- 输出 -->
  <text x="690" y="180" text-anchor="middle" class="small" fill="#1a1a1a" font-weight="bold">3D 结构</text>

  <!-- 关键数据 -->
  <rect x="50" y="330" width="600" height="140" rx="8" fill="#f8f9fa" stroke="#333"/>
  <text x="70" y="355" class="small" font-weight="bold">关键数据 (AlphaFold 2):</text>
  <text x="70" y="375" class="small">• 训练数据: PDB + UniClust30 (约 35 万 MSA)</text>
  <text x="70" y="395" class="small">• 模型: 93M 参数 (Evoformer) + 38M (Structure Module)</text>
  <text x="70" y="415" class="small">• 训练: 128 TPUv3, 11 天 (~$1.4M)</text>
  <text x="70" y="435" class="small">• 性能: CASP14 GDT-TS 92.4 (实验级精度)</text>
  <text x="70" y="455" class="small" fill="#666">• 后续: AlphaFold-Multimer (复合体) / AlphaFold 3 (蛋白+核酸+小分子, 2024)</text>

  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
</svg>
