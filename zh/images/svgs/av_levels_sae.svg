<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <style>
      .title { font: bold 22px sans-serif; fill: #1a1a1a; }
      .label { font: 13px sans-serif; fill: #333; }
      .small { font: 11px sans-serif; fill: #555; }
    </style>
  </defs>
  <text x="350" y="30" text-anchor="middle" class="title">自动驾驶分级 (SAE J3016)</text>

  <rect x="40" y="80" width="620" height="50" rx="6" fill="#95a5a6" fill-opacity="0.2" stroke="#5d6d7e"/>
  <text x="60" y="100" class="label" font-weight="bold">L0 - 无自动化</text>
  <text x="60" y="120" class="small">司机负责全部驾驶任务 (ABS / 巡航仅作为辅助)</text>

  <rect x="40" y="140" width="620" height="50" rx="6" fill="#f5a623" fill-opacity="0.2" stroke="#a06c00"/>
  <text x="60" y="160" class="label" font-weight="bold" fill="#a06c00">L1 - 驾驶辅助 (Driver Assistance)</text>
  <text x="60" y="180" class="small">单一功能自动: 自适应巡航 (ACC) / 车道保持 (LKAS)</text>

  <rect x="40" y="200" width="620" height="50" rx="6" fill="#f5a623" fill-opacity="0.3" stroke="#a06c00"/>
  <text x="60" y="220" class="label" font-weight="bold" fill="#a06c00">L2 - 部分自动化 (Partial)</text>
  <text x="60" y="240" class="small">同时自动加速 + 转向: Tesla FSD / 小鹏 XNGP / 蔚来 NOP+ / 华为 ADS 2.0 (司机仍需监督)</text>

  <rect x="40" y="260" width="620" height="60" rx="6" fill="#7ed321" fill-opacity="0.3" stroke="#417505"/>
  <text x="60" y="282" class="label" font-weight="bold" fill="#417505">L3 - 有条件自动化 (Conditional)</text>
  <text x="60" y="302" class="small">特定场景系统全权, 但需司机随时接管 (Audi A8 2017, Honda Legend 2021)</text>
  <text x="60" y="318" class="small" fill="#666" font-style="italic">💡 2024 法律仍未广泛承认, Mercedes Drive Pilot 首批 (德国 60 km/h)</text>

  <rect x="40" y="330" width="620" height="60" rx="6" fill="#4a90e2" fill-opacity="0.3" stroke="#1a5490" stroke-width="2"/>
  <text x="60" y="352" class="label" font-weight="bold" fill="#1a5490">L4 - 高度自动化 (High)</text>
  <text x="60" y="372" class="small">限定区域 (ODD) 全自动: Waymo / Cruise / 百度 Apollo / 小马智行 / AutoX (特定城市 / 路段)</text>
  <text x="60" y="388" class="small" fill="#666">无方向盘, 无司机, 出 ODD 系统停车</text>

  <rect x="40" y="400" width="620" height="50" rx="6" fill="#bd10e0" fill-opacity="0.3" stroke="#730080" stroke-width="2"/>
  <text x="60" y="420" class="label" font-weight="bold" fill="#730080">L5 - 完全自动化 (Full)</text>
  <text x="60" y="440" class="small">任何场景完全自动, 与人类驾驶无差 — 科幻, 预计 2040+</text>

  <text x="350" y="480" text-anchor="middle" class="small" fill="#666" font-style="italic">2026 现状: L2 普及, L3 试点, L4 商业化, L5 仍是愿景</text>
</svg>
