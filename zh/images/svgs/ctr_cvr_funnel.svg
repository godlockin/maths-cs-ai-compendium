<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="bold">CTR / CVR 漏斗与样本偏差</text>
  <!-- Funnel -->
  <g transform="translate(150, 100)">
    <text x="250" y="-10" text-anchor="middle" fill="#94a3b8" font-size="14">推荐漏斗</text>
    <rect x="50" y="0" width="400" height="40" fill="#3b82f6" opacity="0.6"/>
    <text x="250" y="25" text-anchor="middle" fill="#fff" font-size="12">曝光 (Impression) — 100%</text>
    <rect x="100" y="50" width="300" height="40" fill="#10b981" opacity="0.6"/>
    <text x="250" y="75" text-anchor="middle" fill="#fff" font-size="12">点击 (Click) — CTR = 8%</text>
    <rect x="150" y="100" width="200" height="40" fill="#f59e0b" opacity="0.6"/>
    <text x="250" y="125" text-anchor="middle" fill="#fff" font-size="12">转化 (Conversion) — CVR = 2%</text>
    <rect x="200" y="150" width="100" height="40" fill="#ec4899" opacity="0.6"/>
    <text x="250" y="175" text-anchor="middle" fill="#fff" font-size="12">付费 (Pay) — 0.3%</text>
  </g>
  <!-- Bias -->
  <g transform="translate(50, 320)">
    <text x="350" y="0" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="bold">样本偏差 (Sample Selection Bias)</text>
    <text x="350" y="25" text-anchor="middle" fill="#cbd5e1" font-size="12">训练数据仅来自"已点击 → 已转化", 未点击样本被丢弃</text>
    <text x="350" y="50" text-anchor="middle" fill="#cbd5e1" font-size="12">→ 模型高估 CVR, 上线后效果骤降</text>
    <text x="350" y="75" text-anchor="middle" fill="#10b981" font-size="12">解法: ESMM / Entire Space Multi-task Model (阿里 2018)</text>
  </g>
</svg>