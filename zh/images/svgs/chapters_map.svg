<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #1a1a1a; }
      .axis { font: 14px sans-serif; fill: #555; }
      .label { font: 12px sans-serif; fill: #333; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .node-math { fill: #4a90e2; stroke: #1a5490; stroke-width: 2; }
      .node-ml { fill: #7ed321; stroke: #417505; stroke-width: 2; }
      .node-dl { fill: #f5a623; stroke: #a06c00; stroke-width: 2; }
      .node-app { fill: #bd10e0; stroke: #730080; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="35" text-anchor="middle" class="title">AI 全栈工程师 25 章学习地图</text>

  <!-- Row 1: Math Foundation -->
  <g transform="translate(50, 80)">
    <rect width="100" height="60" rx="8" class="node-math"/>
    <text x="50" y="35" text-anchor="middle" fill="white" class="axis">Ch01 线性代数</text>
  </g>
  <g transform="translate(180, 80)">
    <rect width="100" height="60" rx="8" class="node-math"/>
    <text x="50" y="35" text-anchor="middle" fill="white" class="axis">Ch02 矩阵</text>
  </g>
  <g transform="translate(310, 80)">
    <rect width="100" height="60" rx="8" class="node-math"/>
    <text x="50" y="35" text-anchor="middle" fill="white" class="axis">Ch03 微积分</text>
  </g>
  <g transform="translate(440, 80)">
    <rect width="100" height="60" rx="8" class="node-math"/>
    <text x="50" y="35" text-anchor="middle" fill="white" class="axis">Ch04 统计</text>
  </g>
  <g transform="translate(570, 80)">
    <rect width="100" height="60" rx="8" class="node-math"/>
    <text x="50" y="35" text-anchor="middle" fill="white" class="axis">Ch05 概率信息论</text>
  </g>

  <!-- Arrows row 1 -->
  <path d="M150 110 L180 110" class="arrow"/>
  <path d="M280 110 L310 110" class="arrow"/>
  <path d="M410 110 L440 110" class="arrow"/>
  <path d="M540 110 L570 110" class="arrow"/>

  <!-- Row 2: ML -->
  <g transform="translate(120, 180)">
    <rect width="120" height="60" rx="8" class="node-ml"/>
    <text x="60" y="35" text-anchor="middle" fill="white" class="axis">Ch06 经典 ML + RL</text>
  </g>
  <g transform="translate(280, 180)">
    <rect width="120" height="60" rx="8" class="node-ml"/>
    <text x="60" y="35" text-anchor="middle" fill="white" class="axis">Ch07 NLP + Transformer</text>
  </g>
  <g transform="translate(440, 180)">
    <rect width="120" height="60" rx="8" class="node-ml"/>
    <text x="60" y="35" text-anchor="middle" fill="white" class="axis">Ch08 CV + Diffusion</text>
  </g>

  <path d="M180 240 L240 240" class="arrow"/>
  <path d="M340 240 L440 240" class="arrow"/>

  <!-- Row 3: Multimodal -->
  <g transform="translate(80, 280)">
    <rect width="100" height="60" rx="8" class="node-dl"/>
    <text x="50" y="35" text-anchor="middle" fill="white" class="axis">Ch09 语音</text>
  </g>
  <g transform="translate(220, 280)">
    <rect width="100" height="60" rx="8" class="node-dl"/>
    <text x="50" y="35" text-anchor="middle" fill="white" class="axis">Ch10 多模态</text>
  </g>
  <g transform="translate(360, 280)">
    <rect width="100" height="60" rx="8" class="node-dl"/>
    <text x="50" y="35" text-anchor="middle" fill="white" class="axis">Ch11 自主系统</text>
  </g>
  <g transform="translate(500, 280)">
    <rect width="100" height="60" rx="8" class="node-dl"/>
    <text x="50" y="35" text-anchor="middle" fill="white" class="axis">Ch12 GNN</text>
  </g>

  <!-- Row 4: Engineering -->
  <g transform="translate(60, 380)">
    <rect width="100" height="60" rx="8" class="node-app"/>
    <text x="50" y="35" text-anchor="middle" fill="white" class="axis">Ch13 系统OS</text>
  </g>
  <g transform="translate(190, 380)">
    <rect width="100" height="60" rx="8" class="node-app"/>
    <text x="50" y="35" text-anchor="middle" fill="white" class="axis">Ch14 算法</text>
  </g>
  <g transform="translate(320, 380)">
    <rect width="100" height="60" rx="8" class="node-app"/>
    <text x="50" y="35" text-anchor="middle" fill="white" class="axis">Ch15 工程</text>
  </g>
  <g transform="translate(450, 380)">
    <rect width="100" height="60" rx="8" class="node-app"/>
    <text x="50" y="35" text-anchor="middle" fill="white" class="axis">Ch16 SIMD/GPU</text>
  </g>
  <g transform="translate(580, 380)">
    <rect width="100" height="60" rx="8" class="node-app"/>
    <text x="50" y="35" text-anchor="middle" fill="white" class="axis">Ch17 推理</text>
  </g>

  <!-- Row 5: Application + Frontier -->
  <g transform="translate(20, 470)">
    <rect width="100" height="40" rx="8" fill="#e74c3c" stroke="#a04020" stroke-width="2"/>
    <text x="50" y="25" text-anchor="middle" fill="white" font-size="12">Ch18 系统设计</text>
  </g>
  <g transform="translate(140, 470)">
    <rect width="100" height="40" rx="8" fill="#e74c3c" stroke="#a04020" stroke-width="2"/>
    <text x="50" y="25" text-anchor="middle" fill="white" font-size="12">Ch19 应用</text>
  </g>
  <g transform="translate(260, 470)">
    <rect width="100" height="40" rx="8" fill="#e74c3c" stroke="#a04020" stroke-width="2"/>
    <text x="50" y="25" text-anchor="middle" fill="white" font-size="12">Ch20 前沿</text>
  </g>
  <g transform="translate(380, 470)">
    <rect width="100" height="40" rx="8" fill="#9b59b6" stroke="#5b3578" stroke-width="2"/>
    <text x="50" y="25" text-anchor="middle" fill="white" font-size="12">Ch21 对齐</text>
  </g>
  <g transform="translate(500, 470)">
    <rect width="100" height="40" rx="8" fill="#9b59b6" stroke="#5b3578" stroke-width="2"/>
    <text x="50" y="25" text-anchor="middle" fill="white" font-size="12">Ch22 Eval</text>
  </g>
  <g transform="translate(620, 470)">
    <rect width="100" height="40" rx="8" fill="#9b59b6" stroke="#5b3578" stroke-width="2"/>
    <text x="50" y="25" text-anchor="middle" fill="white" font-size="12">Ch23 Agent</text>
  </g>
</svg>
