<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="bold">Ring AllReduce 通信模式</text>
  <!-- Ring 1 -->
  <g transform="translate(400, 250)">
    <circle r="160" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8 4"/>
    <g id="ring-nodes">
      <circle cx="0" cy="-160" r="22" fill="#3b82f6"/>
      <text x="0" y="-155" text-anchor="middle" fill="#fff" font-size="12">0</text>
      <circle cx="160" cy="0" r="22" fill="#3b82f6"/>
      <text x="160" y="5" text-anchor="middle" fill="#fff" font-size="12">1</text>
      <circle cx="0" cy="160" r="22" fill="#3b82f6"/>
      <text x="0" y="165" text-anchor="middle" fill="#fff" font-size="12">2</text>
      <circle cx="-160" cy="0" r="22" fill="#3b82f6"/>
      <text x="-160" y="5" text-anchor="middle" fill="#fff" font-size="12">3</text>
    </g>
    <!-- Arrows -->
    <g stroke="#f59e0b" stroke-width="2" fill="none">
      <path d="M 20 -150 L 130 -10" marker-end="url(#arr-r)"/>
      <path d="M 160 20 L 20 130" marker-end="url(#arr-r)"/>
      <path d="M -20 150 L -130 10" marker-end="url(#arr-r)"/>
      <path d="M -160 -20 L -20 -130" marker-end="url(#arr-r)"/>
    </g>
    <text x="0" y="200" text-anchor="middle" fill="#cbd5e1" font-size="13">Step 1: Reduce-Scatter</text>
    <text x="0" y="220" text-anchor="middle" fill="#94a3b8" font-size="11">每节点累计一段梯度分片</text>
  </g>
  <defs>
    <marker id="arr-r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <text x="50" y="90" fill="#94a3b8" font-size="13">节点 (worker): N 个 GPU</text>
  <text x="50" y="115" fill="#94a3b8" font-size="13">通信量: 2(N-1)·M/N ≈ 2M</text>
  <text x="50" y="140" fill="#94a3b8" font-size="13">带宽最优, 已被 NCCL 深度优化</text>
  <text x="50" y="165" fill="#f59e0b" font-size="13" font-weight="bold">两步: Reduce-Scatter → AllGather</text>
</svg>