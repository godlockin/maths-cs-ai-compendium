<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <style>
      .title { font: bold 22px sans-serif; fill: #1a1a1a; }
      .label { font: 13px sans-serif; fill: #333; }
      .small { font: 11px sans-serif; fill: #555; }
    </style>
  </defs>
  <text x="350" y="30" text-anchor="middle" class="title">Tree of Thoughts (ToT) 推理</text>

  <!-- 根节点 -->
  <rect x="300" y="80" width="100" height="40" rx="6" fill="#4a90e2" fill-opacity="0.3" stroke="#1a5490" stroke-width="2"/>
  <text x="350" y="105" text-anchor="middle" class="small" font-weight="bold">问题</text>

  <!-- Level 1 -->
  <g transform="translate(80, 160)">
    <rect width="80" height="30" rx="4" fill="#7ed321" fill-opacity="0.3" stroke="#417505"/>
    <text x="40" y="20" text-anchor="middle" class="small">思考 A</text>
  </g>
  <g transform="translate(180, 160)">
    <rect width="80" height="30" rx="4" fill="#7ed321" fill-opacity="0.3" stroke="#417505"/>
    <text x="40" y="20" text-anchor="middle" class="small">思考 B</text>
  </g>
  <g transform="translate(280, 160)">
    <rect width="80" height="30" rx="4" fill="#e74c3c" fill-opacity="0.3" stroke="#922b21"/>
    <text x="40" y="20" text-anchor="middle" class="small">思考 C ❌</text>
  </g>
  <g transform="translate(380, 160)">
    <rect width="80" height="30" rx="4" fill="#7ed321" fill-opacity="0.3" stroke="#417505"/>
    <text x="40" y="20" text-anchor="middle" class="small">思考 D</text>
  </g>
  <g transform="translate(480, 160)">
    <rect width="80" height="30" rx="4" fill="#7ed321" fill-opacity="0.3" stroke="#417505"/>
    <text x="40" y="20" text-anchor="middle" class="small">思考 E</text>
  </g>

  <!-- 边 根 -> L1 -->
  <path d="M 320 120 L 120 160" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M 340 120 L 220 160" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M 350 120 L 320 160" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M 360 120 L 420 160" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M 380 120 L 520 160" stroke="#333" stroke-width="1" fill="none"/>

  <!-- Level 2 (只展开 A B D E) -->
  <g transform="translate(40, 240)">
    <rect width="60" height="25" rx="3" fill="#d4edda" stroke="#155724"/>
    <text x="30" y="17" text-anchor="middle" class="small">a1</text>
  </g>
  <g transform="translate(110, 240)">
    <rect width="60" height="25" rx="3" fill="#d4edda" stroke="#155724"/>
    <text x="30" y="17" text-anchor="middle" class="small">a2</text>
  </g>
  <g transform="translate(180, 240)">
    <rect width="60" height="25" rx="3" fill="#f5a623" fill-opacity="0.3" stroke="#a06c00"/>
    <text x="30" y="17" text-anchor="middle" class="small">b1 ★</text>
  </g>
  <g transform="translate(250, 240)">
    <rect width="60" height="25" rx="3" fill="#d4edda" stroke="#155724"/>
    <text x="30" y="17" text-anchor="middle" class="small">b2</text>
  </g>
  <g transform="translate(370, 240)">
    <rect width="60" height="25" rx="3" fill="#d4edda" stroke="#155724"/>
    <text x="30" y="17" text-anchor="middle" class="small">d1</text>
  </g>
  <g transform="translate(440, 240)">
    <rect width="60" height="25" rx="3" fill="#d4edda" stroke="#155724"/>
    <text x="30" y="17" text-anchor="middle" class="small">d2</text>
  </g>
  <g transform="translate(510, 240)">
    <rect width="60" height="25" rx="3" fill="#d4edda" stroke="#155724"/>
    <text x="30" y="17" text-anchor="middle" class="small">e1</text>
  </g>

  <!-- 边 L1 -> L2 -->
  <path d="M 120 190 L 70 240" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M 120 190 L 140 240" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M 220 190 L 210 240" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M 220 190 L 280 240" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M 420 190 L 400 240" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M 420 190 L 470 240" stroke="#333" stroke-width="1" fill="none"/>
  <path d="M 520 190 L 540 240" stroke="#333" stroke-width="1" fill="none"/>

  <!-- 评估 -->
  <g transform="translate(200, 320)">
    <rect width="300" height="60" rx="6" fill="#fff3cd" stroke="#856404" stroke-width="2"/>
    <text x="150" y="20" text-anchor="middle" class="label" font-weight="bold" fill="#856404">评估 + 剪枝</text>
    <text x="150" y="40" text-anchor="middle" class="small">BFS / DFS + LLM 自评</text>
    <text x="150" y="55" text-anchor="middle" class="small" fill="#666">b1 是最有希望的分支 ★</text>
  </g>

  <path d="M 210 265 L 280 320" stroke="#e74c3c" stroke-width="2" fill="none" stroke-dasharray="3,3"/>

  <!-- 答案 -->
  <rect x="240" y="420" width="220" height="40" rx="6" fill="#d4edda" stroke="#155724" stroke-width="2"/>
  <text x="350" y="445" text-anchor="middle" class="label" font-weight="bold" fill="#155724">最终答案 (b1 → b1.1 → ...)</text>

  <path d="M 350 380 L 350 420" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- 关键 -->
  <text x="350" y="485" text-anchor="middle" class="small" fill="#666">ToT (Yao 2023): 把推理组织为树, 探索 + 评估 + 剪枝, 适合复杂推理</text>
</svg>
