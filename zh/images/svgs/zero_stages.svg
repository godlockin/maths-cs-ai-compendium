<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="bold">ZeRO 优化器状态分片 (DeepSpeed)</text>
  <!-- Stage 0 -->
  <g transform="translate(50, 100)">
    <text x="100" y="-10" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="bold">Stage 0 (DP)</text>
    <rect x="0" y="0" width="200" height="30" fill="#3b82f6" opacity="0.5"/>
    <text x="100" y="20" text-anchor="middle" fill="#fff" font-size="11">全模型 + 全优化器 (16×M)</text>
    <rect x="0" y="35" width="200" height="30" fill="#3b82f6" opacity="0.5"/>
    <text x="100" y="55" text-anchor="middle" fill="#fff" font-size="11">全梯度 + 全参数</text>
  </g>
  <!-- Stage 1 -->
  <g transform="translate(290, 100)">
    <text x="100" y="-10" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="bold">Stage 1 (+ Optimizer)</text>
    <rect x="0" y="0" width="200" height="30" fill="#10b981" opacity="0.5"/>
    <text x="100" y="20" text-anchor="middle" fill="#fff" font-size="11">优化器分片 (4×M)</text>
    <rect x="0" y="35" width="200" height="30" fill="#3b82f6" opacity="0.5"/>
    <text x="100" y="55" text-anchor="middle" fill="#fff" font-size="11">全梯度 + 全参数</text>
  </g>
  <!-- Stage 2 -->
  <g transform="translate(530, 100)">
    <text x="100" y="-10" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="bold">Stage 2 (+ Gradient)</text>
    <rect x="0" y="0" width="200" height="30" fill="#10b981" opacity="0.5"/>
    <text x="100" y="20" text-anchor="middle" fill="#fff" font-size="11">优化器分片 (2×M)</text>
    <rect x="0" y="35" width="200" height="30" fill="#10b981" opacity="0.5"/>
    <text x="100" y="55" text-anchor="middle" fill="#fff" font-size="11">梯度分片</text>
  </g>
  <!-- Stage 3 -->
  <g transform="translate(290, 280)">
    <text x="100" y="-10" text-anchor="middle" fill="#ec4899" font-size="13" font-weight="bold">Stage 3 (FSDP) (+ Params)</text>
    <rect x="0" y="0" width="200" height="30" fill="#10b981" opacity="0.5"/>
    <text x="100" y="20" text-anchor="middle" fill="#fff" font-size="11">优化器分片 (M)</text>
    <rect x="0" y="35" width="200" height="30" fill="#10b981" opacity="0.5"/>
    <text x="100" y="55" text-anchor="middle" fill="#fff" font-size="11">梯度分片</text>
    <rect x="0" y="70" width="200" height="30" fill="#10b981" opacity="0.5"/>
    <text x="100" y="90" text-anchor="middle" fill="#fff" font-size="11">参数分片</text>
  </g>
  <text x="400" y="430" text-anchor="middle" fill="#cbd5e1" font-size="13">通信: 前向+反向额外 all-gather; Stage 3 与 FSDP 等价</text>
  <text x="400" y="455" text-anchor="middle" fill="#94a3b8" font-size="11">代表: DeepSpeed / FSDP / PyTorch FSDP2 / Megatron</text>
</svg>