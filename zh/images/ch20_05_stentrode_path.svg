<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="360" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
    <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
    <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
    <marker id="a-dc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">Synchron Stentrode 植入路径</text>

  <text x="360" y="55" text-anchor="middle" font-size="11" fill="#64748b">不开颅路径: 颈静脉 → 上矢状窦 → 运动皮层血管壁</text>

  <!-- Step 1: Neck (jugular) — left -->
  <g transform="translate(60,90)">
    <!-- Shoulder / neck silhouette -->
    <rect x="0" y="0" width="160" height="80" fill="#fee9e7" stroke="#dc2626" rx="4"/>
    <text x="80" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">① 颈静脉入路</text>
    <!-- vessel -->
    <line x1="50" y1="40" x2="50" y2="70" stroke="#dc2626" stroke-width="6"/>
    <line x1="50" y1="70" x2="120" y2="70" stroke="#dc2626" stroke-width="6"/>
    <text x="120" y="50" font-size="10" fill="#dc2626">jugular vein</text>
    <text x="80" y="95" text-anchor="middle" font-size="9" fill="#64748b">皮肤穿刺点, 微创</text>
  </g>

  <!-- Step 2: catheter up through subclavian to brain -->
  <g transform="translate(220,90)">
    <rect x="0" y="0" width="160" height="80" fill="#fef3c7" stroke="#d97706" rx="4"/>
    <text x="80" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">② 经锁骨下静脉</text>
    <!-- vessel path to brain -->
    <line x1="20" y1="45" x2="80" y2="45" stroke="#d97706" stroke-width="6"/>
    <line x1="80" y1="45" x2="80" y2="10" stroke="#d97706" stroke-width="6"/>
    <text x="100" y="50" font-size="10" fill="#d97706">导管</text>
    <text x="80" y="95" text-anchor="middle" font-size="9" fill="#64748b">沿血管向上推送</text>
  </g>

  <!-- Step 3: Superior sagittal sinus -->
  <g transform="translate(380,90)">
    <rect x="0" y="0" width="160" height="80" fill="#dbeafe" stroke="#2563eb" rx="4"/>
    <text x="80" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">③ 上矢状窦</text>
    <!-- brain with sinus vessel on top -->
    <ellipse cx="80" cy="55" rx="55" ry="22" fill="#fafbfc" stroke="#475569"/>
    <line x1="30" y1="38" x2="130" y2="38" stroke="#2563eb" stroke-width="5"/>
    <!-- stentrode pill -->
    <rect x="74" y="32" width="14" height="6" rx="1" fill="#d97706"/>
    <text x="80" y="95" text-anchor="middle" font-size="9" fill="#64748b">superior sagittal sinus</text>
  </g>

  <!-- Step 4: motor cortex deployment -->
  <g transform="translate(540,90)">
    <rect x="0" y="0" width="160" height="80" fill="#dcfce7" stroke="#16a34a" rx="4"/>
    <text x="80" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">④ 撑开在血管壁</text>
    <ellipse cx="80" cy="50" rx="50" ry="20" fill="#fafbfc" stroke="#475569"/>
    <line x1="40" y1="40" x2="120" y2="40" stroke="#16a34a" stroke-width="5"/>
    <!-- expanded stent array -->
    <rect x="55" y="30" width="50" height="20" rx="3" fill="#16a34a" fill-opacity="0.4" stroke="#16a34a" stroke-width="1.4"/>
    <!-- 16 electrodes -->
    <line x1="60" y1="40" x2="60" y2="48" stroke="#16a34a" stroke-width="1.2"/>
    <line x1="65" y1="40" x2="65" y2="48" stroke="#16a34a" stroke-width="1.2"/>
    <line x1="70" y1="40" x2="70" y2="48" stroke="#16a34a" stroke-width="1.2"/>
    <line x1="75" y1="40" x2="75" y2="48" stroke="#16a34a" stroke-width="1.2"/>
    <line x1="80" y1="40" x2="80" y2="48" stroke="#16a34a" stroke-width="1.2"/>
    <line x1="85" y1="40" x2="85" y2="48" stroke="#16a34a" stroke-width="1.2"/>
    <line x1="90" y1="40" x2="90" y2="48" stroke="#16a34a" stroke-width="1.2"/>
    <line x1="95" y1="40" x2="95" y2="48" stroke="#16a34a" stroke-width="1.2"/>
    <text x="60" y="62" font-size="9" font-weight="600" fill="#16a34a">16 电极触点</text>
    <text x="80" y="95" text-anchor="middle" font-size="9" fill="#64748b">贴在运动皮层血管壁</text>
  </g>

  <!-- Path arrows -->
  <line x1="220" y1="130" x2="380" y2="130" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-64748b)"/>
  <line x1="380" y1="130" x2="540" y2="130" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-64748b)"/>
  <line x1="220" y1="130" x2="540" y2="130" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-64748b)"/>

  <!-- Comparison: open skull vs stentrode -->
  <g transform="translate(60,220)">
    <text x="300" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">对比: 传统开颅路径 vs Stentrode 微创路径</text>

    <g transform="translate(40,15)">
      <rect x="0" y="0" width="250" height="80" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
      <text x="125" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">传统开颅路径</text>
      <text x="20" y="40" font-size="10" fill="#475569">• 颅骨切除 (craniotomy)</text>
      <text x="20" y="54" font-size="10" fill="#475569">• 硬脑膜切开</text>
      <text x="20" y="68" font-size="10" fill="#475569">• 皮层穿透或表面电极植入</text>
    </g>

    <g transform="translate(370,15)">
      <rect x="0" y="0" width="270" height="80" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
      <text x="135" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">Stentrode 微创血管内</text>
      <text x="20" y="40" font-size="10" fill="#475569">• 仅颈静脉穿刺</text>
      <text x="20" y="54" font-size="10" fill="#475569">• 血管内推送, 不穿透皮层</text>
      <text x="20" y="68" font-size="10" fill="#475569">• 适合高手术风险人群 (ALS)</text>
    </g>
  </g>

</svg>