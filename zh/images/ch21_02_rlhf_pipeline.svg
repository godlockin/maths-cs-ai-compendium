<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="280" fill="#fafbfc"/>
<rect x="0" y="0" width="720" height="36" fill="#2563eb" rx="0"/>
<text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">RLHF 三步流水线: SFT → RM → PPO</text>

<!-- Step 1: SFT -->
<rect x="40" y="60" width="180" height="80" rx="6" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">SFT</text>
<text x="130" y="106" text-anchor="middle" font-size="10" fill="#334155">监督微调</text>
<text x="130" y="124" text-anchor="middle" font-size="9" fill="#475569">π_base → π_SFT</text>

<!-- arrow -->
<line x1="225" y1="100" x2="265" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>

<!-- Step 2: RM -->
<rect x="270" y="60" width="180" height="80" rx="6" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="1.5"/>
<text x="360" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">RM</text>
<text x="360" y="106" text-anchor="middle" font-size="10" fill="#334155">奖励模型</text>
<text x="360" y="124" text-anchor="middle" font-size="9" fill="#475569">Bradley-Terry 极大似然</text>

<!-- arrow -->
<line x1="455" y1="100" x2="495" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>

<!-- Step 3: PPO -->
<rect x="500" y="60" width="180" height="80" rx="6" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="1.5"/>
<text x="590" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">PPO</text>
<text x="590" y="106" text-anchor="middle" font-size="10" fill="#334155">策略优化</text>
<text x="590" y="124" text-anchor="middle" font-size="9" fill="#475569">KL 约束 + clipping</text>

<!-- Bottom: data flow -->
<rect x="40" y="160" width="180" height="50" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="130" y="180" text-anchor="middle" font-size="10" fill="#475569">数据: 提示-回复对</text>
<text x="130" y="198" text-anchor="middle" font-size="9" fill="#64748b">几万到几十万</text>
<line x1="130" y1="140" x2="130" y2="160" stroke="#64748b" stroke-width="1"/>

<rect x="270" y="160" width="180" height="50" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="360" y="180" text-anchor="middle" font-size="10" fill="#475569">数据: 偏好对 (y_w, y_l)</text>
<text x="360" y="198" text-anchor="middle" font-size="9" fill="#64748b">几万对</text>
<line x1="360" y1="140" x2="360" y2="160" stroke="#64748b" stroke-width="1"/>

<rect x="500" y="160" width="180" height="50" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="590" y="180" text-anchor="middle" font-size="10" fill="#475569">目标: KL 约束下最大化 r</text>
<text x="590" y="198" text-anchor="middle" font-size="9" fill="#64748b">alignment tax 权衡</text>
<line x1="590" y1="140" x2="590" y2="160" stroke="#64748b" stroke-width="1"/>

<!-- final model -->
<rect x="270" y="225" width="180" height="40" rx="4" fill="#9333ea" fill-opacity="0.10" stroke="#9333ea" stroke-width="1.5"/>
<text x="360" y="250" text-anchor="middle" font-size="11" font-weight="600" fill="#581c87">对齐模型 π_θ</text>
<line x1="590" y1="210" x2="360" y2="225" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#a-9333ea)"/>
<line x1="360" y1="210" x2="360" y2="225" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#a-9333ea)"/>
<line x1="130" y1="210" x2="360" y2="225" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#a-9333ea)"/>
</svg>
