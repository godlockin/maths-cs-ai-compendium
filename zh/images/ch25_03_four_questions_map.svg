<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="700" height="280" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">4 道题对应 4 类 ML 系统设计场景 (推荐/搜索/排序)</text>

  <!-- Quadrant grid: 4 scenarios -->
  <!-- Top-left: Content Recommendation -->
  <rect x="30" y="60" width="305" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="50" y="82" font-size="13" font-weight="700" fill="#2563eb">① 内容推荐</text>
  <text x="50" y="100" font-size="10" fill="#475569">原型: YouTube (Covington 2016)</text>
  <text x="50" y="116" font-size="10" fill="#475569">关键: 双塔召回 + DNN 精排 + watch time</text>
  <text x="50" y="132" font-size="10" fill="#475569">中文圈: 抖音 / 小红书 / B 站</text>

  <!-- Top-right: Social Feed -->
  <rect x="365" y="60" width="305" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="385" y="82" font-size="13" font-weight="700" fill="#16a34a">② 社交 Feed</text>
  <text x="385" y="100" font-size="10" fill="#475569">原型: Instagram (Eksombatchai 2018)</text>
  <text x="385" y="116" font-size="10" fill="#475569">关键: 好友互动信号 + LTV 长期价值</text>
  <text x="385" y="132" font-size="10" fill="#475569">中文圈: 微信朋友圈 / 微博</text>

  <!-- Bottom-left: Search Ranking -->
  <rect x="30" y="170" width="305" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="50" y="192" font-size="13" font-weight="700" fill="#d97706">③ 搜索排序</text>
  <text x="50" y="210" font-size="10" fill="#475569">原型: Google (Burges 2006/2010)</text>
  <text x="50" y="226" font-size="10" fill="#475569">关键: LTR (Learn to Rank) + 文档理解</text>
  <text x="50" y="242" font-size="10" fill="#475569">中文圈: 百度 / 微信搜一搜</text>

  <!-- Bottom-right: Short Video Feed -->
  <rect x="365" y="170" width="305" height="90" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.8"/>
  <text x="385" y="192" font-size="13" font-weight="700" fill="#db2777">④ 短视频流</text>
  <text x="385" y="210" font-size="10" fill="#475569">原型: TikTok (Cheng 2024)</text>
  <text x="385" y="226" font-size="10" fill="#475569">关键: 实时训练 + 多目标加权 + 完播率</text>
  <text x="385" y="242" font-size="10" fill="#475569">中文圈: 抖音 / 抖音极速版 / TikTok</text>

  <!-- Center label -->
  <text x="350" y="50" text-anchor="middle" font-size="11" fill="#64748b">覆盖字节/小红书/阿里推荐岗 80%+ 高频题</text>
</svg>