<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="360" fill="#fafbfc"/>
<rect x="0" y="0" width="720" height="36" fill="#2563eb" rx="0"/>
<text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">古德哈特定律四种变体 (破坏强度递增)</text>

<!-- top arrow showing strength increase -->
<line x1="40" y1="58" x2="680" y2="58" stroke="#64748b" stroke-width="1" marker-end="url(#a-64748b)"/>
<text x="360" y="54" text-anchor="middle" font-size="10" fill="#64748b">破坏强度 →</text>

<!-- 回归式 -->
<rect x="40" y="72" width="155" height="250" rx="6" fill="#16a34a" fill-opacity="0.08" stroke="#16a34a" stroke-width="1.5"/>
<text x="117" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">回归式</text>
<text x="117" y="110" text-anchor="middle" font-size="9" fill="#475569">Regressional</text>
<g transform="translate(50,135)">
  <line x1="0" y1="70" x2="130" y2="70" stroke="#94a3b8" stroke-width="1"/>
  <line x1="0" y1="0" x2="0" y2="70" stroke="#94a3b8" stroke-width="1"/>
  <text x="-3" y="74" text-anchor="end" font-size="8" fill="#64748b">V</text>
  <text x="133" y="74" font-size="8" fill="#64748b">M</text>
  <line x1="10" y1="60" x2="115" y2="38" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="10" cy="60" r="2.5" fill="#16a34a"/>
  <circle cx="60" cy="50" r="2.5" fill="#16a34a"/>
  <circle cx="115" cy="38" r="2.5" fill="#16a34a"/>
  <text x="60" y="25" font-size="8" fill="#14532d" text-anchor="middle">V 回归均值</text>
</g>
<text x="117" y="240" text-anchor="middle" font-size="9" fill="#475569">M = V + ε</text>
<text x="117" y="258" text-anchor="middle" font-size="9" fill="#475569">选择 M 最大者</text>
<text x="117" y="276" text-anchor="middle" font-size="9" fill="#475569">→ V 偏低</text>
<text x="117" y="305" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a">温和</text>

<!-- 极端式 -->
<rect x="210" y="72" width="155" height="250" rx="6" fill="#d97706" fill-opacity="0.08" stroke="#d97706" stroke-width="1.5"/>
<text x="287" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">极端式</text>
<text x="287" y="110" text-anchor="middle" font-size="9" fill="#475569">Extremal</text>
<g transform="translate(220,135)">
  <line x1="0" y1="70" x2="130" y2="70" stroke="#94a3b8" stroke-width="1"/>
  <line x1="0" y1="0" x2="0" y2="70" stroke="#94a3b8" stroke-width="1"/>
  <path d="M 10 65 Q 60 50, 90 35 T 120 5" stroke="#d97706" stroke-width="1.5" fill="none"/>
  <path d="M 110 5 L 122 2 L 117 14 Z" fill="#d97706"/>
  <text x="50" y="55" font-size="8" fill="#7c2d12">正常区线性</text>
  <text x="100" y="20" font-size="8" fill="#7c2d12">极端区分叉</text>
</g>
<text x="287" y="240" text-anchor="middle" font-size="9" fill="#475569">正常范围: M~V</text>
<text x="287" y="258" text-anchor="middle" font-size="9" fill="#475569">极端值: M~V 关系崩坏</text>
<text x="287" y="276" text-anchor="middle" font-size="9" fill="#475569">例: BMI 高位</text>
<text x="287" y="305" text-anchor="middle" font-size="9" font-weight="600" fill="#d97706">中等</text>

<!-- 因果式 -->
<rect x="380" y="72" width="155" height="250" rx="6" fill="#9333ea" fill-opacity="0.08" stroke="#9333ea" stroke-width="1.5"/>
<text x="457" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#581c87">因果式</text>
<text x="457" y="110" text-anchor="middle" font-size="9" fill="#475569">Causal</text>
<g transform="translate(395,140)">
  <circle cx="0" cy="20" r="14" fill="#9333ea" fill-opacity="0.25" stroke="#9333ea" stroke-width="1.5"/>
  <text x="0" y="24" text-anchor="middle" font-size="8" fill="#581c87">聪明</text>
  <circle cx="70" cy="20" r="14" fill="#9333ea" fill-opacity="0.25" stroke="#9333ea" stroke-width="1.5"/>
  <text x="70" y="24" text-anchor="middle" font-size="8" fill="#581c87">读书</text>
  <circle cx="140" cy="20" r="14" fill="#9333ea" fill-opacity="0.25" stroke="#9333ea" stroke-width="1.5"/>
  <text x="140" y="24" text-anchor="middle" font-size="8" fill="#581c87">成功</text>
  <line x1="14" y1="20" x2="56" y2="20" stroke="#9333ea" stroke-width="1.5" marker-end="url(#a-9333ea)"/>
  <line x1="84" y1="20" x2="126" y2="20" stroke="#9333ea" stroke-width="1.5" marker-end="url(#a-9333ea)"/>
  <text x="35" y="14" font-size="7" fill="#581c87">因</text>
  <text x="105" y="14" font-size="7" fill="#581c87">果</text>
</g>
<text x="457" y="240" text-anchor="middle" font-size="9" fill="#475569">相关性依赖因果链</text>
<text x="457" y="258" text-anchor="middle" font-size="9" fill="#475569">干预切断后</text>
<text x="457" y="276" text-anchor="middle" font-size="9" fill="#475569">相关性消失</text>
<text x="457" y="305" text-anchor="middle" font-size="9" font-weight="600" fill="#9333ea">较强</text>

<!-- 对抗式 -->
<rect x="550" y="72" width="155" height="250" rx="6" fill="#dc2626" fill-opacity="0.08" stroke="#dc2626" stroke-width="1.5"/>
<text x="627" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">对抗式</text>
<text x="627" y="110" text-anchor="middle" font-size="9" fill="#475569">Adversarial</text>
<g transform="translate(560,130)">
  <rect x="0" y="0" width="60" height="28" rx="3" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb"/>
  <text x="30" y="18" text-anchor="middle" font-size="9" fill="#1e3a8a">优化器</text>
  <rect x="75" y="0" width="60" height="28" rx="3" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626"/>
  <text x="105" y="18" text-anchor="middle" font-size="9" fill="#7f1d1d">代理 M</text>
  <line x1="60" y1="14" x2="75" y2="14" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-dc2626)"/>
  <rect x="35" y="60" width="60" height="28" rx="3" fill="#64748b" fill-opacity="0.15" stroke="#64748b"/>
  <text x="65" y="78" text-anchor="middle" font-size="9" fill="#334155">真实 V ↓</text>
  <line x1="65" y1="60" x2="65" y2="28" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#a-64748b)"/>
</g>
<text x="627" y="240" text-anchor="middle" font-size="9" fill="#475569">对手主动构造</text>
<text x="627" y="258" text-anchor="middle" font-size="9" fill="#475569">M↑ V↓ 的输入</text>
<text x="627" y="276" text-anchor="middle" font-size="9" fill="#475569">LLM 越狱属此</text>
<text x="627" y="305" text-anchor="middle" font-size="9" font-weight="600" fill="#dc2626">最强</text>
</svg>
