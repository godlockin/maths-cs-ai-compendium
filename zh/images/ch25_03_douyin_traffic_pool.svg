<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="220" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb" rx="0"/>
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">抖音 For You Feed 流量池机制: 200 → 1000 → 5000 → 5 万 → 50 万 五级升级</text>

  <!-- 5 stages, ascending size -->
  <!-- Stage 1: 200 -->
  <rect x="30" y="80" width="100" height="60" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="80" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">冷启动池</text>
  <text x="80" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">200</text>
  <text x="80" y="158" text-anchor="middle" font-size="9" fill="#64748b">完播率 &amp; 互动率达标</text>

  <!-- arrow -->
  <line x1="135" y1="110" x2="156" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#a-64748b)"/>

  <!-- Stage 2: 1000 -->
  <rect x="160" y="80" width="100" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">初级池</text>
  <text x="210" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">1000</text>
  <text x="210" y="158" text-anchor="middle" font-size="9" fill="#475569">5 min 数据回流评估</text>

  <line x1="265" y1="110" x2="286" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#a-64748b)"/>

  <!-- Stage 3: 5000 -->
  <rect x="290" y="80" width="100" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="340" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">中级池</text>
  <text x="340" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">5000</text>
  <text x="340" y="158" text-anchor="middle" font-size="9" fill="#16a34a">跨人群兴趣扩散</text>

  <line x1="395" y1="110" x2="416" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#a-64748b)"/>

  <!-- Stage 4: 50000 -->
  <rect x="420" y="80" width="100" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="470" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#d97706">高级池</text>
  <text x="470" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">5 万</text>
  <text x="470" y="158" text-anchor="middle" font-size="9" fill="#d97706">完播率分层加权</text>

  <line x1="525" y1="110" x2="546" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#a-64748b)"/>

  <!-- Stage 5: 500000 -->
  <rect x="550" y="80" width="120" height="60" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="610" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#db2777">爆款池</text>
  <text x="610" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#db2777">50 万+</text>
  <text x="610" y="158" text-anchor="middle" font-size="9" fill="#db2777">进入推荐主流量</text>

  <!-- Downgrade arrows (back) -->
  <text x="80" y="180" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="600">↓ 完播率/互动差</text>
  <text x="610" y="180" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="600">↓ 反馈回路风险</text>

  <!-- Caption -->
  <text x="360" y="200" text-anchor="middle" font-size="10" fill="#64748b">每级升级需满足上一池的完播率/互动率门槛, 失败则降级回冷启动池</text>
</svg>