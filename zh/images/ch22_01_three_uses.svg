<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }</style>
  <rect width="700" height="360" fill="#fafbfc"/>
  <defs>
    <marker id="ar-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="36" fill="#2563eb"/>
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">Eval 的三大用途</text>
  <text x="350" y="58" text-anchor="middle" font-size="11" fill="#64748b">诊断 / 决策 / 信任 · 各自的目标与冲突</text>

  <!-- Three cards -->
  <rect x="40" y="80" width="190" height="220" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="40" y="80" width="190" height="32" rx="8" fill="#2563eb"/>
  <rect x="40" y="100" width="190" height="12" fill="#2563eb"/>
  <text x="135" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="white">诊断 · Diagnosis</text>
  <text x="55" y="135" font-size="11" fill="#475569" font-weight="600">目标</text>
  <text x="55" y="152" font-size="11" fill="#334155">定位 fine-tune 中的回退</text>
  <text x="55" y="178" font-size="11" fill="#475569" font-weight="600">核心要求</text>
  <text x="55" y="195" font-size="10.5" fill="#334155">· 信号灵敏 (signal-sensitive)</text>
  <text x="55" y="212" font-size="10.5" fill="#334155">· 不完美也接受</text>
  <text x="55" y="229" font-size="10.5" fill="#334155">· 揪出 regression 即可</text>
  <text x="55" y="255" font-size="11" fill="#475569" font-weight="600">常见形态</text>
  <text x="55" y="272" font-size="10.5" fill="#334155">· 小规模内部 test set</text>
  <text x="55" y="287" font-size="10.5" fill="#334155">· 行为探针 (behavior probe)</text>

  <rect x="255" y="80" width="190" height="220" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="255" y="80" width="190" height="32" rx="8" fill="#16a34a"/>
  <rect x="255" y="100" width="190" height="12" fill="#16a34a"/>
  <text x="350" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="white">决策 · Decision</text>
  <text x="270" y="135" font-size="11" fill="#475569" font-weight="600">目标</text>
  <text x="270" y="152" font-size="11" fill="#334155">选模型 / 选 checkpoint</text>
  <text x="270" y="178" font-size="11" fill="#475569" font-weight="600">核心要求</text>
  <text x="270" y="195" font-size="10.5" fill="#334155">· 可比较、可复现</text>
  <text x="270" y="212" font-size="10.5" fill="#334155">· 数字能横向对齐</text>
  <text x="270" y="229" font-size="10.5" fill="#334155">· 不允许噪声主导</text>
  <text x="270" y="255" font-size="11" fill="#475569" font-weight="600">常见形态</text>
  <text x="270" y="272" font-size="10.5" fill="#334155">· 公开 benchmark (MMLU)</text>
  <text x="270" y="287" font-size="10.5" fill="#334155">· 内部 golden set / 竞技场</text>

  <rect x="470" y="80" width="190" height="220" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <rect x="470" y="80" width="190" height="32" rx="8" fill="#d97706"/>
  <rect x="470" y="100" width="190" height="12" fill="#d97706"/>
  <text x="565" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="white">信任 · Trust</text>
  <text x="485" y="135" font-size="11" fill="#475569" font-weight="600">目标</text>
  <text x="485" y="152" font-size="11" fill="#334155">支撑"能否部署"的证据</text>
  <text x="485" y="178" font-size="11" fill="#475569" font-weight="600">核心要求</text>
  <text x="485" y="195" font-size="10.5" fill="#334155">· 可审计、防作弊</text>
  <text x="485" y="212" font-size="10.5" fill="#334155">· 顶得住第三方复现</text>
  <text x="485" y="229" font-size="10.5" fill="#334155">· 红队 (red team) 难挑刺</text>
  <text x="485" y="255" font-size="11" fill="#475569" font-weight="600">常见形态</text>
  <text x="485" y="272" font-size="10.5" fill="#334155">· HELM 第三方评测</text>
  <text x="485" y="287" font-size="10.5" fill="#334155">· LMSYS Arena / RSP 阈值</text>

  <!-- Bottom tension bar -->
  <text x="350" y="325" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">三者要求可能完全冲突 — 一个好 eval 团队为不同用途维护不同 eval 集</text>
  <line x1="60" y1="340" x2="640" y2="340" stroke="#dc2626" stroke-width="2" marker-end="url(#ar-64748b)"/>
  <text x="60" y="335" font-size="10" fill="#dc2626" font-weight="600">灵敏 →</text>
  <text x="640" y="335" text-size="10" font-size="10" fill="#dc2626" font-weight="600" text-anchor="end">→ 防作弊</text>
</svg>
