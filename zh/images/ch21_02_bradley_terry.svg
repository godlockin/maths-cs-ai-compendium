<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="320" fill="#fafbfc"/>
<rect x="0" y="0" width="720" height="36" fill="#2563eb" rx="0"/>
<text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">Bradley-Terry: 从两两比较重建隐含奖励尺度</text>

<!-- Left: formula box -->
<rect x="30" y="60" width="330" height="240" rx="6" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="1.2"/>
<text x="195" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">偏好概率</text>
<text x="195" y="115" text-anchor="middle" font-size="13" fill="#1e293b">P(y_w ≻ y_l | x) = σ(r_w − r_l)</text>
<text x="195" y="148" text-anchor="middle" font-size="11" fill="#475569">y_w: 被偏好  ·  y_l: 被弃</text>
<text x="195" y="166" text-anchor="middle" font-size="11" fill="#475569">r(x, y) ∈ R : 隐含奖励</text>
<text x="195" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">RM 训练目标</text>
<text x="195" y="218" text-anchor="middle" font-size="11" fill="#1e293b">L_RM = −E[log σ(r(x,y_w)−r(x,y_l))]</text>
<text x="195" y="260" text-anchor="middle" font-size="9" fill="#64748b">Bradley &amp; Terry (1952)</text>
<text x="195" y="278" text-anchor="middle" font-size="9" fill="#64748b">Plackett-Luce: 推广到 k 个排名</text>

<!-- Right: illustration -->
<text x="395" y="84" font-size="11" font-weight="600" fill="#475569">隐含奖励尺度 r(x, y)</text>
<g transform="translate(395,100)">
  <!-- axis -->
  <line x1="0" y1="170" x2="290" y2="170" stroke="#94a3b8" stroke-width="1"/>
  <line x1="0" y1="20" x2="0" y2="170" stroke="#94a3b8" stroke-width="1"/>
  <text x="-3" y="174" text-anchor="end" font-size="9" fill="#64748b">P</text>
  <text x="293" y="174" font-size="9" fill="#64748b">r</text>
  <!-- sigmoid curve -->
  <path d="M 10 165 C 80 160, 130 100, 145 50 S 220 22, 285 18" stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <!-- points -->
  <circle cx="60" cy="135" r="3" fill="#2563eb"/>
  <text x="65" y="130" font-size="9" fill="#1e3a8a">y_l</text>
  <circle cx="145" cy="50" r="3" fill="#16a34a"/>
  <text x="150" y="48" font-size="9" fill="#14532d">y_w</text>
  <!-- difference arrow -->
  <line x1="60" y1="135" x2="145" y2="50" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a-dc2626)"/>
  <text x="105" y="80" font-size="9" fill="#dc2626">Δr ↑</text>
</g>

<!-- properties at bottom -->
<text x="395" y="293" font-size="9" fill="#475569">平移不变 (差有意义) · 尺度敏感 (α 像温度倒数)</text>
</svg>
