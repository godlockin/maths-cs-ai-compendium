<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="700" height="360" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
    <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
    <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="36" fill="#2563eb"/>
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">EEG 10-20 电极分布示意</text>

  <!-- Top head outline + electrode positions (top view) -->
  <g transform="translate(160,70)">
    <!-- head circle -->
    <circle cx="160" cy="120" r="120" fill="#fafbfc" stroke="#475569" stroke-width="1.6"/>
    <!-- midline (nasion-inion) -->
    <line x1="160" y1="0" x2="160" y2="240" stroke="#cbd5e1" stroke-dasharray="2 3"/>
    <!-- cross midline (pre-auricular) -->
    <line x1="40" y1="120" x2="280" y2="120" stroke="#cbd5e1" stroke-dasharray="2 3"/>

    <!-- Fp1, Fp2 (frontal pole) -->
    <circle cx="120" cy="50" r="4" fill="#dc2626"/>
    <text x="105" y="42" font-size="10" font-weight="700" fill="#dc2626">Fp1</text>
    <circle cx="200" cy="50" r="4" fill="#dc2626"/>
    <text x="207" y="42" font-size="10" font-weight="700" fill="#dc2626">Fp2</text>

    <!-- F3, Fz, F4 -->
    <circle cx="130" cy="80" r="4" fill="#2563eb"/>
    <text x="115" y="74" font-size="10" font-weight="700" fill="#2563eb">F3</text>
    <circle cx="160" cy="75" r="4" fill="#2563eb"/>
    <text x="167" y="68" font-size="10" font-weight="700" fill="#2563eb">Fz</text>
    <circle cx="190" cy="80" r="4" fill="#2563eb"/>
    <text x="195" y="74" font-size="10" font-weight="700" fill="#2563eb">F4</text>

    <!-- C3, Cz, C4 (central) -->
    <circle cx="120" cy="120" r="5" fill="#16a34a"/>
    <text x="105" y="118" font-size="10" font-weight="700" fill="#16a34a">C3</text>
    <circle cx="160" cy="120" r="5" fill="#16a34a"/>
    <text x="167" y="115" font-size="10" font-weight="700" fill="#16a34a">Cz</text>
    <circle cx="200" cy="120" r="5" fill="#16a34a"/>
    <text x="205" y="118" font-size="10" font-weight="700" fill="#16a34a">C4</text>

    <!-- P3, Pz, P4 -->
    <circle cx="130" cy="160" r="4" fill="#9333ea"/>
    <text x="115" y="172" font-size="10" font-weight="700" fill="#9333ea">P3</text>
    <circle cx="160" cy="165" r="4" fill="#9333ea"/>
    <text x="167" y="170" font-size="10" font-weight="700" fill="#9333ea">Pz</text>
    <circle cx="190" cy="160" r="4" fill="#9333ea"/>
    <text x="195" y="172" font-size="10" font-weight="700" fill="#9333ea">P4</text>

    <!-- O1, O2 (occipital) -->
    <circle cx="135" cy="200" r="4" fill="#d97706"/>
    <text x="120" y="210" font-size="10" font-weight="700" fill="#d97706">O1</text>
    <circle cx="185" cy="200" r="4" fill="#d97706"/>
    <text x="190" y="210" font-size="10" font-weight="700" fill="#d97706">O2</text>

    <!-- T3, T4 (temporal) -->
    <circle cx="60" cy="120" r="4" fill="#0891b2"/>
    <text x="40" y="118" font-size="10" font-weight="700" fill="#0891b2">T3</text>
    <circle cx="260" cy="120" r="4" fill="#0891b2"/>
    <text x="265" y="118" font-size="10" font-weight="700" fill="#0891b2">T4</text>

    <!-- Nasion label -->
    <text x="160" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">鼻根 Nasion</text>
    <text x="160" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">枕骨 Inion</text>
    <text x="-10" y="124" font-size="10" font-weight="700" fill="#475569" text-anchor="end">左</text>
    <text x="330" y="124" font-size="10" font-weight="700" fill="#475569">右</text>
  </g>

  <!-- side caption -->
  <g transform="translate(60,300)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#475569">10-20 系统:</text>
    <text x="100" y="0" font-size="10" fill="#475569">奇数=左脑, 偶数=右脑, z=中线</text>
    <text x="0" y="16" font-size="10" fill="#475569">电极间距为头围的 10% 或 20%, 共 19-21 个标准位置; 高密度可拓展到 64/128/256 通道</text>
  </g>

</svg>