<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
</style>
<rect width="700" height="380" fill="#fafbfc"/>
<defs>
  <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
  <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
  <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
  <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
</defs>
<rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
<text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">CG vs 最陡下降 (SD): 椭球等高线上的两种走法</text>

<!-- Left plot: SD zigzag -->
<g transform="translate(30,70)">
  <rect x="0" y="0" width="300" height="280" fill="#fff" stroke="#cbd5e1"/>
  <text x="150" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">最陡下降 (Steepest Descent)</text>
  <!-- ellipses -->
  <ellipse cx="150" cy="240" rx="120" ry="14" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="150" cy="240" rx="100" ry="10" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="150" cy="240" rx="80" ry="8" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="150" cy="240" rx="60" ry="6" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="150" cy="240" rx="40" ry="4" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="150" cy="240" rx="20" ry="3" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- optimum dot -->
  <circle cx="150" cy="240" r="3" fill="#16a34a"/>
  <text x="158" y="245" font-size="10" fill="#16a34a">x*</text>
  <!-- zigzag path -->
  <polyline points="40,40 130,90 60,140 140,170 75,200 145,225" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-dc2626)"/>
  <circle cx="40" cy="40" r="3.5" fill="#dc2626"/>
  <text x="22" y="36" font-size="10" fill="#dc2626" font-weight="600">x0</text>
  <circle cx="130" cy="90" r="3" fill="#dc2626"/>
  <circle cx="60" cy="140" r="3" fill="#dc2626"/>
  <circle cx="140" cy="170" r="3" fill="#dc2626"/>
  <circle cx="75" cy="200" r="3" fill="#dc2626"/>
  <text x="80" y="265" font-size="10" fill="#475569">沿 -∇f 走, 每次与等高线正交 → 之字形</text>
</g>

<!-- Right plot: CG -->
<g transform="translate(360,70)">
  <rect x="0" y="0" width="300" height="280" fill="#fff" stroke="#cbd5e1"/>
  <text x="150" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">共轭梯度 (CG)</text>
  <!-- same ellipses -->
  <ellipse cx="150" cy="240" rx="120" ry="14" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="150" cy="240" rx="100" ry="10" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="150" cy="240" rx="80" ry="8" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="150" cy="240" rx="60" ry="6" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="150" cy="240" rx="40" ry="4" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="150" cy="240" rx="20" ry="3" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="150" cy="240" r="3" fill="#16a34a"/>
  <text x="158" y="245" font-size="10" fill="#16a34a">x*</text>
  <!-- CG path: 2 jumps to optimum (A-conjugate directions) -->
  <line x1="40" y1="50" x2="110" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#a-2563eb)"/>
  <line x1="110" y1="160" x2="150" y2="240" stroke="#2563eb" stroke-width="2" marker-end="url(#a-2563eb)"/>
  <circle cx="40" cy="50" r="3.5" fill="#2563eb"/>
  <text x="22" y="46" font-size="10" fill="#2563eb" font-weight="600">x0</text>
  <circle cx="110" cy="160" r="3" fill="#2563eb"/>
  <text x="118" y="160" font-size="10" fill="#2563eb">x1</text>
  <text x="80" y="265" font-size="10" fill="#475569">A-共轭方向 → 2D 中两步直达</text>
</g>

<!-- Bottom formula bar -->
<g transform="translate(40,358)">
  <text x="0" y="0" font-size="11" fill="#1e3a8a" font-weight="600">
    收敛率: SD = O(κ) iter;   CG = O(√κ) iter   →   κ=10⁶ 时 SD≈10⁶, CG≈10³
  </text>
</g>
</svg>
