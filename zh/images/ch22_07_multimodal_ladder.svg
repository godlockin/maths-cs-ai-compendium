<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }</style>
  <rect width="720" height="380" fill="#fafbfc"/>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">多模态评测的能力层级</text>
  <text x="360" y="58" text-anchor="middle" font-size="11" fill="#64748b">MMBench 识别 → MathVista 视觉数学 → MMMU 专业推理 → Video-MME 时序</text>

  <!-- Ladder backdrop -->
  <g>
    <!-- Step 1: MMBench -->
    <rect x="40" y="270" width="155" height="60" rx="8" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
    <text x="118" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">MMBench</text>
    <text x="118" y="306" text-anchor="middle" font-size="10" fill="#334155">感知 / 识别</text>
    <text x="118" y="322" text-anchor="middle" font-size="10" fill="#64748b">~11K 多选, GPT-4o ~83%</text>

    <!-- Step 2: MathVista -->
    <rect x="210" y="220" width="155" height="110" rx="8" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="1.5"/>
    <text x="288" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">MathVista</text>
    <text x="288" y="256" text-anchor="middle" font-size="10" fill="#334155">视觉数学</text>
    <text x="288" y="272" text-anchor="middle" font-size="10" fill="#64748b">图表 / 几何 / 统计</text>
    <text x="288" y="293" text-anchor="middle" font-size="10" font-weight="600" fill="#16a34a">6,141 题</text>
    <text x="288" y="308" text-anchor="middle" font-size="10" fill="#64748b">GPT-4o ~63% · 人类 92%</text>
    <text x="288" y="322" text-anchor="middle" font-size="9" fill="#475569" font-style="italic">数字 + 视觉同时用</text>

    <!-- Step 3: MMMU -->
    <rect x="380" y="170" width="155" height="160" rx="8" fill="#9333ea" fill-opacity="0.10" stroke="#9333ea" stroke-width="1.5"/>
    <text x="458" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#9333ea">MMMU</text>
    <text x="458" y="206" text-anchor="middle" font-size="10" fill="#334155">大学级专业推理</text>
    <text x="458" y="222" text-anchor="middle" font-size="10" fill="#64748b">跨学科图表理解</text>
    <text x="458" y="245" text-anchor="middle" font-size="10" font-weight="600" fill="#9333ea">11.5K 题 · 30 学科</text>
    <text x="458" y="260" text-anchor="middle" font-size="10" fill="#64748b">GPT-4o: 69.1%</text>
    <text x="458" y="275" text-anchor="middle" font-size="10" fill="#64748b">Claude 3.5: 68.3%</text>
    <text x="458" y="290" text-anchor="middle" font-size="10" fill="#64748b">Gemini 1.5: 62.2%</text>
    <text x="458" y="305" text-anchor="middle" font-size="10" fill="#64748b">人类专家: 88.6%</text>
    <text x="458" y="322" font-size="9" fill="#475569" font-style="italic">视觉推理量化标尺</text>

    <!-- Step 4: Video-MME -->
    <rect x="550" y="120" width="155" height="210" rx="8" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="1.5"/>
    <text x="627" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">Video-MME</text>
    <text x="627" y="156" text-anchor="middle" font-size="10" fill="#334155">视频时序推理</text>
    <text x="627" y="172" text-anchor="middle" font-size="10" fill="#64748b">11s ~ 60min 视频</text>
    <text x="627" y="195" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">900 视频 · 2,700 题</text>
    <text x="627" y="210" text-anchor="middle" font-size="10" fill="#64748b">动作 / 情节 / 多镜头</text>
    <text x="627" y="225" text-anchor="middle" font-size="10" fill="#64748b">Gemini 1.5 短视频 79.5%</text>
    <text x="627" y="240" text-anchor="middle" font-size="10" fill="#64748b">长视频 (&gt;30min) 67.4%</text>
    <text x="627" y="265" text-anchor="middle" font-size="9" fill="#475569" font-style="italic">长时序仍是硬骨头</text>
    <text x="627" y="290" text-anchor="middle" font-size="9" fill="#dc2626">↑ 最高 / 最难</text>
    <text x="627" y="310" text-anchor="middle" font-size="9" fill="#64748b">模态: 视频帧序列</text>
  </g>

  <!-- Arrow steps -->
  <g stroke="#64748b" stroke-width="1.5" fill="#94a3b8">
    <line x1="195" y1="300" x2="212" y2="262"/>
    <polygon points="212,262 218,266 213,272"/>
    <line x1="365" y1="262" x2="382" y2="232"/>
    <polygon points="382,232 388,236 383,242"/>
    <line x1="535" y1="232" x2="552" y2="180"/>
    <polygon points="552,180 558,184 553,190"/>
  </g>

  <!-- bottom annotation -->
  <rect x="40" y="340" width="640" height="32" rx="6" fill="#9333ea" fill-opacity="0.06" stroke="#9333ea" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="360" y="360" text-anchor="middle" font-size="10.5" fill="#475569" font-style="italic">模态演化: 静态图 → 视觉数学 → 专业推理 → 视频时序, 难度阶梯上升</text>
</svg>
