<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="700" height="280" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">推荐 vs 风控: 镜像对调 (engagement 越高越好 vs risk 越低越好)</text>

  <!-- Column headers -->
  <text x="100" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">维度</text>
  <text x="270" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">推荐 (用户主动消费)</text>
  <text x="540" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">风控 (用户被动防御)</text>

  <!-- 6 contrast rows -->
  <g font-size="11" font-weight="600">
    <rect x="30" y="80" width="140" height="28" fill="#f1f5f9"/>
    <text x="100" y="98" text-anchor="middle" fill="#334155">优化目标</text>
    <rect x="180" y="80" width="180" height="28" fill="#dbeafe"/>
    <text x="270" y="98" text-anchor="middle" fill="#2563eb">engagement 越高越好</text>
    <rect x="370" y="80" width="300" height="28" fill="#fef2f2"/>
    <text x="520" y="98" text-anchor="middle" fill="#dc2626">risk 越低越好</text>

    <rect x="30" y="108" width="140" height="28" fill="#f8fafc"/>
    <text x="100" y="126" text-anchor="middle" fill="#334155">Top-K 关注</text>
    <rect x="180" y="108" width="180" height="28" fill="#dbeafe"/>
    <text x="270" y="126" text-anchor="middle" fill="#2563eb">排序质量 (NDCG/MAP)</text>
    <rect x="370" y="108" width="300" height="28" fill="#fef2f2"/>
    <text x="520" y="126" text-anchor="middle" fill="#dc2626">拦截精度 (Top-K Precision)</text>

    <rect x="30" y="136" width="140" height="28" fill="#f1f5f9"/>
    <text x="100" y="154" text-anchor="middle" fill="#334155">多样性</text>
    <rect x="180" y="136" width="180" height="28" fill="#dbeafe"/>
    <text x="270" y="154" text-anchor="middle" fill="#2563eb">允许多样 (MMR)</text>
    <rect x="370" y="136" width="300" height="28" fill="#fef2f2"/>
    <text x="520" y="154" text-anchor="middle" fill="#dc2626">必须精确+召回双高</text>

    <rect x="30" y="164" width="140" height="28" fill="#f8fafc"/>
    <text x="100" y="182" text-anchor="middle" fill="#334155">类别比例</text>
    <rect x="180" y="164" width="180" height="28" fill="#dbeafe"/>
    <text x="270" y="182" text-anchor="middle" fill="#2563eb">相对均衡 (50/50)</text>
    <rect x="370" y="164" width="300" height="28" fill="#fef2f2"/>
    <text x="520" y="182" text-anchor="middle" fill="#dc2626">极不平衡 (1:1000)</text>

    <rect x="30" y="192" width="140" height="28" fill="#f1f5f9"/>
    <text x="100" y="210" text-anchor="middle" fill="#334155">反馈延迟</text>
    <rect x="180" y="192" width="180" height="28" fill="#dbeafe"/>
    <text x="270" y="210" text-anchor="middle" fill="#2563eb">秒级 (点击/观看)</text>
    <rect x="370" y="192" width="300" height="28" fill="#fef2f2"/>
    <text x="520" y="210" text-anchor="middle" fill="#dc2626">30 天 (申诉/核查)</text>

    <rect x="30" y="220" width="140" height="28" fill="#f8fafc"/>
    <text x="100" y="238" text-anchor="middle" fill="#334155">误判代价</text>
    <rect x="180" y="220" width="180" height="28" fill="#dbeafe"/>
    <text x="270" y="238" text-anchor="middle" fill="#2563eb">体验略差可接受</text>
    <rect x="370" y="220" width="300" height="28" fill="#fef2f2"/>
    <text x="520" y="238" text-anchor="middle" fill="#dc2626">误报 = 10× 漏报成本</text>
  </g>

  <!-- Bottom caption -->
  <rect x="30" y="252" width="640" height="20" rx="3" fill="#f1f5f9"/>
  <text x="350" y="266" text-anchor="middle" font-size="10" fill="#475569">核心差异: 推荐优化 engagement (越高越好), 风控优化 risk (越低越好); 极不平衡+反馈延迟是风控独有问题</text>
</svg>