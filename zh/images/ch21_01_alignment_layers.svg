<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="230" fill="#fafbfc"/>
<rect x="0" y="0" width="720" height="36" fill="#2563eb" rx="0"/>
<text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">对齐三层次: 意图 → 价值 → 能力</text>

<!-- Three stacked layer blocks -->
<rect x="60" y="60" width="600" height="42" rx="6" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
<text x="80" y="86" font-size="13" font-weight="700" fill="#1e3a8a">意图对齐</text>
<text x="180" y="86" font-size="11" fill="#334155">听懂当下指令 · 不越权执行</text>
<text x="610" y="86" text-anchor="end" font-size="10" fill="#64748b">Intent</text>

<rect x="60" y="110" width="600" height="42" rx="6" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="1.5"/>
<text x="80" y="136" font-size="13" font-weight="700" fill="#14532d">价值对齐</text>
<text x="180" y="136" font-size="11" fill="#334155">诚实 / 无害 / 有用 (HHH) · 长期稳定</text>
<text x="610" y="136" text-anchor="end" font-size="10" fill="#64748b">Value</text>

<rect x="60" y="160" width="600" height="42" rx="6" fill="#9333ea" fill-opacity="0.10" stroke="#9333ea" stroke-width="1.5"/>
<text x="80" y="186" font-size="13" font-weight="700" fill="#581c87">能力对齐</text>
<text x="180" y="186" font-size="11" fill="#334155">把内部已有的能力正确地引出来</text>
<text x="610" y="186" text-anchor="end" font-size="10" fill="#64748b">Capability</text>

<!-- Down arrow on right showing cumulative -->
<line x1="660" y1="68" x2="660" y2="194" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#a-64748b)"/>
<text x="670" y="135" font-size="10" fill="#64748b" transform="rotate(90 670 135)">层层递进</text>
</svg>
