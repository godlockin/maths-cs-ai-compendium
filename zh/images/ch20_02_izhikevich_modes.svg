<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="700" height="360" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
    <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
    <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="36" fill="#2563eb"/>
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">不同神经元发放模式对比</text>

  <!-- LIF (top) -->
  <text x="50" y="62" font-size="11" font-weight="700" fill="#64748b">LIF</text>
  <g transform="translate(100,55)">
    <line x1="0" y1="60" x2="540" y2="60" stroke="#94a3b8"/>
    <line x1="60" y1="60" x2="60" y2="20" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a-dc2626)"/>
    <line x1="0" y1="60" x2="60" y2="60" stroke="#2563eb" stroke-width="1.4"/>
    <line x1="180" y1="60" x2="180" y2="20" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a-dc2626)"/>
    <line x1="60" y1="60" x2="180" y2="60" stroke="#2563eb" stroke-width="1.4"/>
    <line x1="300" y1="60" x2="300" y2="20" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a-dc2626)"/>
    <line x1="180" y1="60" x2="300" y2="60" stroke="#2563eb" stroke-width="1.4"/>
    <line x1="420" y1="60" x2="420" y2="20" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a-dc2626)"/>
    <line x1="300" y1="60" x2="420" y2="60" stroke="#2563eb" stroke-width="1.4"/>
    <text x="270" y="80" text-anchor="middle" font-size="10" fill="#64748b">regular spiking</text>
  </g>

  <!-- Izhikevich label -->
  <text x="50" y="135" font-size="11" font-weight="700" fill="#64748b">Izhikevich</text>

  <!-- 4 modes -->
  <g transform="translate(100,105)">
    <!-- regular -->
    <g transform="translate(0,0)">
      <text x="60" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">regular</text>
      <path d="M 0,80 Q 30,75 50,40 Q 70,18 80,8 L 88,80 Q 110,75 130,40 Q 150,18 158,8" fill="none" stroke="#2563eb" stroke-width="1.4"/>
      <line x1="80" y1="8" x2="80" y2="-2" stroke="#dc2626" stroke-width="1.2" marker-end="url(#a-dc2626)"/>
      <line x1="158" y1="8" x2="158" y2="-2" stroke="#dc2626" stroke-width="1.2" marker-end="url(#a-dc2626)"/>
    </g>
    <!-- fast -->
    <g transform="translate(180,0)">
      <text x="60" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#0891b2">fast</text>
      <path d="M 0,80 L 15,8 L 30,80 L 45,8 L 60,80 L 75,8 L 90,80 L 105,8 L 120,80 L 135,8 L 158,80" fill="none" stroke="#0891b2" stroke-width="1.4"/>
    </g>
    <!-- bursting -->
    <g transform="translate(360,0)">
      <text x="60" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#d97706">bursting</text>
      <path d="M 0,80 Q 10,30 18,8 L 22,80 L 26,8 L 30,80 L 34,8 L 38,80 L 42,78 Q 70,80 110,80 L 158,80" fill="none" stroke="#d97706" stroke-width="1.4"/>
      <line x1="18" y1="8" x2="18" y2="-2" stroke="#dc2626" stroke-width="1" marker-end="url(#a-dc2626)"/>
      <line x1="26" y1="8" x2="26" y2="-2" stroke="#dc2626" stroke-width="1" marker-end="url(#a-dc2626)"/>
      <line x1="34" y1="8" x2="34" y2="-2" stroke="#dc2626" stroke-width="1" marker-end="url(#a-dc2626)"/>
    </g>
  </g>

  <g transform="translate(100,235)">
    <g transform="translate(0,0)">
      <text x="60" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#9333ea">chattering</text>
      <path d="M 0,80 Q 10,40 18,8 L 21,80 L 24,8 L 27,80 L 30,8 L 33,80 L 50,80 Q 80,40 90,8 L 93,80 L 96,8 L 100,8 L 103,80 L 158,82" fill="none" stroke="#9333ea" stroke-width="1.4"/>
      <line x1="18" y1="8" x2="18" y2="-2" stroke="#dc2626" stroke-width="1" marker-end="url(#a-dc2626)"/>
      <line x1="24" y1="8" x2="24" y2="-2" stroke="#dc2626" stroke-width="1" marker-end="url(#a-dc2626)"/>
      <line x1="30" y1="8" x2="30" y2="-2" stroke="#dc2626" stroke-width="1" marker-end="url(#a-dc2626)"/>
      <line x1="90" y1="8" x2="90" y2="-2" stroke="#dc2626" stroke-width="1" marker-end="url(#a-dc2626)"/>
      <line x1="96" y1="8" x2="96" y2="-2" stroke="#dc2626" stroke-width="1" marker-end="url(#a-dc2626)"/>
    </g>
    <g transform="translate(180,0)">
      <text x="60" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">low-threshold</text>
      <path d="M 0,80 Q 10,75 20,55 Q 35,30 45,15 Q 50,8 53,12 L 56,80 L 75,80 Q 90,75 100,55 Q 115,30 125,15 Q 130,8 133,12 L 136,80 L 158,80" fill="none" stroke="#dc2626" stroke-width="1.4"/>
      <line x1="53" y1="12" x2="53" y2="2" stroke="#dc2626" stroke-width="1" marker-end="url(#a-dc2626)"/>
      <line x1="133" y1="12" x2="133" y2="2" stroke="#dc2626" stroke-width="1" marker-end="url(#a-dc2626)"/>
    </g>
    <g transform="translate(360,0)">
      <text x="60" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#16a34a">accommodation</text>
      <path d="M 0,80 Q 30,40 70,15 Q 100,8 130,12 Q 155,25 158,80" fill="none" stroke="#16a34a" stroke-width="1.4"/>
      <line x1="158" y1="80" x2="158" y2="70" stroke="#dc2626" stroke-width="1" marker-end="url(#a-dc2626)"/>
    </g>
  </g>

  <!-- formula strip -->
  <rect x="50" y="320" width="600" height="34" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="70" y="340" font-size="11" font-weight="700" fill="#475569">Izhikevich 2003:</text>
  <text x="180" y="340" font-size="11" fill="#2563eb">dV/dt = 0.04V² + 5V + 140 - u + I ;  du/dt = a(bV - u) ;  V ≥ 30 → reset</text>

</svg>