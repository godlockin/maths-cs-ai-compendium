<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="320" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
    <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
    <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">STDP 学习窗口</text>

  <!-- Top: spike timing diagram -->
  <text x="60" y="62" font-size="11" font-weight="700" fill="#475569">Δt = t_post − t_pre</text>

  <g transform="translate(60,90)">
    <!-- pre-neuron row -->
    <text x="-12" y="22" font-size="11" fill="#2563eb" font-weight="600" text-anchor="end">突触前</text>
    <line x1="0" y1="20" x2="600" y2="20" stroke="#94a3b8"/>
    <line x1="100" y1="6" x2="100" y2="34" stroke="#2563eb" stroke-width="2.4"/>

    <!-- post-neuron row -->
    <text x="-12" y="62" font-size="11" fill="#dc2626" font-weight="600" text-anchor="end">突触后</text>
    <line x1="0" y1="60" x2="600" y2="60" stroke="#94a3b8"/>
    <!-- LTP region: pre then post (Δt>0): post spike around x=180 -->
    <line x1="180" y1="46" x2="180" y2="74" stroke="#dc2626" stroke-width="2.4"/>
    <!-- LTD region: post then pre: post around x=80, pre around x=380 -->
    <line x1="420" y1="46" x2="420" y2="74" stroke="#dc2626" stroke-width="2.4"/>

    <!-- Δt label -->
    <line x1="100" y1="92" x2="180" y2="92" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-16a34a)"/>
    <text x="140" y="106" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="600">Δt &gt; 0 → LTP</text>

    <line x1="420" y1="92" x2="340" y2="92" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a-dc2626)"/>
    <text x="380" y="106" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">Δt &lt; 0 → LTD</text>
  </g>

  <!-- STDP curve -->
  <g transform="translate(80,180)">
    <text x="0" y="-6" font-size="11" font-weight="700" fill="#475569">突触权重变化 Δw</text>
    <!-- axes -->
    <line x1="280" y1="0" x2="280" y2="100" stroke="#94a3b8"/>
    <line x1="0" y1="80" x2="560" y2="80" stroke="#94a3b8"/>
    <!-- zero line -->
    <line x1="0" y1="40" x2="560" y2="40" stroke="#cbd5e1" stroke-dasharray="3 3"/>

    <!-- LTP curve (right side, positive Δt -> LTP) -->
    <path d="M 280,40 Q 320,40 380,8 Q 450,4 560,30" fill="none" stroke="#16a34a" stroke-width="2"/>
    <text x="450" y="6" font-size="10" fill="#16a34a" font-weight="600">A⁺·exp(-Δt/τ⁺)</text>
    <text x="510" y="58" font-size="10" fill="#16a34a" font-weight="700">LTP</text>

    <!-- LTD curve (left side) -->
    <path d="M 280,40 Q 240,40 200,72 Q 130,76 20,50" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text x="120" y="92" font-size="10" fill="#dc2626" font-weight="600">−A⁻·exp(Δt/τ⁻)</text>
    <text x="40" y="60" font-size="10" fill="#dc2626" font-weight="700">LTD</text>

    <!-- labels -->
    <text x="280" y="96" text-anchor="middle" font-size="10" fill="#64748b">Δt = 0</text>
    <text x="560" y="98" text-anchor="end" font-size="10" fill="#64748b">Δt (ms)</text>
    <text x="0" y="42" text-anchor="end" font-size="10" fill="#64748b">Δw</text>
  </g>

  <!-- Formula -->
  <rect x="50" y="300" width="620" height="14" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="310" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Δw = A⁺·exp(-Δt/τ⁺) if Δt&gt;0   |   -A⁻·exp(Δt/τ⁻) if Δt&lt;0   (Bi &amp; Poo 1998)</text>

</svg>