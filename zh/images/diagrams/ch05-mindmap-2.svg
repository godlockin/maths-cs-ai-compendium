<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    .root { fill: #1976d2; font-size: 28px; font-weight: bold; }
    .node { fill: #ffffff; stroke: #1976d2; stroke-width: 2; rx: 10; }
    .leaf { fill: #f0f7ff; stroke: #718096; stroke-width: 1.5; rx: 6; }
    .title { font-size: 19px; font-weight: bold; fill: #1a202c; }
    .item  { font-size: 14px; fill: #2d3748; }
    .line  { stroke: #a0aec0; stroke-width: 1.5; fill: none; }
    .badge { font-size: 13px; font-weight: bold; }
  </style>

  <text x="500" y="36" text-anchor="middle" class="root">Ch05 概率论 · 知识图谱 2/3</text>
  <text x="500" y="60" text-anchor="middle" font-size="14" fill="#718096">常见分布 + MLE/MAP + 抽样分布</text>

  <rect x="420" y="85" width="160" height="50" class="node"/>
  <text x="500" y="117" text-anchor="middle" class="title">分布与估计</text>

  <path class="line" d="M 460 135 Q 150 175 130 225"/>
  <path class="line" d="M 480 135 Q 370 175 370 225"/>
  <path class="line" d="M 520 135 Q 630 175 630 225"/>
  <path class="line" d="M 540 135 Q 870 175 870 225"/>

  <rect x="50" y="225" width="160" height="40" class="node"/>
  <text x="130" y="251" text-anchor="middle" class="title">离散分布</text>

  <rect x="290" y="225" width="160" height="40" class="node"/>
  <text x="370" y="251" text-anchor="middle" class="title">连续分布</text>

  <rect x="550" y="225" width="160" height="40" class="node"/>
  <text x="630" y="251" text-anchor="middle" class="title">MLE / MAP</text>

  <rect x="790" y="225" width="160" height="40" class="node"/>
  <text x="870" y="251" text-anchor="middle" class="title">抽样分布</text>

  <!-- 离散 -->
  <g>
    <rect x="40" y="285" width="180" height="160" class="leaf"/>
    <text x="50" y="308" class="item">🟢 Bernoulli(p)</text>
    <text x="62" y="328" class="item">0/1, E=p</text>
    <text x="50" y="352" class="item">🟢 Binomial(n,p)</text>
    <text x="62" y="372" class="item">n 次伯努利, E=np</text>
    <text x="50" y="396" class="item">🟡 Poisson(λ)</text>
    <text x="62" y="416" class="item">稀有事件, E=λ</text>
    <text x="50" y="438" class="item">🟡 Geometric(p)</text>
  </g>
  <g>
    <rect x="40" y="460" width="180" height="120" class="leaf"/>
    <text x="50" y="483" class="item">🟡 NegBin(r,p)</text>
    <text x="62" y="503" class="item">  r 次成功前失败数</text>
    <text x="50" y="526" class="item">🔴 Beta-Binomial</text>
    <text x="62" y="546" class="item">  层级 / 共轭</text>
    <text x="50" y="568" class="item">⭐ 离散均匀</text>
  </g>

  <!-- 连续 -->
  <g>
    <rect x="280" y="285" width="180" height="160" class="leaf"/>
    <text x="290" y="308" class="item">🟢 Normal(μ,σ²)</text>
    <text x="302" y="328" class="item">  68-95-99.7</text>
    <text x="290" y="352" class="item">🟢 Uniform(a,b)</text>
    <text x="302" y="372" class="item">  等密度</text>
    <text x="290" y="396" class="item">🟡 Exponential(λ)</text>
    <text x="302" y="416" class="item">  无记忆, E=1/λ</text>
    <text x="290" y="438" class="item">🟡 Gamma(α,β)</text>
  </g>
  <g>
    <rect x="280" y="460" width="180" height="120" class="leaf"/>
    <text x="290" y="483" class="item">🟡 Beta(α,β)</text>
    <text x="302" y="503" class="item">  共轭先验</text>
    <text x="290" y="526" class="item">🔴 Chi²(k)</text>
    <text x="302" y="546" class="item">  Gamma(k/2, 1/2)</text>
    <text x="290" y="568" class="item">🔴 Student t(ν)</text>
  </g>

  <!-- MLE / MAP -->
  <g>
    <rect x="540" y="285" width="180" height="160" class="leaf"/>
    <text x="550" y="308" class="item">🔴 MLE</text>
    <text x="562" y="328" class="item">  argmax P(D|θ)</text>
    <text x="562" y="348" class="item">  = argmax lik</text>
    <text x="550" y="372" class="item">🔴 MAP</text>
    <text x="562" y="392" class="item">  argmax lik × prior</text>
    <text x="550" y="416" class="item">🟡 似然函数</text>
    <text x="562" y="436" class="item">  非概率分布</text>
  </g>
  <g>
    <rect x="540" y="460" width="180" height="120" class="leaf"/>
    <text x="550" y="483" class="item">🟡 对数似然</text>
    <text x="562" y="503" class="item">  乘积→求和</text>
    <text x="550" y="526" class="item">⭐ 共轭先验</text>
    <text x="562" y="546" class="item">  Beta→Beta</text>
    <text x="550" y="568" class="item">⭐ EM / HMM</text>
  </g>

  <!-- 抽样 -->
  <g>
    <rect x="780" y="285" width="180" height="160" class="leaf"/>
    <text x="790" y="308" class="item">🟢 总体 μ, σ²</text>
    <text x="790" y="332" class="item">🟢 样本 x₁...xₙ</text>
    <text x="790" y="356" class="item">🟢 统计量 x̄, s²</text>
    <text x="790" y="380" class="item">🔴 CLT</text>
    <text x="802" y="400" class="item">  x̄→N(μ, σ²/n)</text>
    <text x="790" y="424" class="item">🔴 标准误</text>
    <text x="802" y="442" class="item">  SE = σ/√n</text>
  </g>
  <g>
    <rect x="780" y="460" width="180" height="120" class="leaf"/>
    <text x="790" y="483" class="item">🟡 抽样分布</text>
    <text x="802" y="503" class="item">  统计量的分布</text>
    <text x="790" y="526" class="item">🟡 大数定律</text>
    <text x="802" y="546" class="item">  x̄ → μ</text>
    <text x="790" y="568" class="item">⭐ Bootstrap</text>
  </g>

  <g transform="translate(50, 610)">
    <text class="badge" fill="#38a169" x="0">🟢 入门</text>
    <text class="badge" fill="#d69e2e" x="80">🟡 进阶</text>
    <text class="badge" fill="#e53e3e" x="160">🔴 高阶</text>
    <text class="badge" fill="#718096" x="240">⭐ 拓展</text>
    <text x="480" class="item" font-size="14" fill="#718096">Ch05 · 2/3 · 概率基础 (1/3) → 分布与估计 → 信息论 (3/3)</text>
  </g>
</svg>