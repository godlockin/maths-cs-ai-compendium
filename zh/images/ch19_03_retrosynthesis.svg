  <text x="250" y="92" text-anchor="middle" font-size="10" fill="#64748b">score 0.82</text>

  <circle cx="250" cy="120" r="28" fill="#9333ea" fill-opacity="0.10" stroke="#9333ea" stroke-width="1.5"/>
  <text x="250" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#7e22ce">反应 b</text>
  <text x="250" y="132" text-anchor="middle" font-size="10" fill="#64748b">score 0.74</text>

  <circle cx="250" cy="160" r="28" fill="#9333ea" fill-opacity="0.10" stroke="#9333ea" stroke-width="1.5"/>
  <text x="250" y="158" text-anchor="middle" font-size="10" font-weight="600" fill="#7e22ce">反应 c</text>
  <text x="250" y="172" text-anchor="middle" font-size="10" fill="#64748b">score 0.61</text>

