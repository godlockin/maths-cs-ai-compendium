  <!-- Bottom label -->
  <text x="360" y="226" text-anchor="middle" font-size="11" fill="#475569">MCTS 树搜索 + 模板可行性打分 → 选最优路径 (反应 a → 水杨酸 + 乙酸酐)</text>
