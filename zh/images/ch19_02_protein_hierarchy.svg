<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <text x="400" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">蛋白质四级结构: Primary → Secondary → Tertiary → Quaternary</text>

  <!-- Primary -->
  <text x="120" y="62" fill="#444" font-size="12" font-weight="bold" text-anchor="middle">一级 (Primary)</text>
  <text x="120" y="80" fill="#666" font-size="11" text-anchor="middle">氨基酸序列</text>
  <rect x="20" y="95" width="22" height="22" fill="#e74c3c" stroke="#333" opacity="0.85"/>
  <text x="31" y="111" fill="#fff" font-size="11" text-anchor="middle">M</text>
  <rect x="42" y="95" width="22" height="22" fill="#3498db" stroke="#333" opacity="0.85"/>
  <text x="53" y="111" fill="#fff" font-size="11" text-anchor="middle">K</text>
  <rect x="64" y="95" width="22" height="22" fill="#2ecc71" stroke="#333" opacity="0.85"/>
  <text x="75" y="111" fill="#fff" font-size="11" text-anchor="middle">V</text>
  <rect x="86" y="95" width="22" height="22" fill="#f39c12" stroke="#333" opacity="0.85"/>
  <text x="97" y="111" fill="#fff" font-size="11" text-anchor="middle">L</text>
  <rect x="108" y="95" width="22" height="22" fill="#9b59b6" stroke="#333" opacity="0.85"/>
  <text x="119" y="111" fill="#fff" font-size="11" text-anchor="middle">W</text>
  <rect x="130" y="95" width="22" height="22" fill="#e74c3c" stroke="#333" opacity="0.85"/>
  <text x="141" y="111" fill="#fff" font-size="11" text-anchor="middle">D</text>
  <rect x="152" y="95" width="22" height="22" fill="#3498db" stroke="#333" opacity="0.85"/>
  <text x="163" y="111" fill="#fff" font-size="11" text-anchor="middle">E</text>
  <rect x="174" y="95" width="22" height="22" fill="#2ecc71" stroke="#333" opacity="0.85"/>
  <text x="185" y="111" fill="#fff" font-size="11" text-anchor="middle">A</text>
  <rect x="196" y="95" width="22" height="22" fill="#f39c12" stroke="#333" opacity="0.85"/>
  <text x="207" y="111" fill="#fff" font-size="11" text-anchor="middle">F</text>
  <line x1="65" y1="135" x2="65" y2="170" stroke="#888" stroke-width="1.5"/>
  <polygon points="62,170 68,170 65,176" fill="#888"/>

  <!-- Secondary -->
  <text x="280" y="62" fill="#444" font-size="12" font-weight="bold" text-anchor="middle">二级 (Secondary)</text>
  <text x="280" y="80" fill="#666" font-size="11" text-anchor="middle">α 螺旋 / β 折叠</text>
  <!-- Alpha helix as helix pattern -->
  <ellipse cx="200" cy="120" rx="10" ry="6" fill="none" stroke="#3498db" stroke-width="2"/>
  <ellipse cx="220" cy="110" rx="10" ry="6" fill="none" stroke="#3498db" stroke-width="2"/>
  <ellipse cx="240" cy="120" rx="10" ry="6" fill="none" stroke="#3498db" stroke-width="2"/>
  <ellipse cx="260" cy="110" rx="10" ry="6" fill="none" stroke="#3498db" stroke-width="2"/>
  <ellipse cx="280" cy="120" rx="10" ry="6" fill="none" stroke="#3498db" stroke-width="2"/>
  <ellipse cx="300" cy="110" rx="10" ry="6" fill="none" stroke="#3498db" stroke-width="2"/>
  <ellipse cx="320" cy="120" rx="10" ry="6" fill="none" stroke="#3498db" stroke-width="2"/>
  <ellipse cx="340" cy="110" rx="10" ry="6" fill="none" stroke="#3498db" stroke-width="2"/>
  <text x="270" y="155" fill="#3498db" font-size="11" font-weight="bold" text-anchor="middle">α-helix</text>
  <line x1="220" y1="180" x2="220" y2="215" stroke="#888" stroke-width="1.5"/>
  <polygon points="217,215 223,215 220,221" fill="#888"/>

  <!-- Tertiary -->
  <text x="500" y="62" fill="#444" font-size="12" font-weight="bold" text-anchor="middle">三级 (Tertiary)</text>
  <text x="500" y="80" fill="#666" font-size="11" text-anchor="middle">3D 折叠</text>
  <!-- Ribbon-like folded structure -->
  <path d="M 380 130 Q 410 90 450 110 Q 490 140 530 100 Q 570 130 620 115"
        fill="none" stroke="#e74c3c" stroke-width="4"/>
  <circle cx="410" cy="105" r="6" fill="#3498db"/>
  <circle cx="450" cy="110" r="6" fill="#2ecc71"/>
  <circle cx="490" cy="130" r="6" fill="#f39c12"/>
  <circle cx="530" cy="100" r="6" fill="#9b59b6"/>
  <circle cx="570" cy="130" r="6" fill="#2ecc71"/>
  <circle cx="600" cy="115" r="6" fill="#3498db"/>
  <text x="500" y="160" fill="#e74c3c" font-size="11" font-weight="bold" text-anchor="middle">三维折叠</text>
  <line x1="490" y1="180" x2="490" y2="215" stroke="#888" stroke-width="1.5"/>
  <polygon points="487,215 493,215 490,221" fill="#888"/>

  <!-- Quaternary -->
  <text x="700" y="62" fill="#444" font-size="12" font-weight="bold" text-anchor="middle">四级 (Quaternary)</text>
  <text x="700" y="80" fill="#666" font-size="11" text-anchor="middle">多链组装</text>
  <g transform="translate(660, 100)">
    <circle cx="0" cy="0" r="22" fill="#e74c3c" opacity="0.6" stroke="#333"/>
    <circle cx="30" cy="0" r="22" fill="#3498db" opacity="0.6" stroke="#333"/>
    <circle cx="15" cy="25" r="22" fill="#2ecc71" opacity="0.6" stroke="#333"/>
    <text x="15" y="55" fill="#666" font-size="11" text-anchor="middle">多亚基</text>
  </g>

  <!-- Annotation -->
  <text x="120" y="245" fill="#444" font-size="11" font-style="italic" text-anchor="middle">共价肽键连接</text>
  <text x="280" y="245" fill="#444" font-size="11" font-style="italic" text-anchor="middle">氢键 (i → i+4)</text>
  <text x="500" y="245" fill="#444" font-size="11" font-style="italic" text-anchor="middle">疏水 + 范德华 + 盐桥</text>
  <text x="700" y="245" fill="#444" font-size="11" font-style="italic" text-anchor="middle">多亚基协同</text>

  <!-- Bottom: hydrophobic core -->
  <text x="400" y="305" fill="#444" font-size="12" font-weight="bold" text-anchor="middle">疏水塌缩是折叠的物理驱动力 (Anfinsen)</text>
  <rect x="140" y="330" width="520" height="40" fill="#fff" stroke="#aaa"/>
  <circle cx="200" cy="350" r="12" fill="#3498db"/>
  <text x="200" y="354" fill="#fff" font-size="10" text-anchor="middle">K</text>
  <circle cx="230" cy="350" r="12" fill="#e74c3c"/>
  <text x="230" y="354" fill="#fff" font-size="10" text-anchor="middle">D</text>
  <circle cx="260" cy="350" r="12" fill="#3498db"/>
  <text x="260" y="354" fill="#fff" font-size="10" text-anchor="middle">E</text>
  <text x="290" y="354" fill="#666" font-size="11" font-style="italic">极性 (亲水)</text>
  <circle cx="380" cy="350" r="12" fill="#2ecc71"/>
  <text x="380" y="354" fill="#fff" font-size="10" text-anchor="middle">V</text>
  <circle cx="410" cy="350" r="12" fill="#f39c12"/>
  <text x="410" y="354" fill="#fff" font-size="10" text-anchor="middle">L</text>
  <circle cx="440" cy="350" r="12" fill="#9b59b6"/>
  <text x="440" y="354" fill="#fff" font-size="10" text-anchor="middle">W</text>
  <text x="470" y="354" fill="#666" font-size="11" font-style="italic">非极性 (疏水)</text>
  <text x="620" y="354" fill="#666" font-size="11" font-style="italic">核心 (Core)</text>
</svg>
