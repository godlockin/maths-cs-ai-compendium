<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }</style>
  <rect width="720" height="320" fill="#fafbfc"/>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">静态 vs 活体 benchmark 的污染风险时间演化</text>
  <text x="360" y="58" text-anchor="middle" font-size="11" fill="#64748b">静态上榜后被面向优化, 活体通过时间戳过滤保持不变</text>

  <!-- Axes -->
  <line x1="60" y1="250" x2="690" y2="250" stroke="#334155" stroke-width="1.5"/>
  <line x1="60" y1="90" x2="60" y2="250" stroke="#334155" stroke-width="1.5"/>
  <text x="700" y="270" font-size="11" fill="#475569" text-anchor="end">时间 →</text>

  <!-- Y labels -->
  <text x="55" y="105" font-size="9" fill="#64748b" text-anchor="end">高分</text>
  <text x="55" y="180" font-size="9" fill="#64748b" text-anchor="end">中</text>
  <text x="55" y="245" font-size="9" fill="#64748b" text-anchor="end">真能力</text>

  <!-- Time tick marks -->
  <g font-size="10" fill="#64748b" text-anchor="middle">
    <text x="100" y="265">t₀ 发布</text>
    <text x="240" y="265">t₁ 引爆</text>
    <text x="400" y="265">t₂ SOTA</text>
    <text x="560" y="265">t₃ 饱和</text>
  </g>

  <!-- Static curve: shoot up -->
  <path d="M 100 245 L 200 240 L 240 230 L 320 200 L 400 130 L 480 115 L 560 108 L 660 105"
        fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="490" y="98" font-size="11" font-weight="700" fill="#dc2626">静态 benchmark 曲线</text>

  <!-- gap (contamination) -->
  <path d="M 320 200 L 400 130 L 480 115 L 560 108"
        fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="5 3"/>
  <path d="M 320 200 Q 400 165 480 148 Q 560 138 660 135"
        fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3" stroke-opacity="0.6"/>
  <text x="490" y="160" font-size="10.5" fill="#9333ea" font-weight="600">虚线: 含污染 reported</text>

  <!-- shaded contamination region -->
  <path d="M 320 200 Q 400 165 480 148 L 480 115 Q 400 130 320 200 Z" fill="#9333ea" fill-opacity="0.10"/>
  <text x="420" y="180" font-size="10" fill="#9333ea" font-weight="700" text-anchor="middle">污染 gap</text>

  <!-- Live curve: flat -->
  <line x1="100" y1="245" x2="660" y2="245" stroke="#16a34a" stroke-width="2.5"/>
  <text x="610" y="240" font-size="11" font-weight="700" fill="#16a34a" text-anchor="end">活体 benchmark 真能力</text>

  <!-- annotations -->
  <rect x="80" y="120" width="120" height="50" rx="6" fill="#dc2626" fill-opacity="0.08" stroke="#dc2626"/>
  <text x="140" y="140" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">污染扩张区</text>
  <text x="140" y="156" text-anchor="middle" font-size="9.5" fill="#dc2626">reported ≫ true</text>

  <rect x="80" y="240" width="160" height="40" rx="6" fill="#16a34a" fill-opacity="0.08" stroke="#16a34a"/>
  <text x="160" y="258" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">活体 — 始终反映真能力</text>
  <text x="160" y="272" text-anchor="middle" font-size="9.5" fill="#16a34a">t_pub &gt; T_c 才进入评测</text>

  <text x="360" y="305" text-anchor="middle" font-size="10.5" fill="#64748b" font-style="italic">GPT-4 在 LiveCodeBench 比 HumanEval 低 20+ 个百分点 — 强烈提示 HumanEval 已污染</text>
</svg>
