<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
</style>
<rect width="700" height="280" fill="#fafbfc"/>
<defs>
  <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
  <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
  <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
  <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
</defs>
<rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
<text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">条件数示意: 良态 vs 病态矩阵对扰动的放大</text>

<!-- Left: well-conditioned (kappa small) -->
<g transform="translate(60,70)">
  <text x="100" y="-12" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">良态 (well-conditioned, κ≈1)</text>
  <!-- input ball -->
  <circle cx="40" cy="105" r="24" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2" stroke-width="1.5"/>
  <circle cx="40" cy="105" r="2.5" fill="#0891b2"/>
  <text x="40" y="155" text-anchor="middle" font-size="10" fill="#475569">输入扰动 δx (球)</text>
  <!-- arrow -->
  <line x1="76" y1="105" x2="118" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>
  <text x="97" y="98" text-anchor="middle" font-size="10" fill="#475569">A</text>
  <!-- output ball (still round, similar size) -->
  <circle cx="160" cy="105" r="24" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="160" cy="105" r="2.5" fill="#16a34a"/>
  <text x="160" y="155" text-anchor="middle" font-size="10" fill="#475569">输出扰动 (球,大小相近)</text>
</g>

<!-- Right: ill-conditioned -->
<g transform="translate(380,70)">
  <text x="100" y="-12" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">病态 (ill-conditioned, κ≫1)</text>
  <!-- input ball (small) -->
  <circle cx="40" cy="105" r="14" fill="#0891b2" fill-opacity="0.18" stroke="#0891b2" stroke-width="1.5"/>
  <circle cx="40" cy="105" r="2.5" fill="#0891b2"/>
  <text x="40" y="155" text-anchor="middle" font-size="10" fill="#475569">输入扰动 δx (小球)</text>
  <!-- arrow -->
  <line x1="66" y1="105" x2="118" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>
  <text x="92" y="98" text-anchor="middle" font-size="10" fill="#475569">A</text>
  <!-- output stretched ellipse -->
  <ellipse cx="160" cy="105" rx="56" ry="6" fill="#dc2626" fill-opacity="0.18" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="160" cy="105" r="2.5" fill="#dc2626"/>
  <text x="160" y="125" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">被严重拉长!</text>
  <text x="160" y="155" text-anchor="middle" font-size="10" fill="#475569">||δx||×κ ≈ ||Aδx||</text>
</g>

<!-- bottom: formula -->
<g transform="translate(40,238)">
  <rect x="0" y="0" width="620" height="32" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="310" y="20" text-anchor="middle" font-size="12" fill="#1e3a8a">
    相对误差满足: ‖δy‖/‖y‖ ≤ κ(A) × ‖δx‖/‖x‖  ——  κ = σ_max / σ_min
  </text>
</g>
</svg>
