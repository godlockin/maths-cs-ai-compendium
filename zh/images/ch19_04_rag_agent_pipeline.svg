<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="260" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="white">RAG + Agent 融合的客服流水线</text>

  <!-- Two big sections: RAG (left), Agent (right) -->
  <rect x="20" y="50" width="320" height="180" rx="6" fill="#9333ea" fill-opacity="0.05" stroke="#9333ea" stroke-width="1.5"/>
  <text x="180" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">RAG 检索增强</text>

  <!-- User question at top-left -->
  <rect x="40" y="86" width="120" height="32" rx="4" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.2"/>
  <text x="100" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">用户问题</text>
  <text x="100" y="112" text-anchor="middle" font-size="9" fill="#64748b">"订单 #123 退款?"</text>

  <!-- Embedding -->
  <line x1="160" y1="102" x2="200" y2="102" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-64748b)"/>
  <rect x="200" y="86" width="100" height="32" rx="4" fill="white" stroke="#9333ea" stroke-width="1.2"/>
  <text x="250" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#7e22ce">Embedding</text>
  <text x="250" y="112" text-anchor="middle" font-size="9" fill="#64748b">q → 768 维</text>

  <!-- Vector search -->
  <line x1="300" y1="102" x2="60" y2="160" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-64748b)"/>

  <!-- Vector DB -->
  <rect x="40" y="144" width="120" height="68" rx="4" fill="#9333ea" fill-opacity="0.10" stroke="#9333ea" stroke-width="1.2"/>
  <text x="100" y="162" text-anchor="middle" font-size="10" font-weight="600" fill="#7e22ce">向量数据库</text>
  <text x="100" y="178" text-anchor="middle" font-size="9" fill="#64748b">政策文档</text>
  <text x="100" y="190" text-anchor="middle" font-size="9" fill="#64748b">FAQ 知识库</text>
  <text x="100" y="202" text-anchor="middle" font-size="9" fill="#64748b">工单历史</text>

  <!-- Top-K retrieved docs -->
  <line x1="160" y1="178" x2="200" y2="178" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-64748b)"/>
  <rect x="200" y="162" width="120" height="36" rx="4" fill="white" stroke="#9333ea" stroke-width="1.2"/>
  <text x="260" y="178" text-anchor="middle" font-size="10" font-weight="600" fill="#7e22ce">Top-K 政策片段</text>
  <text x="260" y="190" text-anchor="middle" font-size="9" fill="#64748b">chunk 1, 2, 3</text>

  <!-- Right: Agent -->
  <rect x="380" y="50" width="320" height="180" rx="6" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.5"/>
  <text x="540" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Agent 循环</text>

  <line x1="320" y1="180" x2="380" y2="180" stroke="#9333ea" stroke-width="1.5" marker-end="url(#a-9333ea)"/>
  <text x="350" y="174" text-anchor="middle" font-size="9" fill="#7e22ce">注入</text>

  <!-- LLM brain -->
  <circle cx="540" cy="130" r="32" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="1.5"/>
  <text x="540" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">LLM</text>
  <text x="540" y="142" text-anchor="middle" font-size="9" fill="#64748b">决策</text>

  <!-- Tool 1: get_order -->
  <rect x="400" y="172" width="100" height="36" rx="4" fill="#d97706" fill-opacity="0.10" stroke="#d97706" stroke-width="1.2"/>
  <text x="450" y="188" text-anchor="middle" font-size="10" font-weight="600" fill="#b45309">get_order</text>
  <text x="450" y="200" text-anchor="middle" font-size="9" fill="#64748b">查订单状态</text>

  <!-- Tool 2: refund -->
  <rect x="580" y="172" width="100" height="36" rx="4" fill="#d97706" fill-opacity="0.10" stroke="#d97706" stroke-width="1.2"/>
  <text x="630" y="188" text-anchor="middle" font-size="10" font-weight="600" fill="#b45309">initiate_refund</text>
  <text x="630" y="200" text-anchor="middle" font-size="9" fill="#64748b">执行退款</text>

  <line x1="508" y1="148" x2="450" y2="172" stroke="#d97706" stroke-width="1.2" marker-end="url(#a-d97706)"/>
  <line x1="572" y1="148" x2="630" y2="172" stroke="#d97706" stroke-width="1.2" marker-end="url(#a-d97706)"/>

  <!-- Answer -->
  <line x1="540" y1="100" x2="540" y2="86" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-16a34a)"/>
  <rect x="430" y="58" width="220" height="22" rx="3" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="1.2"/>
  <text x="540" y="74" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">回答用户 + 退款链接</text>

  <!-- Bottom legend -->
  <text x="360" y="246" text-anchor="middle" font-size="11" fill="#475569">"先检索政策片段, 再让 Agent 调用工具" = 知识 + 行动 双闭环</text>
</svg>
