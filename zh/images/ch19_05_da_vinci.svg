<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="280" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="white">达芬奇手术系统架构: 遥操作 + AI 子任务</text>

  <!-- Left: Surgeon console -->
  <rect x="20" y="55" width="190" height="150" rx="6" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="1.5"/>
  <text x="115" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">主控台 (Console)</text>

  <!-- Surgeon silhouette -->
  <circle cx="115" cy="100" r="12" fill="#94a3b8"/>
  <rect x="100" y="112" width="30" height="22" rx="3" fill="#94a3b8"/>
  <text x="115" y="105" text-anchor="middle" font-size="9" fill="white">医生</text>

  <!-- 3D viewer -->
  <rect x="40" y="142" width="150" height="14" rx="2" fill="white" stroke="#1d4ed8"/>
  <text x="115" y="153" text-anchor="middle" font-size="9" fill="#1d4ed8">3D 高清视觉 (双目光学)</text>

  <!-- Hand controllers -->
  <rect x="50" y="164" width="60" height="14" rx="3" fill="#d97706" fill-opacity="0.20" stroke="#d97706"/>
  <text x="80" y="174" text-anchor="middle" font-size="9" fill="#b45309">左主手柄</text>
  <rect x="120" y="164" width="60" height="14" rx="3" fill="#d97706" fill-opacity="0.20" stroke="#d97706"/>
  <text x="150" y="174" text-anchor="middle" font-size="9" fill="#b45309">右主手柄</text>

  <text x="115" y="194" text-anchor="middle" font-size="9" fill="#64748b">脚踏: 电切 / 夹闭 / 镜头</text>

  <!-- Middle: Main computer -->
  <rect x="240" y="70" width="120" height="120" rx="6" fill="#0891b2" fill-opacity="0.08" stroke="#0891b2" stroke-width="2"/>
  <text x="300" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#0891b2">主控电脑</text>

  <text x="300" y="115" text-anchor="middle" font-size="9" fill="#475569">高清视频处理</text>
  <text x="300" y="130" text-anchor="middle" font-size="9" fill="#475569">↓</text>
  <text x="300" y="145" text-anchor="middle" font-size="9" fill="#475569">抖动过滤</text>
  <text x="300" y="160" text-anchor="middle" font-size="9" fill="#475569">↓</text>
  <text x="300" y="175" text-anchor="middle" font-size="9" fill="#475569">运动缩放 5:1</text>

  <line x1="210" y1="115" x2="240" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>
  <line x1="360" y1="115" x2="394" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>

  <!-- Right: Patient cart - 4 arm robot -->
  <rect x="394" y="55" width="306" height="200" rx="6" fill="#dc2626" fill-opacity="0.04" stroke="#dc2626" stroke-width="1.5"/>
  <text x="547" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">病人床旁 4 臂机械臂</text>

  <!-- 4 arms arrangement -->
  <g stroke="#dc2626" stroke-width="2" fill="none">
    <path d="M 420 100 L 440 140 L 460 160"/>
    <path d="M 460 100 L 470 140 L 480 160"/>
    <path d="M 540 100 L 555 140 L 570 160"/>
    <path d="M 580 100 L 590 140 L 600 160"/>
  </g>

  <!-- Patient bed -->
  <rect x="480" y="180" width="160" height="20" rx="3" fill="#94a3b8"/>
  <text x="560" y="194" text-anchor="middle" font-size="10" fill="#0f172a">病人</text>

  <!-- End effectors (EndoWrist) -->
  <circle cx="460" cy="160" r="7" fill="#dc2626"/>
  <text x="460" y="177" text-anchor="middle" font-size="8" fill="#7f1d1d">7-DoF</text>
  <circle cx="480" cy="160" r="7" fill="#dc2626"/>
  <text x="480" y="177" text-anchor="middle" font-size="8" fill="#7f1d1d">镜头</text>
  <circle cx="570" cy="160" r="7" fill="#dc2626"/>
  <text x="570" y="177" text-anchor="middle" font-size="8" fill="#7f1d1d">7-DoF</text>
  <circle cx="600" cy="160" r="7" fill="#dc2626"/>
  <text x="600" y="177" text-anchor="middle" font-size="8" fill="#7f1d1d">7-DoF</text>

  <!-- AI sub-task module (parallel) -->
  <line x1="300" y1="190" x2="300" y2="220" stroke="#9333ea" stroke-width="1.5" marker-end="url(#a-9333ea)"/>
  <rect x="180" y="220" width="280" height="36" rx="5" fill="#9333ea" fill-opacity="0.08" stroke="#9333ea" stroke-width="1.5"/>
  <text x="320" y="237" text-anchor="middle" font-size="11" font-weight="700" fill="#7e22ce">AI 子任务模块 (并行接入)</text>
  <text x="320" y="250" text-anchor="middle" font-size="9" fill="#475569">缝合 · 打结 · 视频标注 · STAR 自主吻合</text>

  <!-- Bottom stats -->
  <text x="360" y="275" text-anchor="middle" font-size="10" fill="#475569">全球 8000+ 台装机 · 累计 1000 万+ 例手术 (截至 2024)</text>
</svg>
