<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }</style>
  <rect width="720" height="380" fill="#fafbfc"/>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">数据污染的三种形式 — 严重度递减 · 检测难度递增</text>
  <text x="360" y="58" text-anchor="middle" font-size="11" fill="#64748b">exact match / semantic near-duplicate / contamination via web scrape</text>

  <!-- 3 cards -->
  <g transform="translate(20,80)">
    <rect x="0" y="0" width="220" height="270" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="38" rx="10" fill="#dc2626"/>
    <rect x="0" y="28" width="220" height="10" fill="#dc2626"/>
    <text x="110" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="white">1. 精确匹配</text>
    <text x="20" y="68" font-size="11" font-weight="600" fill="#475569">形态</text>
    <text x="20" y="85" font-size="10.5" fill="#334155">训练语料逐字包含 prompt</text>
    <text x="20" y="100" font-size="10.5" fill="#334155">/ answer / prompt+answer</text>
    <text x="20" y="124" font-size="11" font-weight="600" fill="#475569">举例</text>
    <text x="20" y="141" font-size="10.5" fill="#334155">HumanEval 题目与</text>
    <text x="20" y="156" font-size="10.5" fill="#334155">canonical solution 在 GitHub</text>
    <text x="20" y="180" font-size="11" font-weight="600" fill="#475569">检测难度</text>
    <rect x="20" y="190" width="180" height="14" fill="#f1f5f9"/>
    <rect x="20" y="190" width="40" height="14" fill="#16a34a" fill-opacity="0.8"/>
    <text x="120" y="201" text-anchor="middle" font-size="10" fill="#1e293b" font-weight="700">易 (n-gram 即可)</text>
    <text x="20" y="220" font-size="11" font-weight="600" fill="#dc2626">严重度: ⭐⭐⭐⭐⭐</text>
    <text x="20" y="240" font-size="10" fill="#64748b">最直接, 记忆完整</text>
    <text x="20" y="255" font-size="10" fill="#64748b">检测: 8-gram 倒排索引</text>
  </g>

  <g transform="translate(250,80)">
    <rect x="0" y="0" width="220" height="270" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="38" rx="10" fill="#d97706"/>
    <rect x="0" y="28" width="220" height="10" fill="#d97706"/>
    <text x="110" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="white">2. 近似重复</text>
    <text x="20" y="68" font-size="11" font-weight="600" fill="#475569">形态</text>
    <text x="20" y="85" font-size="10.5" fill="#334155">字面不同但语义等价</text>
    <text x="20" y="100" font-size="10.5" fill="#334155">(翻译 / 回译 / rephrase)</text>
    <text x="20" y="124" font-size="11" font-weight="600" fill="#475569">举例</text>
    <text x="20" y="141" font-size="10.5" fill="#334155">MMLU 选择题 → 中文</text>
    <text x="20" y="156" font-size="10.5" fill="#334155">再回译, 答案模式仍学</text>
    <text x="20" y="180" font-size="11" font-weight="600" fill="#475569">检测难度</text>
    <rect x="20" y="190" width="180" height="14" fill="#f1f5f9"/>
    <rect x="20" y="190" width="100" height="14" fill="#d97706" fill-opacity="0.8"/>
    <text x="120" y="201" text-anchor="middle" font-size="10" fill="#1e293b" font-weight="700">中 (嵌入相似度)</text>
    <text x="20" y="220" font-size="11" font-weight="600" fill="#d97706">严重度: ⭐⭐⭐</text>
    <text x="20" y="240" font-size="10" fill="#64748b">"这类问题答案模式"</text>
    <text x="20" y="255" font-size="10" fill="#64748b">检测: Min-K% Prob / MIA</text>
  </g>

  <g transform="translate(480,80)">
    <rect x="0" y="0" width="220" height="270" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="38" rx="10" fill="#9333ea"/>
    <rect x="0" y="28" width="220" height="10" fill="#9333ea"/>
    <text x="110" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="white">3. 爬虫间接</text>
    <text x="20" y="68" font-size="11" font-weight="600" fill="#475569">形态</text>
    <text x="20" y="85" font-size="10.5" fill="#334155">web crawl (Common Crawl)</text>
    <text x="20" y="100" font-size="10.5" fill="#334155">吸入 benchmark 网页</text>
    <text x="20" y="124" font-size="11" font-weight="600" fill="#475569">举例</text>
    <text x="20" y="141" font-size="10.5" fill="#334155">MMLU leaderboard 页 /</text>
    <text x="20" y="156" font-size="10.5" fill="#334155">HumanEval GitHub / arXiv</text>
    <text x="20" y="180" font-size="11" font-weight="600" fill="#475569">检测难度</text>
    <rect x="20" y="190" width="180" height="14" fill="#f1f5f9"/>
    <rect x="20" y="190" width="156" height="14" fill="#dc2626" fill-opacity="0.8"/>
    <text x="120" y="201" text-anchor="middle" font-size="10" fill="#1e293b" font-weight="700">极难 (时间维度证据)</text>
    <text x="20" y="220" font-size="11" font-weight="600" fill="#9333ea">严重度: ⭐⭐⭐⭐</text>
    <text x="20" y="240" font-size="10" fill="#64748b">没故意抄, 网络灌进来</text>
    <text x="20" y="255" font-size="10" fill="#64748b">检测: cutoff 前后对比</text>
  </g>
</svg>
