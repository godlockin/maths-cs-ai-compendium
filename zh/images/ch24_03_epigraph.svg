<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
</style>
<rect width="700" height="360" fill="#fafbfc"/>
<defs>
  <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
  <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
  <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
  <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
</defs>
<rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
<text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">凸函数 f(x)=x² 与它的 epigraph</text>

<!-- Left: convex function f(x)=x^2 -->
<g transform="translate(30,60)">
  <text x="160" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">f(x) = x² (凸函数)</text>
  <!-- axes -->
  <line x1="20" y1="20" x2="20" y2="220" stroke="#475569" stroke-width="1.2" marker-end="url(#a-64748b)"/>
  <line x1="20" y1="220" x2="320" y2="220" stroke="#475569" stroke-width="1.2" marker-end="url(#a-64748b)"/>
  <text x="14" y="22" text-anchor="end" font-size="10" fill="#475569">f</text>
  <text x="320" y="235" text-anchor="end" font-size="10" fill="#475569">x</text>
  <!-- parabola: f(x)=x² at scale 200/4^2 = 12.5 per unit, x range -2..2 -->
  <path d="M 80 220 Q 170 220 145 70 Q 170 220 260 220" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <!-- chord between (-1.5, 2.25) and (1.5, 2.25) -> (45, 192) to (295, 192) -->
  <line x1="80" y1="190" x2="260" y2="190" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- two sample points on parabola -->
  <circle cx="80" cy="190" r="3.5" fill="#dc2626"/>
  <circle cx="260" cy="190" r="3.5" fill="#dc2626"/>
  <!-- mid chord point stays above parabola -->
  <circle cx="170" cy="220" r="3.5" fill="#16a34a"/>
  <text x="80" y="208" text-anchor="middle" font-size="9" fill="#dc2626">f(x₁)</text>
  <text x="260" y="208" text-anchor="middle" font-size="9" fill="#dc2626">f(x₂)</text>
  <text x="170" y="238" text-anchor="middle" font-size="9" fill="#16a34a">f(中点)</text>
  <text x="170" y="252" text-anchor="middle" font-size="10" fill="#475569">f(θx₁+(1-θ)x₂) ≤ θf(x₁)+(1-θ)f(x₂)</text>
</g>

<!-- Right: epigraph in 3D-ish 2D -->
<g transform="translate(380,60)">
  <text x="160" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#9333ea">epi(f) = {(x, t) : f(x) ≤ t}</text>
  <!-- axes: x to right, t up -->
  <line x1="20" y1="240" x2="20" y2="20" stroke="#475569" stroke-width="1.2" marker-end="url(#a-64748b)"/>
  <line x1="20" y1="240" x2="320" y2="240" stroke="#475569" stroke-width="1.2" marker-end="url(#a-64748b)"/>
  <text x="14" y="22" text-anchor="end" font-size="10" fill="#475569">t</text>
  <text x="320" y="255" text-anchor="end" font-size="10" fill="#475569">x</text>
  <!-- epigraph region: shaded above curve -->
  <path d="M 20 240 L 80 190 L 260 190 L 320 240 L 320 20 L 20 20 Z" fill="#9333ea" fill-opacity="0.12" stroke="none"/>
  <!-- curve f(x) again -->
  <path d="M 80 190 Q 170 220 145 70 Q 170 220 260 190" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <!-- convex hull boundary above curve -->
  <line x1="20" y1="240" x2="80" y2="190" stroke="#2563eb" stroke-width="1"/>
  <line x1="260" y1="190" x2="320" y2="240" stroke="#2563eb" stroke-width="1"/>
  <!-- chord above curve in epigraph -->
  <line x1="80" y1="180" x2="260" y2="180" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="170" y="173" text-anchor="middle" font-size="9" fill="#16a34a">弦段 ⊂ epi(f)</text>
  <!-- two convex combination points -->
  <circle cx="120" cy="178" r="3" fill="#16a34a"/>
  <circle cx="220" cy="178" r="3" fill="#16a34a"/>
  <text x="170" y="265" text-anchor="middle" font-size="10" fill="#475569">曲线及其上方所有点构成凸集</text>
  <text x="170" y="280" text-anchor="middle" font-size="10" font-weight="700" fill="#9333ea">f 凸 ⟺ epi(f) 是凸集</text>
</g>
</svg>
