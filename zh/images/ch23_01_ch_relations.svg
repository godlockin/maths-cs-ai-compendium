<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style> text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; } </style>
<rect width="720" height="380" fill="#fafbfc"/>
<defs>
  <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
  <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
</defs>

<!-- 顶部 Banner -->
<rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
<text x="360" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="white">Ch21 / Ch22 / Ch23 关系图</text>

<!-- 三个核心圆 -->
<g>
  <circle cx="200" cy="160" r="68" fill="#9333ea" fill-opacity="0.12" stroke="#9333ea" stroke-width="2"/>
  <text x="200" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#9333ea">Ch21 对齐</text>
  <text x="200" y="172" text-anchor="middle" font-size="11" fill="#475569">Alignment</text>
  <text x="200" y="190" text-anchor="middle" font-size="10" fill="#64748b">会不会做正确的事</text>
</g>
<g>
  <circle cx="520" cy="160" r="68" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="2"/>
  <text x="520" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">Ch22 评测</text>
  <text x="520" y="172" text-anchor="middle" font-size="11" fill="#475569">Evaluation</text>
  <text x="520" y="190" text-anchor="middle" font-size="10" fill="#64748b">能不能做成事</text>
</g>
<g>
  <circle cx="360" cy="280" r="68" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="2.5"/>
  <text x="360" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">Ch23 Agent</text>
  <text x="360" y="292" text-anchor="middle" font-size="11" fill="#475569">Agent</text>
  <text x="360" y="310" text-anchor="middle" font-size="10" fill="#64748b">长什么样 · 怎么造</text>
</g>

<!-- 箭头 (Ch21 -> Ch23, Ch22 -> Ch23, Ch21 <-> Ch22) -->
<line x1="240" y1="200" x2="320" y2="245" stroke="#9333ea" stroke-width="1.8" marker-end="url(#a-9333ea)"/>
<line x1="480" y1="200" x2="400" y2="245" stroke="#d97706" stroke-width="1.8" marker-end="url(#a-d97706)"/>
<line x1="280" y1="155" x2="440" y2="155" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- 双向标签 -->
<text x="360" y="142" text-anchor="middle" font-size="10" fill="#64748b">互为校准: 对齐 ↔ 评测</text>

<!-- 底部说明条 -->
<rect x="60" y="345" width="600" height="20" rx="4" fill="#f1f5f9"/>
<text x="360" y="360" text-anchor="middle" font-size="11" font-style="italic" fill="#475569">Agent 是对齐与评测的放大器 — Agent 把 Ch21 的对齐风险与 Ch22 的评测信号都放大 N 倍</text>

</svg>
