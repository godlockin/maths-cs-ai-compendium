<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <text x="400" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">AlphaFold 2 架构: Evoformer + Structure Module</text>

  <!-- MSA representation -->
  <text x="120" y="60" fill="#444" font-size="12" font-weight="bold" text-anchor="middle">MSA (多序列比对)</text>
  <g transform="translate(20, 75)">
    <!-- Coloured sequence rows -->
    <g font-family="monospace" font-size="11">
      <rect x="0" y="0" width="20" height="18" fill="#e74c3c"/><text x="10" y="13" fill="#fff" text-anchor="middle">M</text>
      <rect x="20" y="0" width="20" height="18" fill="#3498db"/><text x="30" y="13" fill="#fff" text-anchor="middle">K</text>
      <rect x="40" y="0" width="20" height="18" fill="#2ecc71"/><text x="50" y="13" fill="#fff" text-anchor="middle">V</text>
      <rect x="60" y="0" width="20" height="18" fill="#f39c12"/><text x="70" y="13" fill="#fff" text-anchor="middle">L</text>
      <rect x="80" y="0" width="20" height="18" fill="#9b59b6"/><text x="90" y="13" fill="#fff" text-anchor="middle">W</text>
      <rect x="100" y="0" width="20" height="18" fill="#e74c3c"/><text x="110" y="13" fill="#fff" text-anchor="middle">D</text>
      <rect x="120" y="0" width="20" height="18" fill="#3498db"/><text x="130" y="13" fill="#fff" text-anchor="middle">E</text>
      <rect x="140" y="0" width="20" height="18" fill="#2ecc71"/><text x="150" y="13" fill="#fff" text-anchor="middle">A</text>

      <rect x="0" y="18" width="20" height="18" fill="#3498db"/><text x="10" y="31" fill="#fff" text-anchor="middle">K</text>
      <rect x="20" y="18" width="20" height="18" fill="#e74c3c"/><text x="30" y="31" fill="#fff" text-anchor="middle">M</text>
      <rect x="40" y="18" width="20" height="18" fill="#f39c12"/><text x="50" y="31" fill="#fff" text-anchor="middle">L</text>
      <rect x="60" y="18" width="20" height="18" fill="#2ecc71"/><text x="70" y="31" fill="#fff" text-anchor="middle">V</text>
      <rect x="80" y="18" width="20" height="18" fill="#e74c3c"/><text x="90" y="31" fill="#fff" text-anchor="middle">D</text>
      <rect x="100" y="18" width="20" height="18" fill="#9b59b6"/><text x="110" y="31" fill="#fff" text-anchor="middle">W</text>
      <rect x="120" y="18" width="20" height="18" fill="#3498db"/><text x="130" y="31" fill="#fff" text-anchor="middle">E</text>
      <rect x="140" y="18" width="20" height="18" fill="#f39c12"/><text x="150" y="31" fill="#fff" text-anchor="middle">L</text>

      <rect x="0" y="36" width="20" height="18" fill="#2ecc71"/><text x="10" y="49" fill="#fff" text-anchor="middle">V</text>
      <rect x="20" y="36" width="20" height="18" fill="#3498db"/><text x="30" y="49" fill="#fff" text-anchor="middle">K</text>
      <rect x="40" y="36" width="20" height="18" fill="#e74c3c"/><text x="50" y="49" fill="#fff" text-anchor="middle">M</text>
      <rect x="60" y="36" width="20" height="18" fill="#9b59b6"/><text x="70" y="49" fill="#fff" text-anchor="middle">W</text>
      <rect x="80" y="36" width="20" height="18" fill="#2ecc71"/><text x="90" y="49" fill="#fff" text-anchor="middle">V</text>
      <rect x="100" y="36" width="20" height="18" fill="#e74c3c"/><text x="110" y="49" fill="#fff" text-anchor="middle">D</text>
      <rect x="120" y="36" width="20" height="18" fill="#3498db"/><text x="130" y="49" fill="#fff" text-anchor="middle">E</text>
      <rect x="140" y="36" width="20" height="18" fill="#2ecc71"/><text x="150" y="49" fill="#fff" text-anchor="middle">A</text>

      <rect x="0" y="54" width="20" height="18" fill="#9b59b6"/><text x="10" y="67" fill="#fff" text-anchor="middle">W</text>
      <rect x="20" y="54" width="20" height="18" fill="#f39c12"/><text x="30" y="67" fill="#fff" text-anchor="middle">L</text>
      <rect x="40" y="54" width="20" height="18" fill="#3498db"/><text x="50" y="67" fill="#fff" text-anchor="middle">E</text>
      <rect x="60" y="54" width="20" height="18" fill="#2ecc71"/><text x="70" y="67" fill="#fff" text-anchor="middle">A</text>
      <rect x="80" y="54" width="20" height="18" fill="#3498db"/><text x="90" y="67" fill="#fff" text-anchor="middle">K</text>
      <rect x="100" y="54" width="20" height="18" fill="#9b59b6"/><text x="110" y="67" fill="#fff" text-anchor="middle">W</text>
      <rect x="120" y="54" width="20" height="18" fill="#f39c12"/><text x="130" y="67" fill="#fff" text-anchor="middle">L</text>
      <rect x="140" y="54" width="20" height="18" fill="#e74c3c"/><text x="150" y="67" fill="#fff" text-anchor="middle">D</text>
    </g>
    <text x="80" y="100" fill="#666" font-size="10" text-anchor="middle" font-style="italic">同源序列 (Homologs)</text>
  </g>

  <line x1="180" y1="100" x2="220" y2="100" stroke="#888" stroke-width="2"/>
  <polygon points="217,97 217,103 224,100" fill="#888"/>

  <!-- Evoformer block -->
  <rect x="240" y="55" width="160" height="100" fill="#fde6cf" stroke="#e67e22" stroke-width="2" rx="6"/>
  <text x="320" y="78" fill="#444" font-size="13" font-weight="bold" text-anchor="middle">Evoformer</text>
  <text x="320" y="98" fill="#666" font-size="10" text-anchor="middle">(48 blocks)</text>
  <text x="320" y="115" fill="#666" font-size="10" text-anchor="middle">MSA 通讯 + Pair 通讯</text>
  <text x="320" y="132" fill="#666" font-size="10" text-anchor="middle">三角形不等式更新</text>
  <text x="320" y="147" fill="#666" font-size="10" text-anchor="middle">(triangle inequality updates)</text>

  <line x1="400" y1="100" x2="440" y2="100" stroke="#888" stroke-width="2"/>
  <polygon points="437,97 437,103 444,100" fill="#888"/>

  <!-- Structure Module -->
  <rect x="460" y="55" width="160" height="100" fill="#e0f0e0" stroke="#27ae60" stroke-width="2" rx="6"/>
  <text x="540" y="78" fill="#444" font-size="13" font-weight="bold" text-anchor="middle">Structure Module</text>
  <text x="540" y="98" fill="#666" font-size="10" text-anchor="middle">(8 blocks)</text>
  <text x="540" y="115" fill="#666" font-size="10" text-anchor="middle">IPA: 不变点注意力</text>
  <text x="540" y="132" fill="#666" font-size="10" text-anchor="middle">3D 框架更新</text>
  <text x="540" y="147" fill="#666" font-size="10" text-anchor="middle">(frame updates)</text>

  <line x1="620" y1="100" x2="660" y2="100" stroke="#888" stroke-width="2"/>
  <polygon points="657,97 657,103 664,100" fill="#888"/>

  <!-- Output 3D -->
  <rect x="680" y="55" width="100" height="100" fill="#cfe8f7" stroke="#3498db" stroke-width="2" rx="6"/>
  <text x="730" y="78" fill="#444" font-size="12" font-weight="bold" text-anchor="middle">3D 结构</text>
  <circle cx="700" cy="115" r="6" fill="#e74c3c"/>
  <circle cx="720" cy="105" r="6" fill="#3498db"/>
  <circle cx="745" cy="120" r="6" fill="#2ecc71"/>
  <circle cx="730" cy="140" r="6" fill="#f39c12"/>
  <line x1="700" y1="115" x2="720" y2="105" stroke="#444"/>
  <line x1="720" y1="105" x2="745" y2="120" stroke="#444"/>
  <line x1="745" y1="120" x2="730" y2="140" stroke="#444"/>
  <text x="730" y="160" fill="#666" font-size="10" text-anchor="middle">Cα 坐标</text>

  <!-- Bottom: recycling -->
  <text x="400" y="220" fill="#666" font-size="11" text-anchor="middle" font-style="italic">Recycling: 把上一次的输出当作下一次的输入, 迭代精炼 (3 次)</text>
  <path d="M 730 170 Q 730 200 400 200 Q 270 200 320 160"
        fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="318,156 318,164 326,160" fill="#888"/>

  <!-- Loss / pLDDT block -->
  <text x="400" y="260" fill="#444" font-size="12" font-weight="bold" text-anchor="middle">训练损失: Frame Aligned Point Error (FAPE)</text>
  <text x="400" y="278" fill="#666" font-size="10" text-anchor="middle">+ 辅助: distogram / 角度 / pLDDT</text>

  <!-- Inference block: MSA / Template retriever -->
  <rect x="20" y="310" width="180" height="60" fill="#f7e0e0" stroke="#c0392b" stroke-width="2" rx="6"/>
  <text x="110" y="332" fill="#444" font-size="11" font-weight="bold" text-anchor="middle">MSA Retriever</text>
  <text x="110" y="350" fill="#666" font-size="10" text-anchor="middle">JackHMMER / HHblits</text>
  <text x="110" y="365" fill="#666" font-size="10" text-anchor="middle">5 min / 蛋白</text>

  <rect x="220" y="310" width="180" height="60" fill="#f7e0e0" stroke="#c0392b" stroke-width="2" rx="6"/>
  <text x="310" y="332" fill="#444" font-size="11" font-weight="bold" text-anchor="middle">Template Retriever</text>
  <text x="310" y="350" fill="#666" font-size="10" text-anchor="middle">PDB 搜索同源模板</text>
  <text x="310" y="365" fill="#666" font-size="10" text-anchor="middle">3D 结构先验</text>

  <line x1="200" y1="340" x2="220" y2="340" stroke="#888" stroke-width="2"/>
  <line x1="110" y1="370" x2="500" y2="410" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="497,407 503,407 500,413" fill="#888"/>

  <!-- Bottom row: final inference stats -->
  <rect x="430" y="320" width="350" height="100" fill="#fef9e7" stroke="#f39c12" stroke-width="2" rx="6"/>
  <text x="605" y="340" fill="#444" font-size="12" font-weight="bold" text-anchor="middle">推理时 (Inference)</text>
  <text x="605" y="358" fill="#666" font-size="10" text-anchor="middle">单蛋白 ~数分钟 (单 GPU)</text>
  <text x="605" y="373" fill="#666" font-size="10" text-anchor="middle">AlphaFold DB: 2 亿结构 (2022)</text>
  <text x="605" y="388" fill="#666" font-size="10" text-anchor="middle">AlphaFold Server: 浏览器免费使用</text>
  <text x="605" y="403" fill="#666" font-size="10" text-anchor="middle">CASP14: GDT-TS 92.4 (中位)</text>
</svg>
