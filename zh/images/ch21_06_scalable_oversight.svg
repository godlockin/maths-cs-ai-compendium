<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="380" fill="#fafbfc"/>
<rect x="0" y="0" width="720" height="36" fill="#2563eb" rx="0"/>
<text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">Scalable Oversight 三条主线: Debate / RRM / IDA 的结构差异</text>

<!-- Three boxes -->
<!-- Debate -->
<rect x="30" y="60" width="210" height="280" rx="6" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb" stroke-width="1.5"/>
<text x="135" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">AI Safety Debate</text>
<text x="135" y="100" text-anchor="middle" font-size="9" fill="#475569">Irving 2018 · arXiv:1805.00899</text>

<!-- 2 debaters vs judge -->
<rect x="50" y="120" width="80" height="32" rx="4" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="1"/>
<text x="90" y="138" text-anchor="middle" font-size="10" fill="#7f1d1d">Debater A</text>
<rect x="140" y="120" width="80" height="32" rx="4" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="1"/>
<text x="180" y="138" text-anchor="middle" font-size="10" fill="#14532d">Debater B</text>
<text x="135" y="172" text-anchor="middle" font-size="9" fill="#475569">互辩同一问题</text>
<rect x="60" y="200" width="150" height="36" rx="4" fill="#64748b" fill-opacity="0.15" stroke="#64748b" stroke-width="1"/>
<text x="135" y="218" text-anchor="middle" font-size="10" fill="#334155">人类裁判 H</text>
<text x="135" y="232" text-anchor="middle" font-size="9" fill="#64748b">判 a/b 谁赢</text>

<text x="135" y="258" text-anchor="middle" font-size="9" fill="#475569">Nash 均衡训练</text>
<text x="135" y="272" text-anchor="middle" font-size="9" fill="#475569">关键假设: 真方有</text>
<text x="135" y="284" text-anchor="middle" font-size="9" fill="#475569">系统性论证优势</text>
<text x="135" y="308" text-anchor="middle" font-size="9" fill="#dc2626">问题: 开放伦理题</text>
<text x="135" y="320" text-anchor="middle" font-size="9" fill="#dc2626">易被强论证误导</text>

<!-- RRM -->
<rect x="255" y="60" width="210" height="280" rx="6" fill="#16a34a" fill-opacity="0.07" stroke="#16a34a" stroke-width="1.5"/>
<text x="360" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Recursive Reward Modeling</text>
<text x="360" y="100" text-anchor="middle" font-size="9" fill="#475569">Leike 2018 · arXiv:1811.07871</text>

<!-- recursive tower -->
<rect x="275" y="120" width="170" height="22" rx="3" fill="#16a34a" fill-opacity="0.20" stroke="#16a34a"/>
<text x="360" y="135" text-anchor="middle" font-size="10" fill="#14532d">R₂ AI 顶层 (长文摘要)</text>
<rect x="285" y="148" width="150" height="22" rx="3" fill="#16a34a" fill-opacity="0.30" stroke="#16a34a"/>
<text x="360" y="163" text-anchor="middle" font-size="10" fill="#14532d">R₁ 段落评估</text>
<rect x="295" y="176" width="130" height="22" rx="3" fill="#16a34a" stroke="#16a34a"/>
<text x="360" y="191" text-anchor="middle" font-size="10" fill="white" font-weight="700">R₀ 直接人类判断</text>

<text x="360" y="218" text-anchor="middle" font-size="9" fill="#475569">用弱 AI 辅助人监督</text>
<text x="360" y="230" text-anchor="middle" font-size="9" fill="#475569">更强 AI · 层层递归</text>

<text x="360" y="258" text-anchor="middle" font-size="9" fill="#475569">系数 λ 沿层递减</text>
<text x="360" y="270" text-anchor="middle" font-size="9" fill="#475569">r_H 权重 · r_A 增权</text>
<text x="360" y="288" text-anchor="middle" font-size="9" fill="#475569">核心: "评估比生成简单"</text>

<text x="360" y="312" text-anchor="middle" font-size="9" fill="#dc2626">问题: 每层需独立训</text>
<text x="360" y="324" text-anchor="middle" font-size="9" fill="#dc2626">OpenAI superalignment 主线</text>

<!-- IDA -->
<rect x="480" y="60" width="210" height="280" rx="6" fill="#9333ea" fill-opacity="0.07" stroke="#9333ea" stroke-width="1.5"/>
<text x="585" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#581c87">Iterated Amplification</text>
<text x="585" y="100" text-anchor="middle" font-size="9" fill="#475569">Christiano 2018 · arXiv:1810.08575</text>

<!-- IDA flow -->
<rect x="500" y="120" width="170" height="32" rx="4" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a"/>
<text x="585" y="140" text-anchor="middle" font-size="10" fill="#14532d">人 H 协调多个 AI 副本</text>
<line x1="585" y1="152" x2="585" y2="172" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-64748b)"/>
<rect x="500" y="174" width="170" height="32" rx="4" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb"/>
<text x="585" y="194" text-anchor="middle" font-size="10" fill="#1e3a8a">复合系统 Amplify(H, Aₖ)</text>
<line x1="585" y1="206" x2="585" y2="226" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-64748b)"/>
<rect x="500" y="228" width="170" height="32" rx="4" fill="#9333ea" fill-opacity="0.15" stroke="#9333ea"/>
<text x="585" y="248" text-anchor="middle" font-size="10" fill="#581c87">蒸馏回 Aₖ₊₁</text>

<text x="585" y="280" text-anchor="middle" font-size="9" fill="#475569">分解任务 → 子问题</text>
<text x="585" y="292" text-anchor="middle" font-size="9" fill="#475569">→ 多人答 → 蒸馏</text>

<text x="585" y="312" text-anchor="middle" font-size="9" fill="#dc2626">问题: 需可靠任务分解</text>
<text x="585" y="324" text-anchor="middle" font-size="9" fill="#dc2626">CAI 视作 IDA 特化</text>

<!-- Bottom common warning -->
<rect x="30" y="350" width="660" height="22" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text x="360" y="365" text-anchor="middle" font-size="10" fill="#7c2d12">共同天花板: 都假设 AI 不会联合欺骗人类 · 一旦串谋 (collusion) 监督失效</text>
</svg>
