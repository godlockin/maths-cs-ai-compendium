<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="280" fill="#fafbfc"/>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="white">智能体系统的落地形态全景</text>

  <!-- Three layers -->

  <!-- Top layer: 消费 / 办公 -->
  <rect x="30" y="55" width="660" height="60" rx="6" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="1.5"/>
  <text x="50" y="75" font-size="11" font-weight="700" fill="#1d4ed8">上层: 消费 / 办公</text>
  <rect x="50" y="83" width="142" height="24" rx="3" fill="white" stroke="#2563eb" stroke-width="1"/>
  <text x="121" y="99" text-anchor="middle" font-size="10" fill="#1d4ed8">GPTs</text>
  <rect x="200" y="83" width="142" height="24" rx="3" fill="white" stroke="#2563eb" stroke-width="1"/>
  <text x="271" y="99" text-anchor="middle" font-size="10" fill="#1d4ed8">Claude Desktop</text>
  <rect x="350" y="83" width="142" height="24" rx="3" fill="white" stroke="#2563eb" stroke-width="1"/>
  <text x="421" y="99" text-anchor="middle" font-size="10" fill="#1d4ed8">Apple Intelligence</text>
  <rect x="500" y="83" width="180" height="24" rx="3" fill="white" stroke="#2563eb" stroke-width="1"/>
  <text x="590" y="99" text-anchor="middle" font-size="10" fill="#1d4ed8">Computer Use (Anthropic)</text>

  <!-- Middle layer: 企业 SaaS -->
  <rect x="30" y="125" width="660" height="60" rx="6" fill="#16a34a" fill-opacity="0.06" stroke="#16a34a" stroke-width="1.5"/>
  <text x="50" y="145" font-size="11" font-weight="700" fill="#15803d">中层: 企业 SaaS</text>
  <rect x="50" y="153" width="142" height="24" rx="3" fill="white" stroke="#16a34a" stroke-width="1"/>
  <text x="121" y="169" text-anchor="middle" font-size="10" fill="#15803d">Agentforce</text>
  <rect x="200" y="153" width="142" height="24" rx="3" fill="white" stroke="#16a34a" stroke-width="1"/>
  <text x="271" y="169" text-anchor="middle" font-size="10" fill="#15803d">Microsoft 365 Copilot</text>
  <rect x="350" y="153" width="142" height="24" rx="3" fill="white" stroke="#16a34a" stroke-width="1"/>
  <text x="421" y="169" text-anchor="middle" font-size="10" fill="#15803d">通义 Agent</text>
  <rect x="500" y="153" width="180" height="24" rx="3" fill="white" stroke="#16a34a" stroke-width="1"/>
  <text x="590" y="169" text-anchor="middle" font-size="10" fill="#15803d">百度 AppBuilder</text>

  <!-- Bottom layer: 开源 / 协议 -->
  <rect x="30" y="195" width="660" height="60" rx="6" fill="#9333ea" fill-opacity="0.06" stroke="#9333ea" stroke-width="1.5"/>
  <text x="50" y="215" font-size="11" font-weight="700" fill="#7e22ce">底层: 开源 / 协议</text>
  <rect x="50" y="223" width="142" height="24" rx="3" fill="white" stroke="#9333ea" stroke-width="1"/>
  <text x="121" y="239" text-anchor="middle" font-size="10" fill="#7e22ce">MCP 协议</text>
  <rect x="200" y="223" width="142" height="24" rx="3" fill="white" stroke="#9333ea" stroke-width="1"/>
  <text x="271" y="239" text-anchor="middle" font-size="10" fill="#7e22ce">LangGraph</text>
  <rect x="350" y="223" width="142" height="24" rx="3" fill="white" stroke="#9333ea" stroke-width="1"/>
  <text x="421" y="239" text-anchor="middle" font-size="10" fill="#7e22ce">CrewAI</text>
  <rect x="500" y="223" width="180" height="24" rx="3" fill="white" stroke="#9333ea" stroke-width="1"/>
  <text x="590" y="239" text-anchor="middle" font-size="10" fill="#7e22ce">AutoGen / Dify</text>

  <!-- Bottom: protocol / observability -->
  <text x="360" y="270" text-anchor="middle" font-size="10" fill="#475569">统一协议 (MCP / Function Calling) + 可观测平台 (Langfuse / LangSmith) 互通三层</text>
</svg>
