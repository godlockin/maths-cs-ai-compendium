<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
</style>
<rect width="700" height="380" fill="#fafbfc"/>
<defs>
  <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
  <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
  <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
  <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
</defs>
<rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
<text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">凸集与非凸集示意</text>

<!-- Section: Convex -->
<text x="350" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">凸集: 任意两点连线段全部属于集合</text>

<!-- Ball -->
<g transform="translate(40,72)">
  <rect x="0" y="0" width="160" height="120" fill="#fff" stroke="#cbd5e1"/>
  <circle cx="80" cy="60" r="44" fill="#16a34a" fill-opacity="0.2" stroke="#16a34a" stroke-width="2"/>
  <line x1="50" y1="80" x2="110" y2="35" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="50" cy="80" r="3" fill="#16a34a"/>
  <circle cx="110" cy="35" r="3" fill="#16a34a"/>
  <text x="80" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">球 (ball)</text>
  <text x="80" y="155" text-anchor="middle" font-size="10" fill="#475569">‖x-x₀‖ ≤ r</text>
</g>

<!-- Polyhedron -->
<g transform="translate(220,72)">
  <rect x="0" y="0" width="160" height="120" fill="#fff" stroke="#cbd5e1"/>
  <polygon points="80,22 124,50 124,92 80,118 36,92 36,50" fill="#16a34a" fill-opacity="0.2" stroke="#16a34a" stroke-width="2"/>
  <line x1="55" y1="68" x2="105" y2="76" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="55" cy="68" r="3" fill="#16a34a"/>
  <circle cx="105" cy="76" r="3" fill="#16a34a"/>
  <text x="80" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">多面体</text>
  <text x="80" y="155" text-anchor="middle" font-size="10" fill="#475569">半空间之交, LP 可行域</text>
</g>

<!-- Simplex -->
<g transform="translate(400,72)">
  <rect x="0" y="0" width="160" height="120" fill="#fff" stroke="#cbd5e1"/>
  <polygon points="80,22 122,98 38,98" fill="#16a34a" fill-opacity="0.2" stroke="#16a34a" stroke-width="2"/>
  <line x1="58" y1="86" x2="105" y2="84" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="58" cy="86" r="3" fill="#16a34a"/>
  <circle cx="105" cy="84" r="3" fill="#16a34a"/>
  <text x="80" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">单纯形 (simplex)</text>
  <text x="80" y="155" text-anchor="middle" font-size="10" fill="#475569">概率分布 Δⁿ</text>
</g>

<!-- Halfspace -->
<g transform="translate(580,72)">
  <rect x="0" y="0" width="100" height="120" fill="#fff" stroke="#cbd5e1"/>
  <rect x="0" y="20" width="100" height="80" fill="#16a34a" fill-opacity="0.2"/>
  <line x1="0" y1="20" x2="100" y2="20" stroke="#16a34a" stroke-width="2"/>
  <text x="50" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">半空间</text>
  <text x="50" y="76" text-anchor="middle" font-size="9" fill="#475569">aᵀx ≤ b</text>
  <text x="50" y="142" text-anchor="middle" font-size="10" fill="#475569">LP 的</text>
  <text x="50" y="155" text-anchor="middle" font-size="10" fill="#475569">基本砖</text>
</g>

<!-- Section: Non-convex -->
<text x="350" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">非凸集: 存在连线出格</text>

<!-- Annulus -->
<g transform="translate(40,248)">
  <rect x="0" y="0" width="160" height="120" fill="#fff" stroke="#cbd5e1"/>
  <circle cx="80" cy="60" r="50" fill="#dc2626" fill-opacity="0.18" stroke="#dc2626" stroke-width="2"/>
  <circle cx="80" cy="60" r="25" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <line x1="42" y1="32" x2="118" y2="88" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="42" cy="32" r="3" fill="#dc2626"/>
  <circle cx="118" cy="88" r="3" fill="#dc2626"/>
  <text x="80" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">环 (annulus)</text>
  <text x="80" y="155" text-anchor="middle" font-size="10" fill="#475569">直径连线穿中心空洞</text>
</g>

<!-- Two disjoint disks -->
<g transform="translate(220,248)">
  <rect x="0" y="0" width="160" height="120" fill="#fff" stroke="#cbd5e1"/>
  <circle cx="50" cy="60" r="22" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="110" cy="60" r="22" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="2"/>
  <line x1="68" y1="55" x2="92" y2="55" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="68" cy="55" r="3" fill="#dc2626"/>
  <circle cx="92" cy="55" r="3" fill="#dc2626"/>
  <text x="80" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">两圆盘之并</text>
  <text x="80" y="155" text-anchor="middle" font-size="10" fill="#475569">圆盘间连线经过空白</text>
</g>

<!-- Integer grid -->
<g transform="translate(400,248)">
  <rect x="0" y="0" width="160" height="120" fill="#fff" stroke="#cbd5e1"/>
  <!-- axes -->
  <line x1="10" y1="100" x2="150" y2="100" stroke="#64748b" stroke-width="0.8"/>
  <line x1="80" y1="20" x2="80" y2="110" stroke="#64748b" stroke-width="0.8"/>
  <!-- integer points -->
  <g fill="#dc2626">
    <circle cx="40" cy="80" r="3"/><circle cx="60" cy="80" r="3"/>
    <circle cx="80" cy="80" r="3"/><circle cx="100" cy="80" r="3"/><circle cx="120" cy="80" r="3"/>
    <circle cx="40" cy="60" r="3"/><circle cx="60" cy="60" r="3"/>
    <circle cx="80" cy="60" r="3"/><circle cx="100" cy="60" r="3"/><circle cx="120" cy="60" r="3"/>
    <circle cx="40" cy="40" r="3"/><circle cx="60" cy="40" r="3"/>
    <circle cx="80" cy="40" r="3"/><circle cx="100" cy="40" r="3"/><circle cx="120" cy="40" r="3"/>
  </g>
  <line x1="40" y1="80" x2="60" cy="40" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="50" cy="60" r="3" fill="#dc2626" fill-opacity="0.4" stroke="#dc2626" stroke-dasharray="2,2"/>
  <text x="80" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">整数格 ℤ²</text>
  <text x="80" y="155" text-anchor="middle" font-size="10" fill="#475569">中点 (0.5,0.5) ∉ ℤ²</text>
</g>

<!-- Non-convex loss -->
<g transform="translate(580,248)">
  <rect x="0" y="0" width="100" height="120" fill="#fff" stroke="#cbd5e1"/>
  <path d="M 0 80 Q 25 30 50 80 Q 75 130 100 80" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="50" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">双峰函数</text>
  <text x="50" y="76" text-anchor="middle" font-size="9" fill="#475569">次水平集非凸</text>
  <text x="50" y="142" text-anchor="middle" font-size="10" fill="#475569">次水平集</text>
  <text x="50" y="155" text-anchor="middle" font-size="10" fill="#475569">→ 非凸集</text>
</g>
</svg>
