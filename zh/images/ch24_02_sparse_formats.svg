<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
</style>
<rect width="700" height="380" fill="#fafbfc"/>
<defs>
  <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
  <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
  <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
  <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
</defs>
<rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
<text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">CSR / CSC / BSR 稀疏存储格式位布局</text>

<!-- Sample sparse matrix 4x4 -->
<g transform="translate(40,60)">
  <text x="0" y="0" font-size="12" font-weight="700" fill="#1e293b">示例稀疏矩阵 A (4×4, nnz=6):</text>
  <g transform="translate(0,12)" font-family="monospace" font-size="11" fill="#0f172a">
    <rect x="0" y="0" width="180" height="120" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="14" y="22">[  10    0    0   20 ]</text>
    <text x="14" y="42">[   0   30    0    0 ]</text>
    <text x="14" y="62">[   0    0   40    0 ]</text>
    <text x="14" y="82">[  50   60    0   70 ]</text>
    <text x="14" y="100" font-size="9" fill="#dc2626">▓ 非零元素位置: (0,0),(0,3),(1,1),(2,2),(3,0),(3,1),(3,3)</text>
  </g>
</g>

<!-- CSR -->
<g transform="translate(260,60)">
  <text x="0" y="0" font-size="12" font-weight="700" fill="#2563eb">CSR (Compressed Sparse Row)</text>
  <text x="0" y="14" font-size="9" fill="#64748b">按行存储: values + col_index + row_ptr</text>
  <g transform="translate(0,22)" font-family="monospace" font-size="10">
    <text x="0" y="10" fill="#475569">values:</text>
    <g>
      <rect x="60" y="0" width="28" height="18" fill="#2563eb" rx="2"/><text x="74" y="13" text-anchor="middle" fill="white">10</text>
      <rect x="90" y="0" width="28" height="18" fill="#2563eb" rx="2"/><text x="104" y="13" text-anchor="middle" fill="white">20</text>
      <rect x="120" y="0" width="28" height="18" fill="#2563eb" rx="2"/><text x="134" y="13" text-anchor="middle" fill="white">30</text>
      <rect x="150" y="0" width="28" height="18" fill="#2563eb" rx="2"/><text x="164" y="13" text-anchor="middle" fill="white">40</text>
      <rect x="180" y="0" width="28" height="18" fill="#2563eb" rx="2"/><text x="194" y="13" text-anchor="middle" fill="white">50</text>
      <rect x="210" y="0" width="28" height="18" fill="#2563eb" rx="2"/><text x="224" y="13" text-anchor="middle" fill="white">60</text>
      <rect x="240" y="0" width="28" height="18" fill="#2563eb" rx="2"/><text x="254" y="13" text-anchor="middle" fill="white">70</text>
    </g>
    <text x="0" y="36" fill="#475569">col_idx:</text>
    <g>
      <rect x="60" y="26" width="28" height="18" fill="#16a34a" rx="2"/><text x="74" y="39" text-anchor="middle" fill="white">0</text>
      <rect x="90" y="26" width="28" height="18" fill="#16a34a" rx="2"/><text x="104" y="39" text-anchor="middle" fill="white">3</text>
      <rect x="120" y="26" width="28" height="18" fill="#16a34a" rx="2"/><text x="134" y="39" text-anchor="middle" fill="white">1</text>
      <rect x="150" y="26" width="28" height="18" fill="#16a34a" rx="2"/><text x="164" y="39" text-anchor="middle" fill="white">2</text>
      <rect x="180" y="26" width="28" height="18" fill="#16a34a" rx="2"/><text x="194" y="39" text-anchor="middle" fill="white">0</text>
      <rect x="210" y="26" width="28" height="18" fill="#16a34a" rx="2"/><text x="224" y="39" text-anchor="middle" fill="white">1</text>
      <rect x="240" y="26" width="28" height="18" fill="#16a34a" rx="2"/><text x="254" y="39" text-anchor="middle" fill="white">3</text>
    </g>
    <text x="0" y="62" fill="#475569">row_ptr:</text>
    <g>
      <rect x="60" y="52" width="28" height="18" fill="#d97706" rx="2"/><text x="74" y="65" text-anchor="middle" fill="white">0</text>
      <rect x="90" y="52" width="28" height="18" fill="#d97706" rx="2"/><text x="104" y="65" text-anchor="middle" fill="white">2</text>
      <rect x="120" y="52" width="28" height="18" fill="#d97706" rx="2"/><text x="134" y="65" text-anchor="middle" fill="white">3</text>
      <rect x="150" y="52" width="28" height="18" fill="#d97706" rx="2"/><text x="164" y="65" text-anchor="middle" fill="white">4</text>
      <rect x="180" y="52" width="28" height="18" fill="#d97706" rx="2"/><text x="194" y="65" text-anchor="middle" fill="white">7</text>
    </g>
    <text x="60" y="92" font-size="9" fill="#64748b">▓ 行 i 的非零值范围: [row_ptr[i], row_ptr[i+1])</text>
    <text x="60" y="108" font-size="9" fill="#64748b">▓ 适合 SpMV (行访问)</text>
  </g>
</g>

<!-- CSC -->
<g transform="translate(260,200)">
  <text x="0" y="0" font-size="12" font-weight="700" fill="#9333ea">CSC (Compressed Sparse Column)</text>
  <text x="0" y="14" font-size="9" fill="#64748b">按列存储: values + row_index + col_ptr (CSR 的转置视角)</text>
  <g transform="translate(0,22)" font-family="monospace" font-size="10">
    <text x="0" y="10" fill="#475569">values:</text>
    <g>
      <rect x="60" y="0" width="28" height="18" fill="#2563eb" rx="2"/><text x="74" y="13" text-anchor="middle" fill="white">10</text>
      <rect x="90" y="0" width="28" height="18" fill="#2563eb" rx="2"/><text x="104" y="13" text-anchor="middle" fill="white">50</text>
      <rect x="120" y="0" width="28" height="18" fill="#2563eb" rx="2"/><text x="134" y="13" text-anchor="middle" fill="white">30</text>
      <rect x="150" y="0" width="28" height="18" fill="#2563eb" rx="2"/><text x="164" y="13" text-anchor="middle" fill="white">60</text>
      <rect x="180" y="0" width="28" height="18" fill="#2563eb" rx="2"/><text x="194" y="13" text-anchor="middle" fill="white">40</text>
      <rect x="210" y="0" width="28" height="18" fill="#2563eb" rx="2"/><text x="224" y="13" text-anchor="middle" fill="white">20</text>
      <rect x="240" y="0" width="28" height="18" fill="#2563eb" rx="2"/><text x="254" y="13" text-anchor="middle" fill="white">70</text>
    </g>
    <text x="0" y="36" fill="#475569">row_idx:</text>
    <g>
      <rect x="60" y="26" width="28" height="18" fill="#9333ea" rx="2"/><text x="74" y="39" text-anchor="middle" fill="white">0</text>
      <rect x="90" y="26" width="28" height="18" fill="#9333ea" rx="2"/><text x="104" y="39" text-anchor="middle" fill="white">3</text>
      <rect x="120" y="26" width="28" height="18" fill="#9333ea" rx="2"/><text x="134" y="39" text-anchor="middle" fill="white">1</text>
      <rect x="150" y="26" width="28" height="18" fill="#9333ea" rx="2"/><text x="164" y="39" text-anchor="middle" fill="white">3</text>
      <rect x="180" y="26" width="28" height="18" fill="#9333ea" rx="2"/><text x="194" y="39" text-anchor="middle" fill="white">2</text>
      <rect x="210" y="26" width="28" height="18" fill="#9333ea" rx="2"/><text x="224" y="39" text-anchor="middle" fill="white">0</text>
      <rect x="240" y="26" width="28" height="18" fill="#9333ea" rx="2"/><text x="254" y="39" text-anchor="middle" fill="white">3</text>
    </g>
    <text x="0" y="62" fill="#475569">col_ptr:</text>
    <g>
      <rect x="60" y="52" width="28" height="18" fill="#d97706" rx="2"/><text x="74" y="65" text-anchor="middle" fill="white">0</text>
      <rect x="90" y="52" width="28" height="18" fill="#d97706" rx="2"/><text x="104" y="65" text-anchor="middle" fill="white">2</text>
      <rect x="120" y="52" width="28" height="18" fill="#d97706" rx="2"/><text x="134" y="65" text-anchor="middle" fill="white">4</text>
      <rect x="150" y="52" width="28" height="18" fill="#d97706" rx="2"/><text x="164" y="65" text-anchor="middle" fill="white">5</text>
      <rect x="180" y="52" width="28" height="18" fill="#d97706" rx="2"/><text x="194" y="65" text-anchor="middle" fill="white">7</text>
    </g>
    <text x="60" y="92" font-size="9" fill="#64748b">▓ 列 j 的非零值范围: [col_ptr[j], col_ptr[j+1])</text>
    <text x="60" y="108" font-size="9" fill="#64748b">▓ 适合列访问 / LDLᵀ分解</text>
  </g>
</g>

<!-- BSR -->
<g transform="translate(40,310)">
  <text x="0" y="0" font-size="12" font-weight="700" fill="#dc2626">BSR (Block Sparse Row):</text>
  <text x="80" y="0" font-size="11" fill="#475569">把矩阵切成 r×c 块, 整块存, 适合结构化稀疏 (如 2:4 GPU Tensor Core)</text>
  <g transform="translate(0,12)" font-family="monospace" font-size="10">
    <rect x="0" y="0" width="640" height="50" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="14" y="22">A (4×4) → 4 个 2×2 块: A = [[B₀₀, B₀₁], [B₁₀, B₁₁]]</text>
    <text x="14" y="40" fill="#dc2626">▓ values = [B₀₀, B₀₁, B₁₁] (丢掉零块), col_idx = [0,1,1], row_ptr = [0,1,2,2,3]</text>
  </g>
</g>
</svg>
