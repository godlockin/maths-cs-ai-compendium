<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="360" fill="#fafbfc"/>
<rect x="0" y="0" width="720" height="36" fill="#2563eb" rx="0"/>
<text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">IOI 电路: 26 个注意力头分 7 类分工协作从 token embed 到预测 Mary</text>

<!-- Flow: token embed → 7 head types → Mary -->
<g transform="translate(40,60)">
  <rect x="0" y="120" width="90" height="40" rx="4" fill="#64748b" fill-opacity="0.15" stroke="#64748b" stroke-width="1"/>
  <text x="45" y="138" text-anchor="middle" font-size="10" fill="#334155">Token Embed</text>
  <text x="45" y="152" text-anchor="middle" font-size="9" fill="#475569">"Mary ... John"</text>
</g>

<line x1="130" y1="160" x2="170" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>

<!-- Duplicate token heads -->
<g transform="translate(170,80)">
  <rect x="0" y="0" width="100" height="34" rx="4" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="1.2"/>
  <text x="50" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">Duplicate</text>
  <text x="50" y="29" text-anchor="middle" font-size="9" fill="#47532d">L0-3 · 定位 John</text>
</g>

<line x1="220" y1="97" x2="260" y2="97" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-64748b)"/>

<!-- Prev token heads -->
<g transform="translate(260,60)">
  <rect x="0" y="0" width="100" height="34" rx="4" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.2"/>
  <text x="50" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#0e7490">Previous Token</text>
  <text x="50" y="29" text-anchor="middle" font-size="9" fill="#0e7490">L0-3 · 位置位移</text>
</g>

<line x1="270" y1="160" x2="310" y2="160" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-64748b)"/>

<!-- S-Inhibition -->
<g transform="translate(310,135)">
  <rect x="0" y="0" width="110" height="36" rx="4" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-width="1.2"/>
  <text x="55" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#7c2d12">S-Inhibition</text>
  <text x="55" y="30" text-anchor="middle" font-size="9" fill="#7c2d12">L7-8 · 抑制 John</text>
</g>

<line x1="420" y1="153" x2="460" y2="153" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-64748b)"/>

<!-- Name mover -->
<g transform="translate(460,135)">
  <rect x="0" y="0" width="100" height="36" rx="4" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="1.2"/>
  <text x="50" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">Name Mover</text>
  <text x="50" y="30" text-anchor="middle" font-size="9" fill="#1e3a8a">L9-10 · 复制 Mary</text>
</g>

<line x1="560" y1="153" x2="600" y2="153" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-64748b)"/>

<!-- Final output -->
<g transform="translate(600,135)">
  <rect x="0" y="0" width="80" height="36" rx="4" fill="#16a34a" stroke="#16a34a" stroke-width="1.5"/>
  <text x="40" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">→ Mary</text>
</g>

<!-- Backup + Negative -->
<g transform="translate(310,200)">
  <rect x="0" y="0" width="250" height="34" rx="4" fill="#9333ea" fill-opacity="0.10" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="125" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#581c87">Backup Name Mover · Negative Name Mover (L10-11)</text>
  <text x="125" y="29" text-anchor="middle" font-size="9" fill="#581c87">冗余 + 抑制错误名字</text>
</g>

<line x1="435" y1="200" x2="510" y2="171" stroke="#9333ea" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a-9333ea)"/>

<!-- Layer axis at bottom -->
<g transform="translate(60,260)">
  <text x="0" y="0" font-size="10" font-weight="600" fill="#475569">层分布 (12 层 GPT-2 small)</text>
  <line x1="0" y1="14" x2="600" y2="14" stroke="#94a3b8" stroke-width="1"/>
  <g font-size="9" fill="#64748b" text-anchor="middle">
    <text x="50" y="30">L0</text>
    <text x="100" y="30">L1</text>
    <text x="150" y="30">L2</text>
    <text x="200" y="30">L3</text>
    <text x="250" y="30">L4</text>
    <text x="300" y="30">L5</text>
    <text x="350" y="30">L6</text>
    <text x="400" y="30">L7</text>
    <text x="450" y="30">L8</text>
    <text x="500" y="30">L9</text>
    <text x="550" y="30">L10</text>
    <text x="595" y="30">L11</text>
  </g>
  <!-- layer color bars -->
  <rect x="0" y="38" width="200" height="6" fill="#16a34a" fill-opacity="0.6"/>
  <rect x="350" y="38" width="100" height="6" fill="#d97706" fill-opacity="0.7"/>
  <rect x="450" y="38" width="150" height="6" fill="#2563eb" fill-opacity="0.7"/>
  <rect x="500" y="38" width="95" height="6" fill="#9333ea" fill-opacity="0.6"/>
  <text x="100" y="58" text-anchor="middle" font-size="9" fill="#14532d">duplicate + prev</text>
  <text x="400" y="58" text-anchor="middle" font-size="9" fill="#7c2d12">S-inhibition</text>
  <text x="525" y="58" text-anchor="middle" font-size="9" fill="#1e3a8a">name mover</text>
  <text x="548" y="58" text-anchor="middle" font-size="9" fill="#581c87">backup</text>
</g>

<!-- Info box -->
<rect x="40" y="325" width="640" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
<text x="360" y="343" text-anchor="middle" font-size="10" fill="#475569">26 个注意力头 + ablation 验证: 保留这 26 头 → IOI 准确率 87% / 全部 ablate → 接近随机</text>
</svg>
