<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="700" height="420" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">五维能力雷达: Coding / ML / SD / Research / Behavior (0-10 分)</text>

  <!-- Pentagon grid (5 levels) -->
  <g transform="translate(350,235)">
    <!-- Outer pentagon (level 10) -->
    <polygon points="0,-160 152,-49 94,129 -94,129 -152,-49" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <polygon points="0,-128 122,-39 75,103 -75,103 -122,-39" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <polygon points="0,-96 91,-30 56,77 -56,77 -91,-30" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <polygon points="0,-64 61,-20 38,52 -38,52 -61,-20" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <polygon points="0,-32 30,-10 19,26 -19,26 -30,-10" fill="none" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Axis lines -->
    <line x1="0" y1="0" x2="0" y2="-160" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="152" y2="-49" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="94" y2="129" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="-94" y2="129" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="-152" y2="-49" stroke="#cbd5e1" stroke-width="0.8"/>

    <!-- Level labels -->
    <text x="3" y="-156" font-size="9" fill="#94a3b8">10</text>
    <text x="3" y="-124" font-size="9" fill="#94a3b8">8</text>
    <text x="3" y="-92" font-size="9" fill="#94a3b8">6</text>
    <text x="3" y="-60" font-size="9" fill="#94a3b8">4</text>
    <text x="3" y="-28" font-size="9" fill="#94a3b8">2</text>

    <!-- 5 axis labels around -->
    <text x="0" y="-172" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">Coding 算法</text>
    <text x="160" y="-46" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">ML 基础</text>
    <text x="100" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#d97706">System Design</text>
    <text x="-100" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#9333ea">Behavior</text>
    <text x="-160" y="-46" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">Research 前沿</text>

    <!-- Three sample candidates -->
    <!-- MLE: Coding 8 / ML 6 / SD 8 / Behavior 5 / Research 4 -->
    <polygon points="0,-128 91,-30 75,103 -47,65 -61,-20"
             fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="2"/>
    <circle cx="0" cy="-128" r="3" fill="#2563eb"/>
    <circle cx="91" cy="-30" r="3" fill="#2563eb"/>
    <circle cx="75" cy="103" r="3" fill="#2563eb"/>
    <circle cx="-47" cy="65" r="3" fill="#2563eb"/>
    <circle cx="-61" cy="-20" r="3" fill="#2563eb"/>
    <text x="55" y="-110" font-size="10" fill="#2563eb" font-weight="600">MLE</text>

    <!-- DS: ML 8 / Behavior 8 / Coding 5 / SD 4 / Research 4 -->
    <polygon points="0,-80 122,-39 38,52 -47,65 -61,-20"
             fill="#16a34a" fill-opacity="0.14" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3"/>
    <circle cx="0" cy="-80" r="3" fill="#16a34a"/>
    <circle cx="122" cy="-39" r="3" fill="#16a34a"/>
    <circle cx="38" cy="52" r="3" fill="#16a34a"/>
    <circle cx="-47" cy="65" r="3" fill="#16a34a"/>
    <circle cx="-61" cy="-20" r="3" fill="#16a34a"/>
    <text x="42" y="-78" font-size="10" fill="#16a34a" font-weight="600">DS</text>

    <!-- Research: Research 9 / ML 8 / Coding 5 / Behavior 5 / SD 3 -->
    <polygon points="0,-80 122,-39 28,39 -47,65 -137,-44"
             fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="2" stroke-dasharray="2,3"/>
    <circle cx="0" cy="-80" r="3" fill="#dc2626"/>
    <circle cx="122" cy="-39" r="3" fill="#dc2626"/>
    <circle cx="28" cy="39" r="3" fill="#dc2626"/>
    <circle cx="-47" cy="65" r="3" fill="#dc2626"/>
    <circle cx="-137" cy="-44" r="3" fill="#dc2626"/>
    <text x="-30" y="20" font-size="10" fill="#dc2626" font-weight="600">Research</text>
  </g>

  <!-- Legend & insight -->
  <rect x="20" y="395" width="660" height="18" fill="#f1f5f9" rx="3"/>
  <circle cx="32" cy="404" r="4" fill="#2563eb"/>
  <text x="42" y="408" font-size="10" fill="#334155">MLE (工程偏)</text>
  <circle cx="150" cy="404" r="4" fill="#16a34a"/>
  <text x="160" y="408" font-size="10" fill="#334155">DS (统计偏)</text>
  <circle cx="280" cy="404" r="4" fill="#dc2626"/>
  <text x="290" y="408" font-size="10" fill="#334155">Research (论文偏)</text>
  <text x="410" y="408" font-size="10" fill="#64748b">短板 &lt; 4 分拖垮整体面积, 3 个月补 1-2 个短板</text>

  <!-- Caption -->
  <text x="350" y="62" text-anchor="middle" font-size="11" fill="#64748b">DS: ML 8 / Behavior 8 / Coding 5 / SD 4 / Research 4 —  MLE: Coding 8 / SD 8 / ML 6 / Behavior 5 / Research 4 —  Research: 9 / 8 / 5 / 5 / 3</text>
</svg>