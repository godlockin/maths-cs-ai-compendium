<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="700" height="280" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">反欺诈三道题与极不平衡数据处理 (欺诈率 0.1% - 5%)</text>

  <!-- Top: 3 fraud scenarios -->
  <!-- ① Payment fraud -->
  <rect x="30" y="60" width="200" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="130" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">① 支付反欺诈</text>
  <text x="130" y="100" text-anchor="middle" font-size="10" fill="#475569">信用卡刷卡 100ms 内判定</text>
  <text x="130" y="116" text-anchor="middle" font-size="10" fill="#475569">欺诈率 ≈ 0.1% (极不平衡)</text>
  <text x="130" y="132" text-anchor="middle" font-size="9" fill="#64748b">支付宝 / 微信支付 / 京东金融</text>

  <!-- ② Network anomaly -->
  <rect x="250" y="60" width="200" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="350" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">② 网络异常</text>
  <text x="350" y="100" text-anchor="middle" font-size="10" fill="#475569">入侵检测 / DDoS</text>
  <text x="350" y="116" text-anchor="middle" font-size="10" fill="#475569">攻击占比 ≈ 0.01%</text>
  <text x="350" y="132" text-anchor="middle" font-size="9" fill="#64748b">字节安全 / 阿里云 / 360</text>

  <!-- ③ Spam -->
  <rect x="470" y="60" width="200" height="80" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.8"/>
  <text x="570" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#db2777">③ Spam 分类</text>
  <text x="570" y="100" text-anchor="middle" font-size="10" fill="#475569">Email / SMS / 评论</text>
  <text x="570" y="116" text-anchor="middle" font-size="10" fill="#475569">Spam 率 ≈ 5%</text>
  <text x="570" y="132" text-anchor="middle" font-size="9" fill="#64748b">微信反诈 / 抖音评论 / 小红书</text>

  <!-- Down arrows -->
  <line x1="130" y1="140" x2="130" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>
  <line x1="350" y1="140" x2="350" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>
  <line x1="570" y1="140" x2="570" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>

  <!-- Bottom: imbalanced data handling techniques -->
  <rect x="30" y="160" width="640" height="105" rx="8" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.8"/>
  <text x="350" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">极不平衡数据 4 大处理技术</text>

  <!-- Four techniques -->
  <rect x="50" y="195" width="140" height="55" rx="4" fill="white" stroke="#2563eb" stroke-width="1.2"/>
  <text x="120" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">Class Weight</text>
  <text x="120" y="228" text-anchor="middle" font-size="9" fill="#475569">正样本权重 ∝ 1/freq</text>
  <text x="120" y="242" text-anchor="middle" font-size="9" fill="#475569">loss × w_pos</text>

  <rect x="200" y="195" width="140" height="55" rx="4" fill="white" stroke="#16a34a" stroke-width="1.2"/>
  <text x="270" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">Focal Loss</text>
  <text x="270" y="228" text-anchor="middle" font-size="9" fill="#475569">难样本聚焦</text>
  <text x="270" y="242" text-anchor="middle" font-size="9" fill="#475569">-(1-p)^γ · log(p)</text>

  <rect x="350" y="195" width="140" height="55" rx="4" fill="white" stroke="#d97706" stroke-width="1.2"/>
  <text x="420" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#d97706">下采样 + SMOTE</text>
  <text x="420" y="228" text-anchor="middle" font-size="9" fill="#475569">负样本下采样</text>
  <text x="420" y="242" text-anchor="middle" font-size="9" fill="#475569">少数类过采样合成</text>

  <rect x="500" y="195" width="155" height="55" rx="4" fill="white" stroke="#9333ea" stroke-width="1.2"/>
  <text x="577" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#9333ea">指标: PR-AUC + KS</text>
  <text x="577" y="228" text-anchor="middle" font-size="9" fill="#475569">不用 ROC-AUC (虚高)</text>
  <text x="577" y="242" text-anchor="middle" font-size="9" fill="#475569">KS ≥ 0.4 可用</text>
</svg>