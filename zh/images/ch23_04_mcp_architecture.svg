<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style> text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; } </style>
<rect width="720" height="380" fill="#fafbfc"/>

<!-- 顶部 Banner -->
<rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
<text x="360" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="white">MCP 架构: Host / Client / Server 三层</text>

<!-- Host 容器 -->
<rect x="40" y="60" width="640" height="180" rx="10" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 3"/>
<text x="60" y="82" font-size="12" font-weight="700" fill="#2563eb">Host (LLM 应用)</text>
<text x="170" y="82" font-size="10" fill="#475569">Claude Desktop · Cursor · VSCode Ext · Claude Code · Cline</text>

<!-- LLM 圆 -->
<g>
  <ellipse cx="200" cy="170" rx="55" ry="38" fill="#9333ea" fill-opacity="0.18" stroke="#9333ea" stroke-width="2"/>
  <text x="200" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#9333ea">LLM</text>
  <text x="200" y="182" text-anchor="middle" font-size="10" fill="#475569">Claude/GPT/...</text>
</g>

<!-- 三个 Client -->
<g font-size="10" font-weight="600">
  <rect x="290" y="100" width="100" height="44" rx="6" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.5"/>
  <text x="340" y="118" text-anchor="middle" fill="#0891b2">MCP Client</text>
  <text x="340" y="133" text-anchor="middle" font-size="9" fill="#475569">JSON-RPC</text>

  <rect x="290" y="150" width="100" height="44" rx="6" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.5"/>
  <text x="340" y="168" text-anchor="middle" fill="#0891b2">MCP Client</text>
  <text x="340" y="183" text-anchor="middle" font-size="9" fill="#475569">JSON-RPC</text>

  <rect x="290" y="200" width="100" height="44" rx="6" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.5"/>
  <text x="340" y="218" text-anchor="middle" fill="#0891b2">MCP Client</text>
  <text x="340" y="233" text-anchor="middle" font-size="9" fill="#475569">JSON-RPC</text>
</g>

<!-- LLM → Clients -->
<line x1="256" y1="155" x2="290" y2="120" stroke="#9333ea" stroke-width="1.5"/>
<line x1="256" y1="172" x2="290" y2="172" stroke="#9333ea" stroke-width="1.5"/>
<line x1="256" y1="190" x2="290" y2="222" stroke="#9333ea" stroke-width="1.5"/>

<!-- 三个 Server (Host 外) -->
<g font-size="10" font-weight="600">
  <rect x="500" y="80" width="160" height="44" rx="6" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="98" text-anchor="middle" fill="#16a34a">filesystem server</text>
  <text x="580" y="113" text-anchor="middle" font-size="9" fill="#475569">stdio transport</text>

  <rect x="500" y="148" width="160" height="44" rx="6" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.5"/>
  <text x="580" y="166" text-anchor="middle" fill="#d97706">github server</text>
  <text x="580" y="181" text-anchor="middle" font-size="9" fill="#475569">Streamable HTTP</text>

  <rect x="500" y="216" width="160" height="44" rx="6" fill="#db2777" fill-opacity="0.12" stroke="#db2777" stroke-width="1.5"/>
  <text x="580" y="234" text-anchor="middle" fill="#db2777">postgres server</text>
  <text x="580" y="249" text-anchor="middle" font-size="9" fill="#475569">Streamable HTTP</text>
</g>

<!-- Clients ↔ Servers 1:1 -->
<line x1="390" y1="120" x2="500" y2="100" stroke="#0891b2" stroke-width="1.5"/>
<line x1="390" y1="172" x2="500" y2="170" stroke="#0891b2" stroke-width="1.5"/>
<line x1="390" y1="222" x2="500" y2="238" stroke="#0891b2" stroke-width="1.5"/>

<!-- 协议握手标签 -->
<text x="445" y="92" text-anchor="middle" font-size="9" fill="#64748b">init/list/call</text>
<text x="445" y="160" text-anchor="middle" font-size="9" fill="#64748b">init/list/call</text>
<text x="445" y="232" text-anchor="middle" font-size="9" fill="#64748b">init/list/call</text>

<!-- 底部说明 -->
<rect x="40" y="260" width="640" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="60" y="284" font-size="12" font-weight="700" fill="#0f172a">关键约定</text>
<text x="60" y="304" font-size="11" fill="#334155">· Host 内嵌 N 个 Client, 每个 Client 1:1 连一个 Server · 进程间通信用 JSON-RPC 2.0</text>
<text x="60" y="322" font-size="11" fill="#334155">· 传输层可选 stdio (本地) 或 Streamable HTTP (远程) · Server 不知道背后 LLM 是哪家</text>
<text x="60" y="342" font-size="11" font-weight="700" fill="#16a34a">解耦: 工具方一次实现 server, 所有 MCP 客户端立即可用 (N+M 替代 N×M)</text>
</svg>
