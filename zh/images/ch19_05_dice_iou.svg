<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="280" fill="#fafbfc"/>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="white">医学影像分割: Dice 系数 与 IoU</text>

  <!-- Left: Venn diagram of P, G -->
  <rect x="30" y="55" width="280" height="200" rx="6" fill="white" stroke="#64748b" stroke-width="1"/>
  <text x="170" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">预测 P 与 真值 G 集合</text>

  <!-- Two circles overlapping -->
  <circle cx="135" cy="160" r="60" fill="#2563eb" fill-opacity="0.25" stroke="#2563eb" stroke-width="2"/>
  <circle cx="205" cy="160" r="60" fill="#dc2626" fill-opacity="0.25" stroke="#dc2626" stroke-width="2"/>

  <!-- Intersection label -->
  <ellipse cx="170" cy="160" rx="22" ry="32" fill="#16a34a" fill-opacity="0.40"/>

  <text x="115" y="200" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">P</text>
  <text x="225" y="200" text-anchor="middle" font-size="10" font-weight="600" fill="#7f1d1d">G</text>
  <text x="170" y="148" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">P∩G</text>
  <text x="170" y="161" text-anchor="middle" font-size="9" fill="#15803d">2 倍</text>

  <text x="170" y="240" text-anchor="middle" font-size="10" fill="#64748b">蓝 = 仅预测; 红 = 仅真值; 绿 = 交集</text>

  <!-- Middle: Dice formula -->
  <rect x="330" y="55" width="360" height="100" rx="6" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="1.5"/>
  <text x="510" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Dice 相似系数</text>
  <text x="510" y="115" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" font-family="Cambria, 'Times New Roman', serif">Dice(P,G) = 2·|P∩G| / (|P| + |G|)</text>
  <text x="510" y="138" text-anchor="middle" font-size="10" fill="#64748b">值域 [0,1], 1 = 完全重叠 (分割完美)</text>

  <!-- Bottom middle: IoU formula -->
  <rect x="330" y="165" width="360" height="90" rx="6" fill="#d97706" fill-opacity="0.06" stroke="#d97706" stroke-width="1.5"/>
  <text x="510" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">IoU 交并比 (Jaccard)</text>
  <text x="510" y="218" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" font-family="Cambria, 'Times New Roman', serif">IoU(P,G) = |P∩G| / |P∪G|</text>
  <text x="510" y="240" text-anchor="middle" font-size="10" fill="#64748b">值域 [0,1], 比 Dice 更严格 (分母更大)</text>

  <!-- Bottom relationship -->
  <text x="510" y="272" text-anchor="middle" font-size="11" fill="#475569">关系: Dice = 2·IoU / (1 + IoU), IoU = Dice / (2 - Dice)</text>
</svg>
