<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="320" fill="#fafbfc"/>
<rect x="0" y="0" width="720" height="36" fill="#2563eb" rx="0"/>
<text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">特征叠加示意: n 个特征方向在 d 维空间里近似正交嵌入 (n &gt; d)</text>

<!-- 2D embedding illustration -->
<g transform="translate(360,180)">
  <!-- circle representing d-dim unit ball -->
  <circle cx="0" cy="0" r="120" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <text x="0" y="-130" text-anchor="middle" font-size="10" fill="#64748b">d 维单位球 (二维投影)</text>

  <!-- multiple near-orthogonal feature vectors -->
  <line x1="0" y1="0" x2="105" y2="-58" stroke="#2563eb" stroke-width="2" marker-end="url(#a-2563eb)"/>
  <line x1="0" y1="0" x2="58" y2="-105" stroke="#16a34a" stroke-width="2" marker-end="url(#a-16a34a)"/>
  <line x1="0" y1="0" x2="-58" y2="-105" stroke="#d97706" stroke-width="2" marker-end="url(#a-d97706)"/>
  <line x1="0" y1="0" x2="-105" y2="-58" stroke="#dc2626" stroke-width="2" marker-end="url(#a-dc2626)"/>
  <line x1="0" y1="0" x2="-105" y2="58" stroke="#9333ea" stroke-width="2" marker-end="url(#a-9333ea)"/>
  <line x1="0" y1="0" x2="-58" y2="105" stroke="#0891b2" stroke-width="2" marker-end="url(#a-0891b2)"/>
  <line x1="0" y1="0" x2="58" y2="105" stroke="#db2777" stroke-width="2" marker-end="url(#a-db2777)"/>
  <line x1="0" y1="0" x2="105" y2="58" stroke="#475569" stroke-width="2" marker-end="url(#a-64748b)"/>
  <line x1="0" y1="0" x2="40" y2="-30" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#a-9333ea)"/>
  <line x1="0" y1="0" x2="-30" y2="-40" stroke="#65a30d" stroke-width="1.2" marker-end="url(#a-16a34a)"/>
  <line x1="0" y1="0" x2="40" y2="30" stroke="#ea580c" stroke-width="1.2" marker-end="url(#a-d97706)"/>
  <line x1="0" y1="0" x2="-40" y2="30" stroke="#0e7490" stroke-width="1.2" marker-end="url(#a-0891b2)"/>

  <circle cx="0" cy="0" r="3" fill="#1e293b"/>
</g>

<!-- labels at extremes -->
<text x="240" y="115" font-size="10" fill="#1e3a8a">特征 f₁</text>
<text x="245" y="100" font-size="10" fill="#16a34a">特征 f₂</text>
<text x="395" y="100" font-size="10" fill="#d97706">特征 f₃</text>
<text x="500" y="115" font-size="10" fill="#7f1d1d">特征 f₄</text>

<!-- Right side: explanation -->
<g transform="translate(20,250)">
  <text x="0" y="0" font-size="11" font-weight="700" fill="#475569">Johnson-Lindenstrauss 引理</text>
  <text x="0" y="18" font-size="10" fill="#334155">d 维空间可容纳 e^O(d) 个近似正交向量</text>
  <text x="0" y="34" font-size="10" fill="#475569">网络把 n ≫ d 个特征塞进 d 维, 依赖输入稀疏性避干扰</text>
</g>

<g transform="translate(360,250)">
  <text x="0" y="0" font-size="11" font-weight="700" fill="#475569">后果: 多义神经元</text>
  <text x="0" y="18" font-size="10" fill="#334155">单个神经元同时响应多个无关概念</text>
  <text x="0" y="34" font-size="10" fill="#475569">想找 "猫神经元" 找不到 → 需 SAE 分解回单义特征</text>
</g>
</svg>
