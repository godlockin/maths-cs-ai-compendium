<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="320" fill="#fafbfc"/>
<rect x="0" y="0" width="720" height="36" fill="#2563eb" rx="0"/>
<text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">对抗攻击的威胁模型三维分类</text>

<!-- Three axes diagram -->
<!-- Cube -->
<g transform="translate(120,70)">
  <!-- Axis 1: info level -->
  <line x1="60" y1="120" x2="60" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#a-2563eb)"/>
  <text x="60" y="-8" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">信息可见性</text>
  <text x="60" y="10" text-anchor="middle" font-size="10" fill="#475569">白盒 vs 黑盒</text>
  <text x="60" y="40" text-anchor="middle" font-size="9" fill="#64748b">看梯度 / 结构</text>
  <text x="60" y="54" text-anchor="middle" font-size="9" fill="#64748b">→ 仅 API 查询</text>

  <!-- Axis 2: timing -->
  <line x1="60" y1="120" x2="0" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#a-16a34a)"/>
  <text x="20" y="220" font-size="11" font-weight="700" fill="#14532d">介入阶段</text>
  <text x="20" y="235" font-size="10" fill="#475569">训练时 vs 推理时</text>
  <text x="0" y="208" font-size="9" fill="#64748b" text-anchor="end">训练时</text>
  <text x="50" y="125" font-size="9" fill="#64748b" text-anchor="end">推理时</text>

  <!-- Axis 3: target -->
  <line x1="60" y1="120" x2="240" y2="120" stroke="#dc2626" stroke-width="2" marker-end="url(#a-dc2626)"/>
  <text x="260" y="118" font-size="11" font-weight="700" fill="#7f1d1d">攻击目标</text>
  <text x="260" y="132" font-size="10" fill="#475569">误分类 / 抽取</text>
  <text x="260" y="146" font-size="10" fill="#475569">窃取 / 拒服</text>

  <!-- 8 cells label -->
  <text x="120" y="100" text-anchor="middle" font-size="9" fill="#64748b">2 × 2 × 4 = 16 种组合</text>
</g>

<!-- Right side: text table -->
<g transform="translate(420,80)">
  <text x="0" y="0" font-size="11" font-weight="700" fill="#1e293b">典型威胁模型</text>
  <rect x="0" y="14" width="270" height="22" rx="3" fill="#2563eb" fill-opacity="0.10"/>
  <text x="10" y="29" font-size="10" fill="#334155">白盒 + 推理时 + 误分类</text>
  <text x="260" y="29" text-anchor="end" font-size="9" fill="#64748b">FGSM / PGD / C&amp;W</text>

  <rect x="0" y="42" width="270" height="22" rx="3" fill="#9333ea" fill-opacity="0.10"/>
  <text x="10" y="57" font-size="10" fill="#334155">黑盒 + 推理时 + 越权</text>
  <text x="260" y="57" text-anchor="end" font-size="9" fill="#64748b">GCG / PAIR / TAP</text>

  <rect x="0" y="70" width="270" height="22" rx="3" fill="#dc2626" fill-opacity="0.10"/>
  <text x="10" y="85" font-size="10" fill="#334155">训练时 + 数据投毒</text>
  <text x="260" y="85" text-anchor="end" font-size="9" fill="#64748b">backdoor / sleeper</text>

  <rect x="0" y="98" width="270" height="22" rx="3" fill="#16a34a" fill-opacity="0.10"/>
  <text x="10" y="113" font-size="10" fill="#334155">推理时 + 数据抽取</text>
  <text x="260" y="113" text-anchor="end" font-size="9" fill="#64748b">training data leak</text>

  <rect x="0" y="126" width="270" height="22" rx="3" fill="#d97706" fill-opacity="0.10"/>
  <text x="10" y="141" font-size="10" fill="#334155">推理时 + 模型窃取</text>
  <text x="260" y="141" text-anchor="end" font-size="9" fill="#64748b">model stealing</text>

  <rect x="0" y="154" width="270" height="22" rx="3" fill="#0891b2" fill-opacity="0.10"/>
  <text x="10" y="169" font-size="10" fill="#334155">推理时 + 拒服</text>
  <text x="260" y="169" text-anchor="end" font-size="9" fill="#64748b">DoS / token 爆量</text>

  <text x="0" y="195" font-size="9" fill="#475569">本节聚焦: 视觉误分类 + LLM 越狱 / 提示注入</text>
  <text x="0" y="210" font-size="9" fill="#64748b">(当下 AI 产品最直接的暴露面)</text>
</g>
</svg>
