<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" height="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="700" height="240" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">多任务精排: 共享底层 (Embedding+MLP) + 多个任务塔 + 任务权重 α</text>

  <!-- Bottom shared layer -->
  <rect x="240" y="170" width="220" height="44" rx="6" fill="#2563eb"/>
  <text x="350" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="white">共享底层</text>
  <text x="350" y="206" text-anchor="middle" font-size="10" fill="#dbeafe">Embedding + MLP 公共表示</text>

  <!-- Arrows up from shared to each tower -->
  <line x1="290" y1="170" x2="120" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>
  <line x1="350" y1="170" x2="350" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>
  <line x1="410" y1="170" x2="580" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>

  <!-- Task Tower 1: Watch (主任务) -->
  <rect x="40" y="80" width="180" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="130" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">Watch Tower</text>
  <text x="130" y="114" text-anchor="middle" font-size="9" fill="#475569">α=1.0 weighted LR</text>

  <!-- Task Tower 2: Like -->
  <rect x="260" y="80" width="180" height="40" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="350" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#d97706">Like Tower</text>
  <text x="350" y="114" text-anchor="middle" font-size="9" fill="#475569">α=0.3 CTR-style</text>

  <!-- Task Tower 3: Share -->
  <rect x="480" y="80" width="180" height="40" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1.8"/>
  <text x="570" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#db2777">Share Tower</text>
  <text x="570" y="114" text-anchor="middle" font-size="9" fill="#475569">α=0.2 稀有信号</text>

  <!-- Output labels above towers -->
  <text x="130" y="70" text-anchor="middle" font-size="9" fill="#64748b">完播率 (主)</text>
  <text x="350" y="70" text-anchor="middle" font-size="9" fill="#64748b">点赞概率</text>
  <text x="570" y="70" text-anchor="middle" font-size="9" fill="#64748b">分享概率</text>

  <!-- Input at bottom -->
  <rect x="240" y="218" width="220" height="14" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="350" y="228" text-anchor="middle" font-size="9" fill="#475569">输入: 用户/物品/上下文 特征</text>
</svg>