<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="200" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <radialGradient id="gradcam-heat">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fafbfc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="white">胸片分类流水线 (CheXNet 风格)</text>

  <!-- Stage 1: Original X-ray -->
  <rect x="30" y="60" width="120" height="100" rx="6" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <text x="90" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">原始 X 光</text>
  <!-- Stylised thorax silhouette -->
  <ellipse cx="90" cy="118" rx="36" ry="40" fill="#1e293b" fill-opacity="0.85"/>
  <line x1="90" y1="78" x2="90" y2="158" stroke="#94a3b8" stroke-width="1"/>
  <ellipse cx="78" cy="118" rx="10" ry="14" fill="#0f172a"/>
  <ellipse cx="102" cy="118" rx="10" ry="14" fill="#0f172a"/>
  <rect x="60" y="138" width="60" height="14" rx="3" fill="#94a3b8" fill-opacity="0.4"/>

  <line x1="150" y1="110" x2="184" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>

  <!-- Stage 2: CNN DenseNet-121 -->
  <rect x="184" y="60" width="170" height="100" rx="6" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
  <text x="269" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">CNN: DenseNet-121</text>

  <!-- Dense blocks -->
  <rect x="194" y="92" width="20" height="20" fill="#2563eb" fill-opacity="0.6"/>
  <rect x="218" y="92" width="20" height="20" fill="#2563eb" fill-opacity="0.6"/>
  <rect x="242" y="92" width="20" height="20" fill="#2563eb" fill-opacity="0.6"/>
  <rect x="266" y="92" width="20" height="20" fill="#2563eb" fill-opacity="0.6"/>
  <rect x="290" y="92" width="20" height="20" fill="#2563eb" fill-opacity="0.6"/>
  <rect x="314" y="92" width="20" height="20" fill="#2563eb" fill-opacity="0.6"/>
  <text x="269" y="128" text-anchor="middle" font-size="9" fill="#475569">121 层 · 密集连接 · ChestX-ray14</text>
  <text x="269" y="142" text-anchor="middle" font-size="9" fill="#475569">14 万张 · 14 类标签</text>
  <text x="269" y="156" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a">Rajpurkar 2017 (CheXNet)</text>

  <line x1="354" y1="110" x2="388" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>

  <!-- Stage 3: 14-class predictions -->
  <rect x="388" y="60" width="140" height="100" rx="6" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="1.5"/>
  <text x="458" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">14 类胸片标签</text>

  <text x="396" y="94" font-size="9" fill="#334155">肺炎</text>
  <rect x="430" y="86" width="80" height="8" fill="#e2e8f0"/>
  <rect x="430" y="86" width="74" height="8" fill="#dc2626"/>
  <text x="514" y="94" font-size="9" fill="#64748b">0.92</text>

  <text x="396" y="110" font-size="9" fill="#334155">胸腔积液</text>
  <rect x="430" y="102" width="80" height="8" fill="#e2e8f0"/>
  <rect x="430" y="102" width="42" height="8" fill="#d97706"/>
  <text x="514" y="110" font-size="9" fill="#64748b">0.52</text>

  <text x="396" y="126" font-size="9" fill="#334155">肺结节</text>
  <rect x="430" y="118" width="80" height="8" fill="#e2e8f0"/>
  <rect x="430" y="118" width="22" height="8" fill="#2563eb"/>
  <text x="514" y="126" font-size="9" fill="#64748b">0.27</text>

  <text x="396" y="142" font-size="9" fill="#334155">气胸</text>
  <rect x="430" y="134" width="80" height="8" fill="#e2e8f0"/>
  <rect x="430" y="134" width="10" height="8" fill="#16a34a"/>
  <text x="514" y="142" font-size="9" fill="#64748b">0.13</text>

  <text x="458" y="156" text-anchor="middle" font-size="9" fill="#64748b">+ 10 类 (Sigmoid)</text>

  <line x1="528" y1="110" x2="562" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>

  <!-- Stage 4: Grad-CAM heatmap overlay -->
  <rect x="562" y="60" width="130" height="100" rx="6" fill="white" stroke="#dc2626" stroke-width="1.5"/>
  <text x="627" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">Grad-CAM 热图</text>

  <!-- Mini thorax + heatmap blob -->
  <ellipse cx="627" cy="120" rx="36" ry="36" fill="#1e293b" fill-opacity="0.85"/>
  <line x1="627" y1="84" x2="627" y2="156" stroke="#94a3b8" stroke-width="1"/>
  <ellipse cx="615" cy="120" rx="10" ry="14" fill="#0f172a"/>
  <ellipse cx="639" cy="120" rx="10" ry="14" fill="#0f172a"/>
  <!-- heatmap blob on right lower lung -->
  <circle cx="640" cy="132" r="14" fill="url(#gradcam-heat)"/>

  <text x="627" y="156" text-anchor="middle" font-size="9" fill="#64748b">高亮关键区域</text>

  <!-- Bottom annotation -->
  <text x="360" y="186" text-anchor="middle" font-size="11" fill="#475569">CheXNet F1 = 0.435 (肺炎) > 4 位放射科医生平均</text>
</svg>
