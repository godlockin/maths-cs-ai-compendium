<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="180" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb" rx="0"/>
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">8 步框架圆环: 数据→特征→模型→评估→部署→监控→反馈, 用户在中心</text>

  <!-- User center -->
  <circle cx="360" cy="108" r="32" fill="#2563eb"/>
  <text x="360" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="white">用户</text>
  <text x="360" y="118" text-anchor="middle" font-size="9" fill="#dbeafe">持续迭代</text>

  <!-- 8 nodes around (radius 78) -->
  <!-- top -->
  <circle cx="360" cy="30" r="22" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.8"/>
  <text x="360" y="26" text-anchor="middle" font-size="9" font-weight="700" fill="#2563eb">1 数据</text>
  <text x="360" y="38" text-anchor="middle" font-size="8" fill="#475569">Data</text>

  <!-- top-right -->
  <circle cx="415" cy="53" r="22" fill="#f1f5f9" stroke="#16a34a" stroke-width="1.8"/>
  <text x="415" y="49" text-anchor="middle" font-size="9" font-weight="700" fill="#16a34a">2 特征</text>
  <text x="415" y="61" text-anchor="middle" font-size="8" fill="#475569">Features</text>

  <!-- right -->
  <circle cx="438" cy="108" r="22" fill="#f1f5f9" stroke="#0891b2" stroke-width="1.8"/>
  <text x="438" y="104" text-anchor="middle" font-size="9" font-weight="700" fill="#0891b2">3 模型</text>
  <text x="438" y="116" text-anchor="middle" font-size="8" fill="#475569">Model</text>

  <!-- bottom-right -->
  <circle cx="415" cy="163" r="22" fill="#f1f5f9" stroke="#d97706" stroke-width="1.8"/>
  <text x="415" y="159" text-anchor="middle" font-size="9" font-weight="700" fill="#d97706">4 评估</text>
  <text x="415" y="171" text-anchor="middle" font-size="8" fill="#475569">Eval</text>

  <!-- bottom -->
  <circle cx="360" cy="186" r="22" fill="#f1f5f9" stroke="#9333ea" stroke-width="1.8"/>
  <text x="360" y="182" text-anchor="middle" font-size="9" font-weight="700" fill="#9333ea">5 部署</text>
  <text x="360" y="194" text-anchor="middle" font-size="8" fill="#475569">Deploy</text>

  <!-- bottom-left -->
  <circle cx="305" cy="163" r="22" fill="#f1f5f9" stroke="#db2777" stroke-width="1.8"/>
  <text x="305" y="159" text-anchor="middle" font-size="9" font-weight="700" fill="#db2777">6 监控</text>
  <text x="305" y="171" text-anchor="middle" font-size="8" fill="#475569">Monitor</text>

  <!-- left -->
  <circle cx="282" cy="108" r="22" fill="#f1f5f9" stroke="#dc2626" stroke-width="1.8"/>
  <text x="282" y="104" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">7 反馈</text>
  <text x="282" y="116" text-anchor="middle" font-size="8" fill="#475569">Feedback</text>

  <!-- top-left -->
  <circle cx="305" cy="53" r="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="305" y="49" text-anchor="middle" font-size="9" font-weight="700" fill="#64748b">8 迭代</text>
  <text x="305" y="61" text-anchor="middle" font-size="8" fill="#475569">Iterate</text>

  <!-- Arrow indicators around -->
  <text x="392" y="42" font-size="14" font-weight="700" fill="#64748b">→</text>
  <text x="430" y="82" font-size="14" font-weight="700" fill="#64748b">→</text>
  <text x="430" y="140" font-size="14" font-weight="700" fill="#64748b">→</text>
  <text x="392" y="180" font-size="14" font-weight="700" fill="#64748b">→</text>
  <text x="328" y="180" font-size="14" font-weight="700" fill="#64748b">→</text>
  <text x="290" y="140" font-size="14" font-weight="700" fill="#64748b">→</text>
  <text x="290" y="82" font-size="14" font-weight="700" fill="#64748b">→</text>
  <text x="328" y="42" font-size="14" font-weight="700" fill="#64748b">→</text>
</svg>