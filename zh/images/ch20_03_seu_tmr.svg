<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="700" height="320" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
    <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
    <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="36" fill="#2563eb"/>
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">单粒子翻转 (SEU) 与三模冗余 (TMR)</text>

  <!-- LEFT: SEU mechanism -->
  <g transform="translate(40,60)">
    <text x="140" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">单粒子翻转 SEU</text>

    <!-- Memory cell -->
    <g transform="translate(60,40)">
      <rect x="0" y="0" width="100" height="60" fill="#fafbfc" stroke="#94a3b8" stroke-width="1.4" rx="3"/>
      <text x="50" y="20" text-anchor="middle" font-size="10" fill="#64748b">存储 bit</text>
      <text x="50" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">1</text>
      <text x="50" y="54" text-anchor="middle" font-size="8" fill="#64748b">正常状态</text>
    </g>

    <!-- Cosmic ray -->
    <g transform="translate(60,140)">
      <text x="0" y="0" font-size="11" font-weight="600" fill="#9333ea">宇宙射线 / 高能粒子</text>
      <line x1="40" y1="10" x2="160" y2="-80" stroke="#9333ea" stroke-width="2" marker-end="url(#a-9333ea)"/>
      <circle cx="160" cy="-80" r="4" fill="#dc2626"/>
      <text x="180" y="-80" font-size="10" fill="#dc2626" font-weight="700">粒子撞击</text>
    </g>

    <!-- After SEU -->
    <g transform="translate(220,40)">
      <text x="60" y="-10" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">翻转后</text>
      <rect x="0" y="0" width="100" height="60" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4" rx="3"/>
      <text x="50" y="20" text-anchor="middle" font-size="10" fill="#64748b">存储 bit</text>
      <text x="50" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">0</text>
      <text x="50" y="54" text-anchor="middle" font-size="8" fill="#dc2626">1 → 0 翻转!</text>
    </g>
    <line x1="160" y1="80" x2="220" y2="80" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a-dc2626)"/>
    <text x="190" y="74" text-anchor="middle" font-size="9" fill="#dc2626">SEU</text>
  </g>

  <!-- RIGHT: TMR -->
  <g transform="translate(360,60)">
    <text x="160" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">三模冗余 TMR + 多数表决</text>

    <!-- 3 voters -->
    <g transform="translate(0,30)">
      <rect x="0" y="0" width="60" height="36" rx="4" fill="#dcfce7" stroke="#16a34a"/>
      <text x="30" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">1</text>
      <rect x="80" y="0" width="60" height="36" rx="4" fill="#fee2e2" stroke="#dc2626"/>
      <text x="110" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">0</text>
      <rect x="160" y="0" width="60" height="36" rx="4" fill="#dcfce7" stroke="#16a34a"/>
      <text x="190" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">1</text>
      <text x="30" y="50" text-anchor="middle" font-size="9" fill="#64748b">副本 A</text>
      <text x="110" y="50" text-anchor="middle" font-size="9" fill="#64748b">副本 B (被翻转)</text>
      <text x="190" y="50" text-anchor="middle" font-size="9" fill="#64748b">副本 C</text>
    </g>

    <!-- voter -->
    <g transform="translate(60,110)">
      <line x1="0" y1="0" x2="110" y2="50" stroke="#16a34a" stroke-width="1.4"/>
      <line x1="110" y1="0" x2="110" y2="50" stroke="#dc2626" stroke-width="1.4"/>
      <line x1="220" y1="0" x2="110" y2="50" stroke="#16a34a" stroke-width="1.4"/>
      <polygon points="80,40 140,40 110,80" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
      <text x="110" y="68" text-anchor="middle" font-size="10" font-weight="700" fill="#d97706">voter</text>
    </g>

    <!-- Output -->
    <g transform="translate(60,205)">
      <rect x="0" y="0" width="100" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
      <text x="50" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">输出 = 1</text>
      <text x="80" y="45" font-size="10" fill="#475569">少数服从多数, 自动屏蔽 1 个翻转</text>
    </g>
    <line x1="110" y1="190" x2="110" y2="205" stroke="#64748b" stroke-width="1.4" marker-end="url(#a-64748b)"/>
  </g>

  <!-- Bottom formula/caption -->
  <g transform="translate(60,295)">
    <rect x="0" y="-8" width="580" height="22" rx="4" fill="#eff6ff" stroke="#2563eb"/>
    <text x="290" y="7" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">LEO 单粒子翻转率 ≈ 10⁻⁷ ~ 10⁻⁵ / 位·天  ·  TMR 把翻转不可纠正概率压到 (p)² ~ 10⁻¹⁴</text>
  </g>

</svg>