<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="700" height="320" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
    <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
    <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="36" fill="#2563eb"/>
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">去中心化 AI 的动机</text>

  <text x="350" y="55" text-anchor="middle" font-size="11" fill="#64748b">当前集中式 AI 已被四大现实压力逼到墙角</text>

  <!-- 4 quadrants -->
  <g transform="translate(60,80)">
    <rect x="0" y="0" width="280" height="100" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#dc2626">① 数据垄断</text>
    <text x="20" y="40" font-size="10" fill="#475569">几家公司把控着</text>
    <text x="20" y="54" font-size="10" fill="#475569">PB 级训练数据,</text>
    <text x="20" y="68" font-size="10" fill="#475569">小公司无法参与</text>
    <text x="20" y="86" font-size="9" font-style="italic" fill="#64748b">"卡脖子"+定价权</text>
  </g>

  <g transform="translate(360,80)">
    <rect x="0" y="0" width="280" height="100" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#d97706">② 隐私与合规</text>
    <text x="20" y="40" font-size="10" fill="#475569">GDPR · HIPAA ·</text>
    <text x="20" y="54" font-size="10" fill="#475569">数据三法 + 个保法</text>
    <text x="20" y="68" font-size="10" fill="#475569">"数据不能出机房"</text>
    <text x="20" y="86" font-size="9" font-style="italic" fill="#64748b">原始数据 ≠ 可聚合知识</text>
  </g>

  <g transform="translate(60,195)">
    <rect x="0" y="0" width="280" height="100" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.4"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#9333ea">③ 数据孤岛</text>
    <text x="20" y="40" font-size="10" fill="#475569">医院/银行/电网各</text>
    <text x="20" y="54" font-size="10" fill="#475569">自有强业务数据,</text>
    <text x="20" y="68" font-size="10" fill="#475569">但合规不让互通</text>
    <text x="20" y="86" font-size="9" font-style="italic" fill="#64748b">数据 ≠ 可融合</text>
  </g>

  <g transform="translate(360,195)">
    <rect x="0" y="0" width="280" height="100" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#16a34a">④ 反集权与信任</text>
    <text x="20" y="40" font-size="10" fill="#475569">"模型霸权"风险,</text>
    <text x="20" y="54" font-size="10" fill="#475569">单一服务商可随时</text>
    <text x="20" y="68" font-size="10" fill="#475569">切断或审查下游</text>
    <text x="20" y="86" font-size="9" font-style="italic" fill="#64748b">可用性 + 中立性缺失</text>
  </g>

</svg>