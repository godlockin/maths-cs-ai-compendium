<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="320" fill="#fafbfc"/>
<rect x="0" y="0" width="720" height="36" fill="#2563eb" rx="0"/>
<text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">GCG 攻击流程: 梯度选候选 → 采样替换 → 前向验证</text>

<!-- iteration loop as 4 steps -->
<!-- Step 1 -->
<rect x="30" y="70" width="280" height="100" rx="6" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
<text x="170" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Step 1: 反向传播</text>
<text x="50" y="118" font-size="10" fill="#334155">∇_{e_{s_i}} L(s_{1:k})</text>
<text x="50" y="136" font-size="9" fill="#475569">对每个后缀位置 i 求 one-hot 嵌入梯度</text>
<text x="50" y="156" font-size="9" fill="#475569">只在离散 token 上做, 借助梯度作</text>
<text x="50" y="170" font-size="9" fill="#475569">离散贪心的方向参考</text>

<!-- Step 2 -->
<rect x="410" y="70" width="280" height="100" rx="6" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="1.5"/>
<text x="550" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Step 2: Top-K 候选</text>
<text x="430" y="118" font-size="10" fill="#334155">每个位置取梯度分量最小 top-K'</text>
<text x="430" y="136" font-size="9" fill="#475569">组成候选集 C_i (K' ≈ 256)</text>
<text x="430" y="156" font-size="9" fill="#475569">Step 3: 随机抽样 B 个替换</text>
<text x="430" y="170" font-size="9" fill="#475569">(位置 i, 替换 token ∈ C_i)</text>

<!-- arrows -->
<line x1="310" y1="120" x2="410" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>

<!-- Step 4 -->
<rect x="220" y="200" width="280" height="80" rx="6" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="1.5"/>
<text x="360" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Step 4: 前向验证</text>
<text x="240" y="244" font-size="10" fill="#334155">每个候选实际过一遍前向 → 选 loss 最低</text>
<text x="240" y="262" font-size="9" fill="#475569">迭代 500-1000 步 · 1 反向 + B 前向 / 步</text>

<!-- feedback loop arrow -->
<path d="M 360 200 L 360 186 Q 360 175, 348 175 L 172 175 Q 160 175, 160 165 L 160 170" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#a-64748b)"/>
<text x="200" y="194" font-size="9" fill="#64748b">反复迭代, 直到成功越狱或步数耗尽</text>

<!-- bottom formula -->
<rect x="30" y="290" width="660" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="360" y="306" text-anchor="middle" font-size="10" fill="#334155">目标: max_{s} log p_θ(y_{1:m} | x ⊕ s)   s.t. 越狱前缀 y (e.g. "Sure, here's how...")</text>
</svg>
