<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }</style>
  <rect width="720" height="380" fill="#fafbfc"/>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">人类打分 vs LLM-as-Judge 的成本 · 一致性 · 速度三维对比</text>
  <text x="360" y="58" text-anchor="middle" font-size="11" fill="#64748b">差 100-300 倍 — 解释了 LLM-as-Judge 为什么成 pipeline 默认</text>

  <!-- Header row: column titles -->
  <g font-size="11" font-weight="700" fill="#475569">
    <text x="40" y="98">判分方式</text>
    <text x="240" y="98" text-anchor="middle">单次成本</text>
    <text x="380" y="98" text-anchor="middle">耗时</text>
    <text x="540" y="98" text-anchor="middle">与人类一致性</text>
    <text x="660" y="98" text-anchor="middle">综合</text>
  </g>
  <line x1="30" y1="106" x2="690" y2="106" stroke="#94a3b8" stroke-width="1"/>

  <!-- 4 rows -->
  <g>
    <text x="40" y="128" font-size="11" fill="#1e293b" font-weight="600">单个人类专家</text>
    <text x="240" y="128" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">$3 / 题</text>
    <text x="380" y="128" text-anchor="middle" font-size="11" fill="#64748b">~5 min / 题</text>
    <rect x="490" y="116" width="120" height="14" fill="#f1f5f9"/>
    <rect x="490" y="116" width="120" height="14" fill="#16a34a" fill-opacity="0.85"/>
    <text x="550" y="127" text-anchor="middle" font-size="10" fill="white" font-weight="600">baseline</text>
    <text x="660" y="128" text-anchor="middle" font-size="11">—</text>
  </g>

  <line x1="30" y1="140" x2="690" y2="140" stroke="#e2e8f0" stroke-width="1"/>

  <g>
    <text x="40" y="168" font-size="11" fill="#1e293b" font-weight="600">MT-Bench 3 人类 majority</text>
    <text x="240" y="168" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">$9 / 题</text>
    <text x="380" y="168" text-anchor="middle" font-size="11" fill="#64748b">15 min / 题</text>
    <rect x="490" y="156" width="120" height="14" fill="#f1f5f9"/>
    <rect x="490" y="156" width="108" height="14" fill="#16a34a" fill-opacity="0.85"/>
    <text x="544" y="167" text-anchor="middle" font-size="10" fill="white" font-weight="600">~90%</text>
    <text x="660" y="168" text-anchor="middle" font-size="11" fill="#475569">贵</text>
  </g>

  <line x1="30" y1="180" x2="690" y2="180" stroke="#e2e8f0" stroke-width="1"/>

  <g>
    <text x="40" y="208" font-size="11" fill="#1e293b" font-weight="600">GPT-4 判分 (2024)</text>
    <text x="240" y="208" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="700">$0.03 / 题</text>
    <text x="380" y="208" text-anchor="middle" font-size="11" fill="#64748b">~3 s / 题</text>
    <rect x="490" y="196" width="120" height="14" fill="#f1f5f9"/>
    <rect x="490" y="196" width="102" height="14" fill="#d97706" fill-opacity="0.85"/>
    <text x="541" y="207" text-anchor="middle" font-size="10" fill="white" font-weight="600">~85%</text>
    <text x="660" y="208" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="700">性价比最高</text>
  </g>

  <line x1="30" y1="220" x2="690" y2="220" stroke="#e2e8f0" stroke-width="1"/>

  <g>
    <text x="40" y="248" font-size="11" fill="#1e293b" font-weight="600">GPT-4o 判分 (2024 末)</text>
    <text x="240" y="248" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="700">$0.01 / 题</text>
    <text x="380" y="248" text-anchor="middle" font-size="11" fill="#64748b">~2 s / 题</text>
    <rect x="490" y="236" width="120" height="14" fill="#f1f5f9"/>
    <rect x="490" y="236" width="104" height="14" fill="#d97706" fill-opacity="0.85"/>
    <text x="542" y="247" text-anchor="middle" font-size="10" fill="white" font-weight="600">~87%</text>
    <text x="660" y="248" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="700">当前主流</text>
  </g>

  <!-- Bottom: 3D axes visualisation mini -->
  <g transform="translate(20,280)">
    <rect x="0" y="0" width="680" height="80" rx="8" fill="#2563eb" fill-opacity="0.04" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="340" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">三维坐标: 越靠内圈 = 越优(低成本 / 高一致性 / 高速)</text>

    <!-- 3 axes labels -->
    <text x="160" y="36" text-anchor="middle" font-size="10" fill="#2563eb" font-weight="600">成本 ↓</text>
    <text x="340" y="36" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="600">一致性 ↑</text>
    <text x="520" y="36" text-anchor="middle" font-size="10" fill="#d97706" font-weight="600">速度 ↑</text>

    <text x="20" y="55" font-size="10" fill="#1e293b">人类专家:</text>
    <text x="160" y="55" font-size="10" fill="#dc2626">高 (差)</text>
    <text x="340" y="55" font-size="10" fill="#16a34a">极高</text>
    <text x="520" y="55" font-size="10" fill="#dc2626">极慢</text>

    <text x="20" y="72" font-size="10" fill="#1e293b">GPT-4 judge:</text>
    <text x="160" y="72" font-size="10" fill="#16a34a">极低 (优)</text>
    <text x="340" y="72" font-size="10" fill="#d97706">中</text>
    <text x="520" y="72" font-size="10" fill="#16a34a">极快</text>
  </g>
</svg>
