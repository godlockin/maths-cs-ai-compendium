<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="700" height="280" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">抖音实时训练 vs YouTube 离线训练 对比</text>

  <!-- Column headers -->
  <text x="120" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">对比维度</text>
  <text x="310" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#db2777">抖音 (实时训练)</text>
  <text x="565" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">YouTube (离线训练)</text>

  <!-- Row 1: 训练频率 -->
  <rect x="30" y="75" width="180" height="30" fill="#f1f5f9"/>
  <text x="120" y="94" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">训练频率</text>
  <rect x="220" y="75" width="180" height="30" fill="#fce7f3"/>
  <text x="310" y="94" text-anchor="middle" font-size="11" font-weight="600" fill="#db2777">5 分钟全局更新</text>
  <rect x="410" y="75" width="270" height="30" fill="#dbeafe"/>
  <text x="545" y="94" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">天级离线 + 全量重训</text>

  <!-- Row 2: 数据延迟 -->
  <rect x="30" y="105" width="180" height="30" fill="#f8fafc"/>
  <text x="120" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">数据延迟</text>
  <rect x="220" y="105" width="180" height="30" fill="#fce7f3"/>
  <text x="310" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#db2777">Kafka &lt; 1s 入流</text>
  <rect x="410" y="105" width="270" height="30" fill="#dbeafe"/>
  <text x="545" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">天级离线回填</text>

  <!-- Row 3: 模型下发 -->
  <rect x="30" y="135" width="180" height="30" fill="#f1f5f9"/>
  <text x="120" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">模型下发</text>
  <rect x="220" y="135" width="180" height="30" fill="#fce7f3"/>
  <text x="310" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#db2777">Parameter Server 热加载</text>
  <rect x="410" y="135" width="270" height="30" fill="#dbeafe"/>
  <text x="545" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">模型仓库 → 在线服务</text>

  <!-- Row 4: 主指标 -->
  <rect x="30" y="165" width="180" height="30" fill="#f8fafc"/>
  <text x="120" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">主指标</text>
  <rect x="220" y="165" width="180" height="30" fill="#fce7f3"/>
  <text x="310" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#db2777">完播率 0.4 + 实时 CTR</text>
  <rect x="410" y="165" width="270" height="30" fill="#dbeafe"/>
  <text x="545" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">Watch Time per Session</text>

  <!-- Row 5: 部署 -->
  <rect x="30" y="195" width="180" height="30" fill="#f1f5f9"/>
  <text x="120" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">推理架构</text>
  <rect x="220" y="195" width="180" height="30" fill="#fce7f3"/>
  <text x="310" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#db2777">Triton INT8 + PS</text>
  <rect x="410" y="195" width="270" height="30" fill="#dbeafe"/>
  <text x="545" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">TF Serving + 离线预计算</text>

  <!-- Row 6: 探索流量 -->
  <rect x="30" y="225" width="180" height="30" fill="#f8fafc"/>
  <text x="120" y="244" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">探索机制</text>
  <rect x="220" y="225" width="180" height="30" fill="#fce7f3"/>
  <text x="310" y="244" text-anchor="middle" font-size="11" font-weight="600" fill="#db2777">流量池五级升级</text>
  <rect x="410" y="225" width="270" height="30" fill="#dbeafe"/>
  <text x="545" y="244" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">Bandit / Thompson Sampling</text>

  <!-- Caption -->
  <text x="350" y="270" text-anchor="middle" font-size="9" fill="#64748b">抖音: 实时性为王, 模型分钟级更新 / YouTube: 稳定性为王, 重质量胜过快速度</text>
</svg>