<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }</style>
  <rect width="720" height="380" fill="#fafbfc"/>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">pass@k 无偏估计 vs 直接采样估计的方差对比</text>
  <text x="360" y="58" text-anchor="middle" font-size="11" fill="#64748b">n=k 时方差爆炸 · 官方建议 n ≥ 10k</text>

  <!-- Two charts side by side -->
  <!-- LEFT: unbiased estimator (n=100, k=10) -->
  <g transform="translate(50,80)">
    <rect x="0" y="0" width="300" height="240" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="32" rx="8" fill="#16a34a"/>
    <rect x="0" y="20" width="300" height="12" fill="#16a34a"/>
    <text x="150" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="white">无偏 (n=100, k=10)</text>
    <text x="150" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#16a34a">公式: 1 − C(n−c, k) / C(n, k)</text>

    <!-- Axes -->
    <line x1="40" y1="200" x2="280" y2="200" stroke="#334155" stroke-width="1"/>
    <line x1="40" y1="70" x2="40" y2="200" stroke="#334155" stroke-width="1"/>
    <text x="40" y="208" font-size="9" fill="#64748b" text-anchor="middle">run 1</text>
    <text x="100" y="208" font-size="9" fill="#64748b" text-anchor="middle">run 2</text>
    <text x="160" y="208" font-size="9" fill="#64748b" text-anchor="middle">run 3</text>
    <text x="220" y="208" font-size="9" fill="#64748b" text-anchor="middle">run 4</text>
    <text x="160" y="225" text-anchor="middle" font-size="10" fill="#475569">5 次独立重复 (同模型)</text>

    <!-- Narrow bars (low variance) -->
    <rect x="30" y="118" width="20" height="82" fill="#16a34a" fill-opacity="0.7"/>
    <rect x="90" y="120" width="20" height="80" fill="#16a34a" fill-opacity="0.7"/>
    <rect x="150" y="116" width="20" height="84" fill="#16a34a" fill-opacity="0.7"/>
    <rect x="210" y="119" width="20" height="81" fill="#16a34a" fill-opacity="0.7"/>
    <line x1="30" y1="118" x2="50" y2="118" stroke="#15803d" stroke-width="2"/>
    <line x1="90" y1="120" x2="110" y2="120" stroke="#15803d" stroke-width="2"/>
    <line x1="150" y1="116" x2="170" y2="116" stroke="#15803d" stroke-width="2"/>
    <line x1="210" y1="119" x2="230" y2="119" stroke="#15803d" stroke-width="2"/>

    <text x="150" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#16a34a">方差 ≈ 0.012</text>
    <text x="150" y="95" text-anchor="middle" font-size="10" fill="#64748b">95% CI: ± 1.7 个百分点</text>
  </g>

  <!-- RIGHT: naive n=k (n=10, k=10) -->
  <g transform="translate(370,80)">
    <rect x="0" y="0" width="300" height="240" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="32" rx="8" fill="#dc2626"/>
    <rect x="0" y="20" width="300" height="12" fill="#dc2626"/>
    <text x="150" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="white">朴素 (n=k=10)</text>
    <text x="150" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">单次抽样 → 噪声主导</text>

    <line x1="40" y1="200" x2="280" y2="200" stroke="#334155" stroke-width="1"/>
    <line x1="40" y1="70" x2="40" y2="200" stroke="#334155" stroke-width="1"/>
    <text x="40" y="208" font-size="9" fill="#64748b" text-anchor="middle">run 1</text>
    <text x="100" y="208" font-size="9" fill="#64748b" text-anchor="middle">run 2</text>
    <text x="160" y="208" font-size="9" fill="#64748b" text-anchor="middle">run 3</text>
    <text x="220" y="208" font-size="9" fill="#64748b" text-anchor="middle">run 4</text>
    <text x="160" y="225" text-anchor="middle" font-size="10" fill="#475569">5 次独立重复 (同模型)</text>

    <!-- Wild spread bars -->
    <rect x="30" y="80" width="20" height="120" fill="#dc2626" fill-opacity="0.7"/>
    <rect x="90" y="150" width="20" height="50" fill="#dc2626" fill-opacity="0.7"/>
    <rect x="150" y="105" width="20" height="95" fill="#dc2626" fill-opacity="0.7"/>
    <rect x="210" y="135" width="20" height="65" fill="#dc2626" fill-opacity="0.7"/>
    <line x1="30" y1="80" x2="50" y2="80" stroke="#991b1b" stroke-width="2"/>
    <line x1="90" y1="150" x2="110" y2="150" stroke="#991b1b" stroke-width="2"/>
    <line x1="150" y1="105" x2="170" y2="105" stroke="#991b1b" stroke-width="2"/>
    <line x1="210" y1="135" x2="230" y2="135" stroke="#991b1b" stroke-width="2"/>

    <text x="150" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">方差 ≈ 0.21</text>
    <text x="150" y="93" text-anchor="middle" font-size="10" fill="#64748b">95% CI: ± 18 个百分点</text>
  </g>

  <!-- Summary formula box -->
  <rect x="100" y="335" width="520" height="36" rx="6" fill="#9333ea" fill-opacity="0.08" stroke="#9333ea" stroke-width="1.2"/>
  <text x="360" y="358" text-anchor="middle" font-size="11" fill="#1e293b">· 官方建议 n ≥ 10k · 报 pass@1 严格用贪婪解码 · 仓库级 agent 任务报 resolve rate @ 1 / multi-turn 而非 pass@k</text>
</svg>
