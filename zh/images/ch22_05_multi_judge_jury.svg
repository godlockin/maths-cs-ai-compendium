<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }</style>
  <rect width="720" height="420" fill="#fafbfc"/>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">多 LLM 集成 judge 的架构 (jury)</text>
  <text x="360" y="58" text-anchor="middle" font-size="11" fill="#64748b">独立判分 → 加权投票 → 最终裁决 · 多样性 &gt; 数量</text>

  <!-- Stage 1: Input prompt + responses -->
  <g transform="translate(20,90)">
    <rect x="0" y="0" width="150" height="60" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="22" rx="8" fill="#0891b2"/>
    <rect x="0" y="14" width="150" height="8" fill="#0891b2"/>
    <text x="75" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="white">输入</text>
    <text x="75" y="42" text-anchor="middle" font-size="10" fill="#1e293b">prompt + A / B</text>
    <text x="75" y="56" text-anchor="middle" font-size="10" fill="#64748b">两个候选回答</text>
  </g>

  <!-- Stage 2: Independent Judges -->
  <g transform="translate(195,90)">
    <rect x="0" y="0" width="280" height="180" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="22" rx="8" fill="#9333ea"/>
    <rect x="0" y="14" width="280" height="8" fill="#9333ea"/>
    <text x="140" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="white">独立判分 (swap-and-average)</text>

    <!-- 3 judge rows -->
    <rect x="14" y="34" width="80" height="32" rx="4" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="1"/>
    <text x="54" y="48" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">GPT-4o</text>
    <text x="54" y="60" text-anchor="middle" font-size="10" fill="#16a34a">κ=0.72</text>

    <rect x="100" y="34" width="80" height="32" rx="4" fill="#d97706" fill-opacity="0.10" stroke="#d97706" stroke-width="1"/>
    <text x="140" y="48" text-anchor="middle" font-size="10" font-weight="700" fill="#d97706">Claude 3.5</text>
    <text x="140" y="60" text-anchor="middle" font-size="10" fill="#d97706">κ=0.68</text>

    <rect x="186" y="34" width="80" height="32" rx="4" fill="#9333ea" fill-opacity="0.10" stroke="#9333ea" stroke-width="1"/>
    <text x="226" y="48" text-anchor="middle" font-size="10" font-weight="700" fill="#9333ea">Gemini 1.5</text>
    <text x="226" y="60" text-anchor="middle" font-size="10" fill="#9333ea">κ=0.61</text>

    <!-- votes -->
    <text x="54" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">A ↑</text>
    <text x="140" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">A ↑</text>
    <text x="226" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">B ↑</text>

    <text x="140" y="118" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">每个 judge 对同一 pair 跑两遍,</text>
    <text x="140" y="132" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">位置 AB / BA 取平均, 消 position bias</text>

    <text x="14" y="160" font-size="10" fill="#475569">耗时: 6× judge calls (3 模型 × 2 顺序)</text>
  </g>

  <line x1="170" y1="120" x2="195" y2="120" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="195,115 205,120 195,125" fill="#64748b"/>
  <line x1="475" y1="120" x2="500" y2="120" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="500,115 510,120 500,125" fill="#64748b"/>

  <!-- Stage 3: weighted voting -->
  <g transform="translate(510,90)">
    <rect x="0" y="0" width="180" height="180" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="22" rx="8" fill="#16a34a"/>
    <rect x="0" y="14" width="180" height="8" fill="#16a34a"/>
    <text x="90" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="white">加权投票 / 裁决</text>

    <text x="90" y="42" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">w ∝ Cohen's κ_i</text>

    <rect x="20" y="56" width="60" height="20" rx="3" fill="#16a34a" fill-opacity="0.10"/>
    <text x="50" y="70" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="600">w=0.31</text>

    <rect x="20" y="84" width="60" height="20" rx="3" fill="#d97706" fill-opacity="0.10"/>
    <text x="50" y="98" text-anchor="middle" font-size="10" fill="#d97706" font-weight="600">w=0.29</text>

    <rect x="20" y="112" width="60" height="20" rx="3" fill="#9333ea" fill-opacity="0.10"/>
    <text x="50" y="126" text-anchor="middle" font-size="10" fill="#9333ea" font-weight="600">w=0.26</text>

    <text x="90" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">→ A 胜 (加权)</text>
  </g>

  <!-- Bottom remarks -->
  <rect x="20" y="300" width="680" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="360" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">集成收益上限 (Verga 2024)</text>

  <text x="40" y="342" font-size="10.5" fill="#475569">· 1 → 3 judge:</text>
  <text x="200" y="342" font-size="10.5" fill="#16a34a" font-weight="700">一致性 +4%</text>

  <text x="40" y="360" font-size="10.5" fill="#475569">· 3 → 5 judge:</text>
  <text x="200" y="360" font-size="10.5" fill="#d97706" font-weight="700">+1%</text>

  <text x="40" y="378" font-size="10.5" fill="#475569">· 5 → 10 judge:</text>
  <text x="200" y="378" font-size="10.5" fill="#dc2626" font-weight="700">≈ 0</text>

  <text x="380" y="342" font-size="10.5" fill="#475569">· 多样性 &gt; 数量:</text>
  <text x="540" y="342" font-size="10" fill="#1e293b">3 异族 &gt; 5 同族</text>

  <text x="380" y="360" font-size="10.5" fill="#475569">· 成本:</text>
  <text x="540" y="360" font-size="10" fill="#1e293b">3 judge × 2 顺序 = 6×</text>

  <text x="380" y="378" font-size="10.5" fill="#475569">· 适用:</text>
  <text x="540" y="378" font-size="10" fill="#1e293b">关键 leaderboard 才行</text>
</svg>
