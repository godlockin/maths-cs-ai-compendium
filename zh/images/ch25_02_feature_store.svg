<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" height="240" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="700" height="240" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">特征仓库: 离线 (Spark + 数据仓库) 与在线 (Redis/DynamoDB) 共用同一份特征代码</text>

  <!-- Top: Feature Definition (single source) -->
  <rect x="250" y="55" width="200" height="50" rx="6" fill="#2563eb"/>
  <text x="350" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="white">特征定义 (feature_repo/)</text>
  <text x="350" y="95" text-anchor="middle" font-size="10" fill="#dbeafe">单源真相, 训练/推理同源</text>

  <!-- Arrows down to two paths -->
  <line x1="290" y1="105" x2="180" y2="130" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-64748b)"/>
  <line x1="410" y1="105" x2="520" y2="130" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-64748b)"/>

  <!-- Left: Offline path -->
  <rect x="40" y="130" width="280" height="90" rx="6" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">离线仓 (Offline Store)</text>
  <text x="180" y="172" text-anchor="middle" font-size="10" fill="#475569">Spark + 数据仓库 (HDFS/Snowflake)</text>
  <text x="180" y="190" text-anchor="middle" font-size="10" fill="#475569">批量回填 + 天/小时级聚合</text>
  <text x="180" y="208" text-anchor="middle" font-size="10" font-weight="600" fill="#16a34a">训练时: get_historical_features()</text>

  <!-- Right: Online path -->
  <rect x="380" y="130" width="280" height="90" rx="6" fill="#f1f5f9" stroke="#16a34a" stroke-width="1.5"/>
  <text x="520" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">在线仓 (Online Store)</text>
  <text x="520" y="172" text-anchor="middle" font-size="10" fill="#475569">Redis / DynamoDB 低延迟 KV</text>
  <text x="520" y="190" text-anchor="middle" font-size="10" fill="#475569">Flink 流式写入 + 秒级更新</text>
  <text x="520" y="208" text-anchor="middle" font-size="10" font-weight="600" fill="#16a34a">推理时: get_online_features()</text>
</svg>