<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="360" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
    <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
    <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">BCI + LLM 解码流水线</text>

  <text x="360" y="55" text-anchor="middle" font-size="11" fill="#64748b">硬件 + AI 大模型共同放大 BCI 解码能力</text>

  <!-- 5 stages -->
  <g transform="translate(40,80)">
    <!-- Stage 1: Neural signal acquisition -->
    <rect x="0" y="0" width="118" height="80" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="59" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">① 神经采集</text>
    <text x="59" y="38" text-anchor="middle" font-size="10" fill="#475569">EEG/ECoG/intracortical</text>
    <text x="59" y="55" text-anchor="middle" font-size="9" fill="#64748b">多通道电压信号</text>
    <text x="59" y="68" text-anchor="middle" font-size="9" font-weight="600" fill="#2563eb">x ∈ R^(C×T)</text>
  </g>
  <line x1="158" y1="120" x2="170" y2="120" stroke="#64748b" stroke-width="1.4" marker-end="url(#a-64748b)"/>

  <g transform="translate(170,80)">
    <rect x="0" y="0" width="118" height="80" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="59" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">② 预处理</text>
    <text x="59" y="38" text-anchor="middle" font-size="10" fill="#475569">CAR · 带通 · 重参考</text>
    <text x="59" y="55" text-anchor="middle" font-size="9" fill="#64748b">去工频/眼电伪迹</text>
    <text x="59" y="68" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a">y ∈ R^(C×T)</text>
  </g>
  <line x1="288" y1="120" x2="300" y2="120" stroke="#64748b" stroke-width="1.4" marker-end="url(#a-64748b)"/>

  <g transform="translate(300,80)">
    <rect x="0" y="0" width="118" height="80" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
    <text x="59" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#d97706">③ 神经编码器</text>
    <text x="59" y="38" text-anchor="middle" font-size="10" fill="#475569">RNN/CNN/Transformer</text>
    <text x="59" y="55" text-anchor="middle" font-size="9" fill="#64748b">时频空特征 → 嵌入</text>
    <text x="59" y="68" text-anchor="middle" font-size="9" font-weight="600" fill="#d97706">z ∈ R^d</text>
  </g>
  <line x1="418" y1="120" x2="430" y2="120" stroke="#64748b" stroke-width="1.4" marker-end="url(#a-64748b)"/>

  <g transform="translate(430,80)">
    <rect x="0" y="0" width="118" height="80" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="59" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">④ Beam search</text>
    <text x="59" y="38" text-anchor="middle" font-size="10" fill="#475569">序列束搜索</text>
    <text x="59" y="55" text-anchor="middle" font-size="9" fill="#64748b">候选字符/词集合</text>
    <text x="59" y="68" text-anchor="middle" font-size="9" font-weight="600" fill="#dc2626">CER ~ 25%</text>
  </g>
  <line x1="548" y1="120" x2="560" y2="120" stroke="#64748b" stroke-width="1.4" marker-end="url(#a-64748b)"/>

  <g transform="translate(560,80)">
    <rect x="0" y="0" width="120" height="80" rx="5" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.4"/>
    <text x="60" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#9333ea">⑤ LLM 纠错</text>
    <text x="60" y="38" text-anchor="middle" font-size="10" fill="#475569">语言先验 + prompt</text>
    <text x="60" y="55" text-anchor="middle" font-size="9" fill="#64748b">流畅句子输出</text>
    <text x="60" y="68" text-anchor="middle" font-size="9" font-weight="600" fill="#9333ea">WER 再降 ~ 50%</text>
  </g>

  <!-- Example outputs -->
  <g transform="translate(40,190)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#475569">示例: 想象一句话</text>

    <text x="0" y="20" font-size="10" fill="#64748b">神经原文: "TAR WAHTER BOTEL"</text>
    <text x="170" y="20" font-size="11" fill="#dc2626" font-weight="600">→ raw beam, 25% CER</text>

    <text x="0" y="40" font-size="10" fill="#64748b">LLM 后:  "The water bottle"</text>
    <text x="170" y="40" font-size="11" fill="#9333ea" font-weight="600">→ smooth sentence</text>
  </g>

  <!-- bottom callout -->
  <g transform="translate(40,290)">
    <rect x="0" y="-10" width="640" height="40" rx="4" fill="#eff6ff" stroke="#2563eb"/>
    <text x="20" y="6" font-size="11" font-weight="700" fill="#475569">关键点:</text>
    <text x="80" y="6" font-size="10" fill="#475569">LLM 承担"语言先验", 让神经解码器可以容忍更高的错误率</text>
    <text x="20" y="22" font-size="10" fill="#64748b">远期: 直接神经 → LLM 嵌入 端到端训练, 神经编码器学"大脑皮层活动的潜在表示"</text>
  </g>

</svg>