      <text x="100" y="36" text-anchor="middle" font-size="10" fill="#64748b">国家信息中心</text>
      <text x="100" y="48" text-anchor="middle" font-size="10" fill="#64748b">跨链服务网络</text>
    </g>

    <g transform="translate(0,104)">
