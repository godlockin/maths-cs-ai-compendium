  <rect x="0" y="0" width="700" height="36" fill="#2563eb"/>
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">中国去中心化 AI 生态</text>

  <text x="350" y="56" text-anchor="middle" font-size="11" fill="#64748b">监管驱动 + 行业联盟, 把去中心化 AI 拉回产业落地</text>

  <!-- Three categories: BSN/Chain | Frameworks | Privacy Computing -->

  <!-- Category 1: Blockchain infrastructure -->
  <g transform="translate(40,80)">
    <rect x="0" y="0" width="200" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="100" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">区块链基础设施</text>

    <g transform="translate(0,46)">
