      <text x="100" y="48" text-anchor="middle" font-size="10" fill="#64748b">自主可控联盟链</text>
    </g>

    <g transform="translate(0,162)">
      <rect x="0" y="0" width="200" height="50" rx="3" fill="#fafbfc" stroke="#2563eb"/>
      <text x="100" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">蚂蚁链 / BSN-DDC</text>
      <text x="100" y="36" text-anchor="middle" font-size="10" fill="#64748b">蚂蚁集团</text>
      <text x="100" y="48" text-anchor="middle" font-size="10" fill="#64748b">金融政务场景</text>
    </g>
  </g>

