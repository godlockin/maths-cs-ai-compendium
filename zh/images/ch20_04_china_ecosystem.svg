      <text x="100" y="48" text-anchor="middle" font-size="10" fill="#64748b">K8s / Helm 一键拉起</text>
    </g>

    <g transform="translate(0,162)">
      <rect x="0" y="0" width="200" height="50" rx="3" fill="#fafbfc" stroke="#16a34a"/>
      <text x="100" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">云厂商 PAI/TI 平台</text>
      <text x="100" y="36" text-anchor="middle" font-size="10" fill="#64748b">阿里 / 腾讯 / 华为 / 字节</text>
      <text x="100" y="48" text-anchor="middle" font-size="10" fill="#64748b">集成 FATE 编排</text>
    </g>
  </g>

  <!-- Category 3: Privacy computing -->
