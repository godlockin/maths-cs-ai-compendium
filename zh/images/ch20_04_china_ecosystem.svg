      <text x="100" y="36" text-anchor="middle" font-size="10" fill="#64748b">SecretFlow 开源</text>
      <text x="100" y="48" text-anchor="middle" font-size="10" fill="#64748b">MPC + HE + TEE 三合一</text>
    </g>

    <g transform="translate(0,104)">
      <rect x="0" y="0" width="200" height="50" rx="3" fill="#fafbfc" stroke="#d97706"/>
      <text x="100" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">阿里 瑶光 / 隐语</text>
      <text x="100" y="36" text-anchor="middle" font-size="10" fill="#64748b">PAI 隐私计算插件</text>
      <text x="100" y="48" text-anchor="middle" font-size="10" fill="#64748b">金融联合风控落地</text>
    </g>

    <g transform="translate(0,162)">
      <rect x="0" y="0" width="200" height="50" rx="3" fill="#fafbfc" stroke="#d97706"/>
      <text x="100" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">行业联盟 (WiFi FL)</text>
      <text x="100" y="36" text-anchor="middle" font-size="10" fill="#64748b">互联网金融 / 医联体</text>
      <text x="100" y="48" text-anchor="middle" font-size="10" fill="#64748b">跨机构联合建模</text>
    </g>
  </g>

  <!-- bottom summary -->
  <g transform="translate(40,330)">
    <rect x="0" y="-12" width="620" height="22" rx="3" fill="#eff6ff" stroke="#2563eb"/>
    <text x="310" y="3" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">路径: 公链 → 联盟链, 代币 → 合规, 单打独斗 → 行业联盟</text>
