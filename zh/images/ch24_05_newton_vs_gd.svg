<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
</style>
<rect width="700" height="360" fill="#fafbfc"/>
<defs>
  <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
  <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
  <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
  <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
</defs>
<rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
<text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">一阶 GD vs 二阶 Newton: 椭长山谷里的不同走法</text>

<!-- Left: GD zigzag in narrow valley -->
<g transform="translate(30,60)">
  <text x="160" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">梯度下降 (GD): 之字下降</text>
  <!-- ellipse contours (stretched) -->
  <ellipse cx="160" cy="220" rx="130" ry="14" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="160" cy="220" rx="105" ry="11" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="160" cy="220" rx="80" ry="8" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="160" cy="220" rx="55" ry="6" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="160" cy="220" rx="30" ry="3" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="160" cy="220" r="3" fill="#16a34a"/>
  <text x="170" y="225" font-size="10" fill="#16a34a">x*</text>
  <!-- GD zigzag -->
  <polyline points="36,40 120,80 60,135 130,170 75,200 145,218" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-dc2626)"/>
  <circle cx="36" cy="40" r="3.5" fill="#dc2626"/>
  <text x="20" y="36" font-size="10" fill="#dc2626" font-weight="600">x₀</text>
  <circle cx="120" cy="80" r="3" fill="#dc2626"/>
  <circle cx="60" cy="135" r="3" fill="#dc2626"/>
  <circle cx="130" cy="170" r="3" fill="#dc2626"/>
  <circle cx="75" cy="200" r="3" fill="#dc2626"/>
  <text x="80" y="252" font-size="10" fill="#475569">步长 η 一致 → 曲率大方向走过头</text>
  <text x="80" y="268" font-size="10" fill="#475569">复杂度 O(κ log(1/ε))</text>
</g>

<!-- Right: Newton direct step -->
<g transform="translate(360,60)">
  <text x="160" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">Newton: H⁻¹ 自动按曲率缩放</text>
  <ellipse cx="160" cy="220" rx="130" ry="14" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="160" cy="220" rx="105" ry="11" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="160" cy="220" rx="80" ry="8" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="160" cy="220" rx="55" ry="6" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="160" cy="220" rx="30" ry="3" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="160" cy="220" r="3" fill="#16a34a"/>
  <text x="170" y="225" font-size="10" fill="#16a34a">x*</text>
  <!-- Newton: one big jump to minimum -->
  <line x1="36" y1="50" x2="160" y2="220" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-2563eb)"/>
  <circle cx="36" cy="50" r="4" fill="#2563eb"/>
  <text x="20" y="46" font-size="10" fill="#2563eb" font-weight="600">x₀</text>
  <text x="80" y="252" font-size="10" fill="#475569">一步沿 H⁻¹∇f 方向跨底 (二次模型)</text>
  <text x="80" y="268" font-size="10" fill="#475569">复杂度 O(log log(1/ε)), 与 κ 无关</text>
</g>

<!-- bottom: formula bar -->
<g transform="translate(40,340)">
  <text x="0" y="0" font-size="11" fill="#1e3a8a" font-weight="600">
    Newton = "先圆化再下降": y=H^{1/2}x 把椭球变圆, 圆内 GD 一步到底
  </text>
</g>
</svg>
