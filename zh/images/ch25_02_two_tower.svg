<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="700" height="280" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">双塔模型: 用户塔 + 物品塔, 输出向量点积相似度 (召回阶段)</text>

  <!-- User Tower (left) -->
  <text x="120" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">用户塔 (User Tower)</text>
  <rect x="40" y="80" width="160" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="120" y="102" text-anchor="middle" font-size="11" fill="#1e3a8a">用户特征 (人口属性 + 历史)</text>
  <rect x="60" y="130" width="120" height="32" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="120" y="150" text-anchor="middle" font-size="11" fill="#1e3a8a">DNN 编码</text>
  <polygon points="120,162 105,182 135,182" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="1.5"/>
  <text x="120" y="178" text-anchor="middle" font-size="10" fill="#2563eb" font-weight="700">↓</text>

  <ellipse cx="120" cy="200" rx="50" ry="22" fill="#2563eb"/>
  <text x="120" y="195" text-anchor="middle" font-size="11" font-weight="700" fill="white">u-vec</text>
  <text x="120" y="212" text-anchor="middle" font-size="9" fill="#dbeafe">embedding</text>

  <!-- Item Tower (right) -->
  <text x="580" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">物品塔 (Item Tower)</text>
  <rect x="500" y="80" width="160" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="102" text-anchor="middle" font-size="11" fill="#14532d">物品特征 (类目 + embedding)</text>
  <rect x="520" y="130" width="120" height="32" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="150" text-anchor="middle" font-size="11" fill="#14532d">DNN 编码</text>
  <polygon points="580,162 565,182 595,182" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="178" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="700">↓</text>

  <ellipse cx="580" cy="200" rx="50" ry="22" fill="#16a34a"/>
  <text x="580" y="195" text-anchor="middle" font-size="11" font-weight="700" fill="white">v-vec</text>
  <text x="580" y="212" text-anchor="middle" font-size="9" fill="#dcfce7">embedding</text>

  <!-- Dot product center -->
  <line x1="172" y1="200" x2="290" y2="200" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-64748b)"/>
  <line x1="528" y1="200" x2="410" y2="200" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-64748b)"/>
  <circle cx="350" cy="200" r="34" fill="#9333ea"/>
  <text x="350" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="white">点积</text>
  <text x="350" y="210" text-anchor="middle" font-size="10" fill="#f3e8ff">u · v</text>
  <line x1="350" y1="234" x2="350" y2="248" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-64748b)"/>
  <rect x="290" y="250" width="120" height="22" rx="4" fill="#f1f5f9" stroke="#9333ea" stroke-width="1.5"/>
  <text x="350" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="#9333ea">相似度分数</text>

  <!-- Annotation: 在线推理只算 u, ANN 检索 v -->
  <text x="120" y="248" text-anchor="middle" font-size="9" fill="#64748b">在线只算 u</text>
  <text x="580" y="248" text-anchor="middle" font-size="9" fill="#64748b">v 离线预算, 存向量库</text>
</svg>