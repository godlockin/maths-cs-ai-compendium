<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }</style>
  <rect width="720" height="360" fill="#fafbfc"/>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">BERTScore 与 BLEU 在同义替换下的对比</text>
  <text x="360" y="58" text-anchor="middle" font-size="11" fill="#64748b">BERTScore 保住语义相似度, BLEU 因 n-gram 崩塌</text>

  <!-- Reference sentence -->
  <rect x="40" y="78" width="640" height="42" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="50" y="95" font-size="10.5" fill="#64748b">Reference (参考):</text>
  <text x="140" y="113" font-size="14" font-weight="600" fill="#1e293b">小猫在垫子上</text>

  <!-- Candidate -->
  <rect x="40" y="135" width="640" height="42" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="50" y="152" font-size="10.5" fill="#64748b">Candidate (候选):</text>
  <text x="140" y="170" font-size="14" font-weight="600" fill="#1e293b">猫咪坐在毯子上</text>

  <!-- BERTScore panel -->
  <rect x="40" y="195" width="300" height="135" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="40" y="195" width="300" height="30" rx="8" fill="#16a34a"/>
  <rect x="40" y="217" width="300" height="8" fill="#16a34a"/>
  <text x="190" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="white">BERTScore (语义相似)</text>
  <text x="190" y="252" text-anchor="middle" font-size="32" font-weight="700" fill="#16a34a">F = 0.92</text>
  <text x="60" y="278" font-size="11" fill="#334155">· 用 BERT 表示空间算余弦相似</text>
  <text x="60" y="296" font-size="11" fill="#334155">· 抓住同义替换 / 语序变化</text>
  <text x="60" y="314" font-size="11" fill="#334155">· 代价: 相似 ≠ 事实正确</text>

  <!-- BLEU panel -->
  <rect x="380" y="195" width="300" height="135" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="380" y="195" width="300" height="30" rx="8" fill="#dc2626"/>
  <rect x="380" y="217" width="300" height="8" fill="#dc2626"/>
  <text x="530" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="white">BLEU-4 (n-gram 匹配)</text>
  <text x="530" y="252" text-anchor="middle" font-size="32" font-weight="700" fill="#dc2626">≈ 0.00</text>
  <text x="400" y="278" font-size="11" fill="#334155">· 看 1/2/3/4-gram 表面匹配</text>
  <text x="400" y="296" font-size="11" fill="#334155">· 同义改写 → 0 重叠</text>
  <text x="400" y="314" font-size="11" fill="#334155">· 代价: 惩罚合理释义</text>

  <text x="360" y="350" text-anchor="middle" font-size="10.5" fill="#475569" font-style="italic">关键结论: BLEU 5.0 → 25.0 在 MT 上是进步; 跨任务搬到摘要/对话就是灾难</text>
</svg>
