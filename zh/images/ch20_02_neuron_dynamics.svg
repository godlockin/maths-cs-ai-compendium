<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="280" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
    <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
    <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">生物神经元的膜电位动力学 (LIF)</text>

  <!-- Voltage trace -->
  <g transform="translate(60,80)">
    <!-- threshold line -->
    <line x1="0" y1="-40" x2="620" y2="-40" stroke="#dc2626" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="624" y="-42" font-size="10" fill="#dc2626">V_th</text>
    <!-- rest line -->
    <line x1="0" y1="60" x2="620" y2="60" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="624" y="62" font-size="10" fill="#16a34a">V_rest</text>
    <!-- integration curve -->
    <path d="M 0,60 Q 40,58 80,40 Q 120,15 160,5 L 200,-40 L 220,60 Q 260,30 320,-15 L 360,-40 L 380,60 Q 420,40 480,5 L 520,-40 L 540,60 L 620,60"
          fill="none" stroke="#2563eb" stroke-width="1.6"/>

    <!-- spikes -->
    <line x1="200" y1="-40" x2="200" y2="-70" stroke="#dc2626" stroke-width="2" marker-end="url(#a-dc2626)"/>
    <line x1="360" y1="-40" x2="360" y2="-70" stroke="#dc2626" stroke-width="2" marker-end="url(#a-dc2626)"/>
    <line x1="520" y1="-40" x2="520" y2="-70" stroke="#dc2626" stroke-width="2" marker-end="url(#a-dc2626)"/>

    <!-- arrows -->
    <text x="100" y="20" font-size="10" fill="#16a34a">积分上升</text>
    <text x="430" y="-10" font-size="10" fill="#dc2626">超出阈值 → spike</text>

    <line x1="0" y1="100" x2="620" y2="100" stroke="#94a3b8" stroke-width="1"/>
    <text x="0" y="115" font-size="10" fill="#64748b">0</text>
    <text x="155" y="115" font-size="10" fill="#64748b">t</text>
    <text x="620" y="115" text-anchor="end" font-size="10" fill="#64748b">时间</text>
  </g>

  <!-- bottom: input arrow flow -->
  <g transform="translate(60,235)">
    <rect x="0" y="-2" width="100" height="20" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="50" y="13" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">突触输入 I</text>
    <line x1="100" y1="8" x2="160" y2="8" stroke="#64748b" stroke-width="1.4" marker-end="url(#a-64748b)"/>
    <text x="130" y="2" font-size="10" fill="#64748b">电流</text>

    <rect x="160" y="-2" width="140" height="20" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="230" y="13" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">V 积分膜电位</text>
    <line x1="300" y1="8" x2="360" y2="8" stroke="#64748b" stroke-width="1.4" marker-end="url(#a-64748b)"/>
    <text x="330" y="2" font-size="10" fill="#64748b">↑</text>

    <rect x="360" y="-2" width="120" height="20" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="420" y="13" text-anchor="middle" font-size="11" font-weight="600" fill="#16a34a">触发 spike</text>
    <line x1="480" y1="8" x2="540" y2="8" stroke="#64748b" stroke-width="1.4" marker-end="url(#a-64748b)"/>

    <rect x="540" y="-2" width="120" height="20" rx="4" fill="#fafbfc" stroke="#475569"/>
    <text x="600" y="13" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">重置 (V→rest)</text>
  </g>

</svg>