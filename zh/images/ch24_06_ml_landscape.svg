<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
</style>
<rect width="700" height="380" fill="#fafbfc"/>
<defs>
  <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
  <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
  <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
  <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
</defs>
<rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
<text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">凸约束优化在 ML 的落点</text>

<!-- Two columns: classical ML and modern ML -->
<!-- Classical -->
<text x="180" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">经典 ML 凸优化</text>

<g transform="translate(40,72)">
  <rect x="0" y="0" width="280" height="68" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="14" y="20" font-size="12" font-weight="700" fill="#2563eb">LASSO / Group-LASSO</text>
  <text x="14" y="36" font-size="10" fill="#1e3a8a">min ‖Ax−b‖² + λ‖x‖₁</text>
  <text x="14" y="50" font-size="10" fill="#475569">解法: ISTA / FISTA / ADMM / CD</text>
</g>

<g transform="translate(40,150)">
  <rect x="0" y="0" width="280" height="68" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="14" y="20" font-size="12" font-weight="700" fill="#16a34a">SVM (soft-margin)</text>
  <text x="14" y="36" font-size="10" fill="#14532d">QP: min ½‖w‖² + CΣξᵢ</text>
  <text x="14" y="50" font-size="10" fill="#475569">解法: SMO / 内点法 / ADMM</text>
</g>

<g transform="translate(40,228)">
  <rect x="0" y="0" width="280" height="68" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="14" y="20" font-size="12" font-weight="700" fill="#d97706">Portfolio Optimization</text>
  <text x="14" y="36" font-size="10" fill="#78350f">max μᵀw − γwᵀΣw,  1ᵀw=1, w≥0</text>
  <text x="14" y="50" font-size="10" fill="#475569">QP / SOCP (chance constraint)</text>
</g>

<!-- Modern ML -->
<text x="520" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">现代 ML 凸松绑</text>

<g transform="translate(380,72)">
  <rect x="0" y="0" width="280" height="68" rx="6" fill="#fce7f3" stroke="#db2777"/>
  <text x="14" y="20" font-size="12" font-weight="700" fill="#db2777">NN Verification</text>
  <text x="14" y="36" font-size="10" fill="#831843">‖x−x₀‖∞ ≤ ε ⇒ 类别恒最大</text>
  <text x="14" y="50" font-size="10" fill="#475569">LP relaxation 给出保守证书</text>
</g>

<g transform="translate(380,150)">
  <rect x="0" y="0" width="280" height="68" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="14" y="20" font-size="12" font-weight="700" fill="#9333ea">Adversarial / 鲁棒训练</text>
  <text x="14" y="36" font-size="10" fill="#581c87">SDP 松弛计算输出对扰动 bound</text>
  <text x="14" y="50" font-size="10" fill="#475569">Raghunathan 2018</text>
</g>

<g transform="translate(380,228)">
  <rect x="0" y="0" width="280" height="68" rx="6" fill="#cffafe" stroke="#0891b2"/>
  <text x="14" y="20" font-size="12" font-weight="700" fill="#0891b2">Phase Retrieval / Max-Cut</text>
  <text x="14" y="36" font-size="10" fill="#164e63">SDP 松弛 + 随机超平面舍入</text>
  <text x="14" y="50" font-size="10" fill="#475569">Goemans-Williamson 0.878 近似</text>
</g>

<!-- bottom: CVXPY -->
<g transform="translate(40,310)">
  <rect x="0" y="0" width="620" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="14" y="20" font-size="11" font-weight="700" fill="#1e293b">怎么落地?</text>
  <text x="14" y="38" font-size="10" fill="#475569">中小规模 (CVXPY 一行建模): 后端 ECOS / MOSEK / SCS   ·   LP/QP 大规模: Gurobi / CPLEX   ·   ADMM: 联邦 / 分布式 LASSO</text>
  <text x="14" y="52" font-size="10" fill="#475569">凸优化 = 唯一能"硬保证"找到全局最优的问题类; 非凸 NN 一旦可写成凸松绑, 立刻拿到安全证书</text>
</g>
</svg>
