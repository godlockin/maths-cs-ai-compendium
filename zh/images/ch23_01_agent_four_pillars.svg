<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style> text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; } </style>
<rect width="720" height="360" fill="#fafbfc"/>
<defs>
  <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
</defs>

<!-- 顶部 Banner -->
<rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
<text x="360" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="white">LLM Agent 四要素结构图</text>

<!-- 中心 LLM 大脑 -->
<rect x="280" y="160" width="160" height="60" rx="30" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2"/>
<text x="360" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">LLM 大脑</text>
<text x="360" y="206" text-anchor="middle" font-size="10" fill="#475569">推理 · 决策 · 生成</text>

<!-- 四个要素：上=工具  下=记忆  左=规划  右=感知 (略) -->
<!-- 工具 (顶) -->
<rect x="280" y="60" width="160" height="60" rx="8" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.5"/>
<text x="360" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">工具 Tools</text>
<text x="360" y="105" text-anchor="middle" font-size="10" fill="#475569">搜索 · 代码 · API · 邮件</text>
<line x1="360" y1="120" x2="360" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>

<!-- 规划 (左) -->
<rect x="60" y="160" width="160" height="60" rx="8" fill="#9333ea" fill-opacity="0.12" stroke="#9333ea" stroke-width="1.5"/>
<text x="140" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#9333ea">规划 Planning</text>
<text x="140" y="205" text-anchor="middle" font-size="10" fill="#475569">拆解 · 子任务 · 回溯</text>
<line x1="220" y1="190" x2="280" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>

<!-- 记忆 (右) -->
<rect x="500" y="160" width="160" height="60" rx="8" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.5"/>
<text x="580" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">记忆 Memory</text>
<text x="580" y="205" text-anchor="middle" font-size="10" fill="#475569">短期 · 长期 · 向量 DB</text>
<line x1="440" y1="190" x2="500" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>

<!-- 环境反馈 (底) -->
<rect x="280" y="270" width="160" height="60" rx="8" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.5"/>
<text x="360" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#0891b2">环境 Environment</text>
<text x="360" y="315" text-anchor="middle" font-size="10" fill="#475569">观察 obs · 状态 s · 奖励 r</text>
<line x1="360" y1="220" x2="360" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#a-64748b)"/>

<!-- 底部说明 -->
<text x="360" y="350" text-anchor="middle" font-size="10" fill="#94a3b8">MDP 框架: 状态 → 行动 → 奖励 闭环</text>
</svg>
