<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style> text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; } </style>
<rect width="720" height="380" fill="#fafbfc"/>
<defs>
  <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
</defs>

<!-- 顶部 Banner -->
<rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
<text x="360" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="white">Computer Use 循环: 截图 → VLM → 坐标 → 执行 → 新截图</text>

<!-- 五个步骤 (上排) -->
<g font-size="11" font-weight="700" text-anchor="middle">
  <g>
    <rect x="40" y="70" width="120" height="64" rx="6" fill="#0891b2" fill-opacity="0.12" stroke="#0891b2" stroke-width="1.5"/>
    <text x="100" y="92" fill="#0891b2">① 截图</text>
    <text x="100" y="110" font-size="9" font-weight="400" fill="#475569">Screenshot</text>
    <text x="100" y="124" font-size="9" font-weight="400" fill="#64748b">1280×800 png</text>
  </g>
  <g>
    <rect x="180" y="70" width="120" height="64" rx="6" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
    <text x="240" y="92" fill="#2563eb">② VLM 推理</text>
    <text x="240" y="110" font-size="9" font-weight="400" fill="#475569">Claude / GPT-4V</text>
    <text x="240" y="124" font-size="9" font-weight="400" fill="#64748b">看图 → 决策</text>
  </g>
  <g>
    <rect x="320" y="70" width="120" height="64" rx="6" fill="#9333ea" fill-opacity="0.12" stroke="#9333ea" stroke-width="1.5"/>
    <text x="380" y="92" fill="#9333ea">③ 输出坐标</text>
    <text x="380" y="110" font-size="9" font-weight="400" fill="#475569">(x, y, button)</text>
    <text x="380" y="124" font-size="9" font-weight="400" fill="#64748b">type / click / key</text>
  </g>
  <g>
    <rect x="460" y="70" width="120" height="64" rx="6" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.5"/>
    <text x="520" y="92" fill="#d97706">④ 执行动作</text>
    <text x="520" y="110" font-size="9" font-weight="400" fill="#475569">OS driver</text>
    <text x="520" y="124" font-size="9" font-weight="400" fill="#64748b">pyautogui / xdotool</text>
  </g>
  <g>
    <rect x="600" y="70" width="100" height="64" rx="6" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1.5"/>
    <text x="650" y="92" fill="#16a34a">⑤ 新截图</text>
    <text x="650" y="110" font-size="9" font-weight="400" fill="#475569">Observe</text>
    <text x="650" y="124" font-size="9" font-weight="400" fill="#64748b">回到 ①</text>
  </g>
</g>

<!-- 横向箭头 -->
<g stroke="#64748b" stroke-width="1.5">
  <line x1="160" y1="102" x2="178" y2="102" marker-end="url(#a-64748b)"/>
  <line x1="300" y1="102" x2="318" y2="102" marker-end="url(#a-64748b)"/>
  <line x1="440" y1="102" x2="458" y2="102" marker-end="url(#a-64748b)"/>
  <line x1="580" y1="102" x2="598" y2="102" marker-end="url(#a-64748b)"/>
</g>

<!-- 循环回到底部 -->
<path d="M650 134 L650 165 L100 165 L100 134" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a-64748b)"/>
<text x="375" y="180" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">循环 (ReAct: Thought → Action → Observation)</text>

<!-- 底部: action 协议示意 (JSON) -->
<g transform="translate(40,200)">
  <rect x="0" y="0" width="640" height="80" rx="6" fill="#1e293b"/>
  <text x="14" y="20" font-size="10" font-weight="700" fill="#94a3b8"># 一次 tool_call (Claude 风格)</text>
  <text x="14" y="38" font-size="10" font-family="monospace" fill="#f8fafc">{</text>
  <text x="28" y="52" font-size="10" font-family="monospace" fill="#fcd34d">"type": "tool_use", "name": "computer",</text>
  <text x="28" y="66" font-size="10" font-family="monospace" fill="#fcd34d">"input": {"action": "left_click", "coordinate": [840, 522]}</text>
  <text x="14" y="78" font-size="10" font-family="monospace" fill="#f8fafc">}</text>
</g>

<!-- 真实短板 -->
<rect x="40" y="295" width="640" height="68" rx="6" fill="#fef2f2" stroke="#dc2626"/>
<text x="60" y="316" font-size="12" font-weight="700" fill="#7f1d1d">Computer Use 三个真实短板</text>
<text x="60" y="334" font-size="10" fill="#475569">① 视觉分辨率 ↓ (1280×800 看不清小字) · ② 鼠标坐标回归天然不精</text>
<text x="60" y="350" font-size="10" fill="#475569">③ 桌面异步事件歧义 (弹窗 / 通知 / 下载完成) → 需要 wait_for_state 原语</text>
</svg>
