<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
</style>
<rect width="700" height="320" fill="#fafbfc"/>
<defs>
  <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
  <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
  <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
  <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
</defs>
<rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
<text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">IEEE 754 浮点格式对比: FP32 / FP16 / BF16 / FP8</text>

<!-- Header legend -->
<g transform="translate(60,60)">
  <text x="0" y="14" font-size="11" fill="#475569">格式</text>
  <text x="120" y="14" font-size="11" fill="#475569">总位</text>
  <!-- field labels -->
  <rect x="180" y="2" width="20" height="16" fill="#dc2626" rx="2"/>
  <text x="190" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="white">s</text>
  <rect x="200" y="2" width="60" height="16" fill="#d97706" rx="2"/>
  <text x="230" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="white">exponent</text>
  <rect x="260" y="2" width="120" height="16" fill="#2563eb" rx="2"/>
  <text x="320" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="white">mantissa (fraction)</text>
</g>

<!-- Row template: 32 bits => scale x=20 per bit? Use 580 width minus 60 start -->
<!-- Scale: 1 bit = 14px wide starting at x=200; total bits wrap -->

<!-- FP32: 1+8+23 = 32 bits -->
<g transform="translate(40,100)">
  <text x="0" y="14" font-size="12" font-weight="700" fill="#2563eb">FP32</text>
  <text x="80" y="14" font-size="11" fill="#475569">32 位</text>
  <!-- 1 sign -->
  <rect x="140" y="2" width="14" height="20" fill="#dc2626" stroke="#fff" stroke-width="1"/>
  <!-- 8 exp -->
  <rect x="154" y="2" width="112" height="20" fill="#d97706" stroke="#fff" stroke-width="1"/>
  <text x="210" y="16" text-anchor="middle" font-size="9" fill="white">8 (exp)</text>
  <!-- 23 mantissa -->
  <rect x="266" y="2" width="322" height="20" fill="#2563eb" stroke="#fff" stroke-width="1"/>
  <text x="427" y="16" text-anchor="middle" font-size="9" fill="white">23 (mantissa)</text>
  <text x="610" y="16" font-size="10" fill="#16a34a" font-weight="600">≈ 7 位精度</text>
</g>

<!-- FP16: 1+5+10 = 16 bits -->
<g transform="translate(40,140)">
  <text x="0" y="14" font-size="12" font-weight="700" fill="#9333ea">FP16</text>
  <text x="80" y="14" font-size="11" fill="#475569">16 位</text>
  <rect x="140" y="2" width="14" height="20" fill="#dc2626" stroke="#fff" stroke-width="1"/>
  <rect x="154" y="2" width="70" height="20" fill="#d97706" stroke="#fff" stroke-width="1"/>
  <text x="189" y="16" text-anchor="middle" font-size="9" fill="white">5 (exp)</text>
  <rect x="224" y="2" width="140" height="20" fill="#2563eb" stroke="#fff" stroke-width="1"/>
  <text x="294" y="16" text-anchor="middle" font-size="9" fill="white">10 (mantissa)</text>
  <text x="610" y="16" font-size="10" fill="#d97706" font-weight="600">≈ 3-4 位精度, 范围 ~6.5e4</text>
</g>

<!-- BF16: 1+8+7 = 16 bits -->
<g transform="translate(40,180)">
  <text x="0" y="14" font-size="12" font-weight="700" fill="#16a34a">BF16</text>
  <text x="80" y="14" font-size="11" fill="#475569">16 位</text>
  <rect x="140" y="2" width="14" height="20" fill="#dc2626" stroke="#fff" stroke-width="1"/>
  <rect x="154" y="2" width="112" height="20" fill="#d97706" stroke="#fff" stroke-width="1"/>
  <text x="210" y="16" text-anchor="middle" font-size="9" fill="white">8 (exp)</text>
  <rect x="266" y="2" width="98" height="20" fill="#2563eb" stroke="#fff" stroke-width="1"/>
  <text x="315" y="16" text-anchor="middle" font-size="9" fill="white">7 (mantissa)</text>
  <text x="610" y="16" font-size="10" fill="#16a34a" font-weight="600">≈ 2-3 位精度, 范围 ~10^38</text>
</g>

<!-- FP8 E4M3: 1+4+3 = 8 bits -->
<g transform="translate(40,220)">
  <text x="0" y="14" font-size="12" font-weight="700" fill="#d97706">FP8 E4M3</text>
  <text x="80" y="14" font-size="11" fill="#475569">8 位</text>
  <rect x="140" y="2" width="14" height="20" fill="#dc2626" stroke="#fff" stroke-width="1"/>
  <rect x="154" y="2" width="56" height="20" fill="#d97706" stroke="#fff" stroke-width="1"/>
  <text x="182" y="16" text-anchor="middle" font-size="9" fill="white">4</text>
  <rect x="210" y="2" width="42" height="20" fill="#2563eb" stroke="#fff" stroke-width="1"/>
  <text x="231" y="16" text-anchor="middle" font-size="9" fill="white">3</text>
  <text x="610" y="16" font-size="10" fill="#d97706" font-weight="600">前向/权重: 较高精度</text>
</g>

<!-- FP8 E5M2: 1+5+2 = 8 bits -->
<g transform="translate(40,260)">
  <text x="0" y="14" font-size="12" font-weight="700" fill="#dc2626">FP8 E5M2</text>
  <text x="80" y="14" font-size="11" fill="#475569">8 位</text>
  <rect x="140" y="2" width="14" height="20" fill="#dc2626" stroke="#fff" stroke-width="1"/>
  <rect x="154" y="2" width="70" height="20" fill="#d97706" stroke="#fff" stroke-width="1"/>
  <text x="189" y="16" text-anchor="middle" font-size="9" fill="white">5</text>
  <rect x="224" y="2" width="28" height="20" fill="#2563eb" stroke="#fff" stroke-width="1"/>
  <text x="238" y="16" text-anchor="middle" font-size="9" fill="white">2</text>
  <text x="610" y="16" font-size="10" fill="#dc2626" font-weight="600">梯度: 更大范围 (~5.7e4)</text>
</g>

<!-- bottom note -->
<g transform="translate(40,300)">
  <text x="0" y="0" font-size="10" fill="#475569">关键观察: BF16 与 FP32 阶码位数相同 (8), 故保留动态范围; FP8 双格式 (E4M3/E5M2) 分别优化精度与范围, 共同支撑 H100 Transformer Engine</text>
</g>
</svg>
