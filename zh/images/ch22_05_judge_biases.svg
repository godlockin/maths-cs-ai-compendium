<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }</style>
  <rect width="720" height="460" fill="#fafbfc"/>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">LLM-as-Judge 五大偏差与校正方法对照</text>
  <text x="360" y="58" text-anchor="middle" font-size="11" fill="#64748b">position / verbosity / self / family / phrasing · 量级均有实证支撑</text>

  <!-- 5 rows -->
  <g>
    <!-- 1. Position -->
    <rect x="30" y="80" width="660" height="60" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <rect x="30" y="80" width="22" height="60" rx="8" fill="#dc2626"/>
    <rect x="30" y="80" width="22" height="60" fill="#dc2626"/>
    <text x="41" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="white">1</text>
    <text x="70" y="100" font-size="12" font-weight="700" fill="#dc2626">位置偏差 (position bias)</text>
    <text x="70" y="118" font-size="10.5" fill="#475569">判分倾向第一个 candidate, 因为 prompt 顺序而非真实质量</text>
    <text x="70" y="132" font-size="10" fill="#16a34a" font-weight="600">校正: 双向 swap-and-average, 同一对局 AB / BA 各跑一次</text>

    <!-- 2. Verbosity -->
    <rect x="30" y="148" width="660" height="60" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.2"/>
    <rect x="30" y="148" width="22" height="60" rx="8" fill="#9333ea"/>
    <text x="41" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="white">2</text>
    <text x="70" y="168" font-size="12" font-weight="700" fill="#9333ea">长度偏差 (verbosity bias)</text>
    <text x="70" y="186" font-size="10.5" fill="#475569">300 词回答比 100 词的更易被判 "好", 与质量无关</text>
    <text x="70" y="200" font-size="10" fill="#16a34a" font-weight="600">校正: LC-AlpacaEval · θ_a − θ_b + γ(ℓ_a−ℓ_b) · Spearman 0.94→0.98</text>

    <!-- 3. Self -->
    <rect x="30" y="216" width="660" height="60" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
    <rect x="30" y="216" width="22" height="60" rx="8" fill="#d97706"/>
    <text x="41" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="white">3</text>
    <text x="70" y="236" font-size="12" font-weight="700" fill="#d97706">自评偏差 (self-bias)</text>
    <text x="70" y="254" font-size="10.5" fill="#475569">GPT-4 评 GPT-4 胜率高 10-15%, Claude 评 Claude 高 8-12%</text>
    <text x="70" y="268" font-size="10" fill="#16a34a" font-weight="600">校正: 跨家族 judge + 多 jury 集成 + 剥离模型口癖 (Certainly! / Here's a...)</text>

    <!-- 4. Family -->
    <rect x="30" y="284" width="660" height="60" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.2"/>
    <rect x="30" y="284" width="22" height="60" rx="8" fill="#0891b2"/>
    <text x="41" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="white">4</text>
    <text x="70" y="304" font-size="12" font-weight="700" fill="#0891b2">家族偏差 (family bias)</text>
    <text x="70" y="322" font-size="10.5" fill="#475569">GPT-4 不只偏爱自身, 偏爱整个 OpenAI 家族 (GPT-3.5 胜率 +18pp)</text>
    <text x="70" y="336" font-size="10" fill="#16a34a" font-weight="600">校正: 异家族 judge + 集成 GPT / Claude / Gemini / 开源各家族</text>

    <!-- 5. Phrasing -->
    <rect x="30" y="352" width="660" height="60" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <rect x="30" y="352" width="22" height="60" rx="8" fill="#64748b"/>
    <text x="41" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="white">5</text>
    <text x="70" y="372" font-size="12" font-weight="700" fill="#64748b">措辞敏感 (phrasing sensitivity)</text>
    <text x="70" y="390" font-size="10.5" fill="#475569">"please rate" → "please carefully evaluate", 平均分能变 0.5+</text>
    <text x="70" y="404" font-size="10" fill="#16a34a" font-weight="600">校正: 锁定 prompt 版本, 不再变动 · leaderboard 注明 prompt &amp; model 版本</text>
  </g>

  <text x="360" y="438" text-anchor="middle" font-size="10.5" fill="#475569" font-style="italic">前 3 项必须处理 · 后 2 项做好文档记录 — 它们都有公开实证数字</text>
</svg>
