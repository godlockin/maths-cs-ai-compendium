<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
</style>
<rect width="700" height="360" fill="#fafbfc"/>
<defs>
  <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
  <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
  <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
  <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
  <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
</defs>
<rect x="0" y="0" width="700" height="36" fill="#2563eb" rx="0"/>
<text x="350" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">Fenchel 共轭: 切线截距构成 f*(y)</text>

<!-- Left: f(x) = 0.5 x^2 with several supporting lines -->
<g transform="translate(30,60)">
  <text x="160" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">f(x) = ½ x² 与若干切线</text>
  <!-- axes -->
  <line x1="20" y1="20" x2="20" y2="240" stroke="#475569" stroke-width="1.2" marker-end="url(#a-64748b)"/>
  <line x1="20" y1="240" x2="320" y2="240" stroke="#475569" stroke-width="1.2" marker-end="url(#a-64748b)"/>
  <text x="14" y="22" text-anchor="end" font-size="10" fill="#475569">f</text>
  <text x="320" y="255" text-anchor="end" font-size="10" fill="#475569">x</text>
  <!-- parabola: x from -2 to 2, scale 60 per unit; f=0.5*x² -->
  <path d="M 20 240 Q 100 240 140 120 Q 200 240 320 240" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="180" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">f(x)=½x²</text>
  <!-- supporting lines: at x = -1.5, -0.7, 0.7, 1.5 -> slope = x -->
  <line x1="20" y1="135" x2="320" y2="425" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3" opacity="0"/>
  <!-- line at x=-1.5, slope -1.5, intercept: 0.5*2.25 - (-1.5)*(-1.5) = 1.125 - 2.25 = -1.125? Actually f*(y) = 0.5 y²; here y=slope=-1.5 → f*=1.125; intercept = -f*/slope? Let me just draw 3 lines -->
  <!-- tangent at x=-1.5: slope -1.5, passes through (140,135), y_int when x=0: 135 + 1.5*140 = 345 → out of range; intercept formula intercept = -f*(slope) when line is y = s·x - f*(s) -->
  <!-- line: y = -1.5 x + (-1.5)(-1.5 - (-1.5)) ... use slope=-1.5, intercept=-1.125; endpoints: (-3,-1.125+4.5=3.375), (3,-1.125-4.5=-5.625) -->
  <line x1="-20" y1="186" x2="380" y2="-286" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="-20" y1="186" x2="380" y2="-286" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3" transform="translate(80,0)"/>
  <!-- Three supporting lines at x_t = -1, 0, 1 (slopes -1, 0, 1) -->
  <line x1="20" y1="120" x2="320" y2="360" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="20" y1="180" x2="320" y2="180" stroke="#9333ea" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="20" y1="60" x2="320" y2="-120" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4,3"/>
  <!-- tangent points -->
  <circle cx="80" cy="180" r="3.5" fill="#dc2626"/>
  <circle cx="200" cy="180" r="3.5" fill="#9333ea"/>
  <circle cx="320" cy="180" r="3.5" fill="#16a34a"/>
  <text x="80" y="196" text-anchor="middle" font-size="9" fill="#dc2626">斜率 y₁</text>
  <text x="200" y="172" text-anchor="middle" font-size="9" fill="#9333ea">y₂=0</text>
  <text x="320" y="76" text-anchor="middle" font-size="9" fill="#16a34a">斜率 y₃</text>
  <text x="160" y="278" text-anchor="middle" font-size="9" fill="#475569">每条切线 = 仿射下确界 = y·x − f*(y)</text>
</g>

<!-- Right: f*(y) = 0.5 y² -->
<g transform="translate(380,60)">
  <text x="160" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#d97706">f*(y) = ½ y² (共轭函数)</text>
  <line x1="20" y1="20" x2="20" y2="240" stroke="#475569" stroke-width="1.2" marker-end="url(#a-64748b)"/>
  <line x1="20" y1="240" x2="320" y2="240" stroke="#475569" stroke-width="1.2" marker-end="url(#a-64748b)"/>
  <text x="14" y="22" text-anchor="end" font-size="10" fill="#475569">f*</text>
  <text x="320" y="255" text-anchor="end" font-size="10" fill="#475569">y</text>
  <!-- f*(y) parabola -->
  <path d="M 20 240 Q 100 240 140 120 Q 200 240 320 240" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <text x="180" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#d97706">f*(y)=½y²</text>
  <!-- points (y, f*(y)) corresponding to tangents -->
  <circle cx="80" cy="225" r="3.5" fill="#dc2626"/>
  <circle cx="200" cy="240" r="3.5" fill="#9333ea"/>
  <circle cx="320" cy="225" r="3.5" fill="#16a34a"/>
  <text x="80" y="216" text-anchor="middle" font-size="9" fill="#dc2626">f*(y₁)=½</text>
  <text x="200" y="232" text-anchor="middle" font-size="9" fill="#9333ea">f*(0)=0</text>
  <text x="320" y="216" text-anchor="middle" font-size="9" fill="#16a34a">f*(y₃)=½</text>
</g>

<!-- Bottom: Fenchel-Young -->
<g transform="translate(40,290)">
  <rect x="0" y="0" width="620" height="56" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="14" y="20" font-size="11" font-weight="700" fill="#92400e">f*(y) = sup_x [ y·x − f(x) ]   (Fenchel 共轭定义)</text>
  <text x="14" y="38" font-size="10" fill="#1e293b">Fenchel-Young 不等式: f(x) + f*(y) ≥ x·y, 等号 ⟺ y ∈ ∂f(x)</text>
  <text x="14" y="52" font-size="10" fill="#475569">DL 应用: Sinkhorn = Wasserstein 的 Fenchel 对偶; ELBO = Jensen 不等式 = 凸共轭</text>
</g>
</svg>
