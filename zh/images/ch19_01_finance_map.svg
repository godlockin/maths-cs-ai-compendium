<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="280" fill="#fafbfc"/>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="white">AI 在金融: 整体场景地图</text>

  <!-- Center: 金融场景 -->
  <circle cx="360" cy="155" r="50" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">金融 AI</text>
  <text x="360" y="166" text-anchor="middle" font-size="9" fill="#475569">全场景</text>

  <!-- 6 satellite domains around center -->

  <!-- 1. 风控 / 反欺诈 (top-left) -->
  <rect x="40" y="60" width="180" height="50" rx="5" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="1.5"/>
  <text x="130" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">风控 / 反欺诈</text>
  <text x="130" y="96" text-anchor="middle" font-size="9" fill="#475569">孤立森林 · GCN · GraphSAGE</text>
  <line x1="200" y1="105" x2="316" y2="135" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- 2. 高频交易 / 量化 (top-right) -->
  <rect x="500" y="60" width="180" height="50" rx="5" fill="#d97706" fill-opacity="0.10" stroke="#d97706" stroke-width="1.5"/>
  <text x="590" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">量化交易</text>
  <text x="590" y="96" text-anchor="middle" font-size="9" fill="#475569">LSTM 时序 · RL · 信号挖掘</text>
  <line x1="520" y1="105" x2="406" y2="135" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- 3. 信贷 / 信用评分 (left) -->
  <rect x="20" y="135" width="180" height="50" rx="5" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="1.5"/>
  <text x="110" y="155" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">信贷 / 信用评分</text>
  <text x="110" y="171" text-anchor="middle" font-size="9" fill="#475569">XGBoost · LightGBM · 图特征</text>
  <line x1="200" y1="160" x2="310" y2="155" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- 4. 投资顾问 / Robo-Advisor (right) -->
  <rect x="520" y="135" width="180" height="50" rx="5" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
  <text x="610" y="155" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">智能投顾</text>
  <text x="610" y="171" text-anchor="middle" font-size="9" fill="#475569">Portfolio · 风险匹配</text>
  <line x1="520" y1="160" x2="410" y2="158" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- 5. NLP / 金融大模型 (bottom-left) -->
  <rect x="40" y="210" width="240" height="50" rx="5" fill="#9333ea" fill-opacity="0.10" stroke="#9333ea" stroke-width="1.5"/>
  <text x="160" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#7e22ce">NLP 与 金融大模型</text>
  <text x="160" y="246" text-anchor="middle" font-size="9" fill="#475569">BloombergGPT · FinGPT · 情感分析</text>
  <line x1="220" y1="210" x2="335" y2="200" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- 6. 监管科技 RegTech (bottom-right) -->
  <rect x="440" y="210" width="260" height="50" rx="5" fill="#0891b2" fill-opacity="0.10" stroke="#0891b2" stroke-width="1.5"/>
  <text x="570" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#0891b2">监管科技 RegTech</text>
  <text x="570" y="246" text-anchor="middle" font-size="9" fill="#475569">反洗钱 AML · 合规 KYC · 实时流</text>
  <line x1="500" y1="210" x2="385" y2="200" stroke="#0891b2" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Bottom legend -->
  <text x="360" y="276" text-anchor="middle" font-size="10" fill="#475569">六大场景: 风控 / 量化 / 信贷 / 投顾 / NLP / 监管 — 围绕统一金融数据基础设施</text>
</svg>
