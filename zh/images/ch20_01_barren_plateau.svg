<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
<style>
  text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }
</style>
<rect width="720" height="320" fill="#fafbfc"/>
  <defs>
    <marker id="a-64748b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a-2563eb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="a-16a34a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a-dc2626" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a-9333ea" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
    <marker id="a-d97706" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="a-0891b2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/></marker>
    <marker id="a-db2777" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">Barren plateau 示意</text>

  <!-- LEFT panel: shallow landscape (n=2 qubits, has minima) -->
  <g transform="translate(70,80)">
    <text x="120" y="-10" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">浅电路 (n 小)</text>
    <!-- axes -->
    <line x1="0" y1="180" x2="240" y2="180" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="180" stroke="#94a3b8" stroke-width="1"/>
    <!-- loss surface (wavy) -->
    <path d="M 0,80 Q 30,20 60,80 Q 90,140 120,80 Q 150,20 180,80 Q 210,140 240,80" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <!-- minimum -->
    <circle cx="60" cy="80" r="3.5" fill="#dc2626"/>
    <circle cx="180" cy="80" r="3.5" fill="#dc2626"/>
    <text x="240" y="195" text-anchor="end" font-size="10" fill="#64748b">参数方向 θ₁</text>
    <text x="-6" y="10" text-anchor="end" font-size="10" fill="#64748b">L(θ)</text>
    <text x="120" y="220" text-anchor="middle" font-size="10" fill="#16a34a">梯度有信号, 易训练</text>
  </g>

  <!-- RIGHT panel: barren plateau (n large, flat) -->
  <g transform="translate(410,80)">
    <text x="120" y="-10" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">深/宽电路 (n 大) — Barren Plateau</text>
    <!-- axes -->
    <line x1="0" y1="180" x2="240" y2="180" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="180" stroke="#94a3b8" stroke-width="1"/>
    <!-- loss surface (almost flat with subtle bump in middle) -->
    <path d="M 0,86 Q 60,82 120,80 Q 180,82 240,86" fill="#fee2e2" fill-opacity="0.7" stroke="#dc2626" stroke-width="1.4"/>
    <line x1="0" y1="86" x2="240" y2="86" stroke="#dc2626" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="120" cy="80" r="3.5" fill="#dc2626"/>
    <text x="120" y="68" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">极小</text>
    <text x="240" y="195" text-anchor="end" font-size="10" fill="#64748b">参数方向 θ₁</text>
    <text x="-6" y="10" text-anchor="end" font-size="10" fill="#64748b">L(θ)</text>
    <text x="120" y="220" text-anchor="middle" font-size="10" fill="#dc2626">梯度≈0, 优化器停滞</text>
  </g>

  <!-- Formula strip -->
  <rect x="60" y="245" width="600" height="50" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="80" y="266" font-size="11" font-weight="700" fill="#475569">McClean 2018 (Nature Physics):</text>
  <text x="80" y="284" font-size="13" fill="#dc2626" font-weight="700">Var[∂L/∂θᵢ] ~ O(b⁻ⁿ),    b &lt; 1,  n = qubit 数</text>

</svg>