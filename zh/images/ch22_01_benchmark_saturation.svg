<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <style>text { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }</style>
  <rect width="720" height="380" fill="#fafbfc"/>
  <rect x="0" y="0" width="720" height="36" fill="#2563eb"/>
  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="white">Benchmark 饱和曲线示意</text>
  <text x="360" y="58" text-anchor="middle" font-size="11" fill="#64748b">随模型能力提升 · benchmark 从"高区分度"→"饱和"→"污染"</text>

  <!-- Axes -->
  <line x1="90" y1="320" x2="680" y2="320" stroke="#334155" stroke-width="1.5"/>
  <line x1="90" y1="100" x2="90" y2="320" stroke="#334155" stroke-width="1.5"/>
  <text x="700" y="335" font-size="11" fill="#475569" text-anchor="end">模型世代 →</text>
  <text x="80" y="95" font-size="11" fill="#475569" text-anchor="end">Y</text>
  <text x="80" y="110" font-size="11" fill="#475569" text-anchor="end">|</text>
  <text x="80" y="320" font-size="11" fill="#475569" text-anchor="end">0</text>
  <text x="385" y="338" text-anchor="middle" font-size="11" fill="#475569">时间 (能力提升方向)</text>

  <!-- Y axis labels -->
  <text x="80" y="295" font-size="10" fill="#64748b" text-anchor="end">20%</text>
  <text x="80" y="255" font-size="10" fill="#64748b" text-anchor="end">40%</text>
  <text x="80" y="215" font-size="10" fill="#64748b" text-anchor="end">60%</text>
  <text x="80" y="175" font-size="10" fill="#64748b" text-anchor="end">80%</text>
  <text x="80" y="135" font-size="10" fill="#64748b" text-anchor="end">100%</text>

  <!-- Reference line at 90% -->
  <line x1="90" y1="155" x2="680" y2="155" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="675" y="150" font-size="10" fill="#94a3b8" text-anchor="end">饱和线 90%</text>

  <!-- MMLU curve (saturating) -->
  <path d="M 100 290 Q 180 280 240 240 Q 310 200 380 175 Q 450 162 520 158 Q 580 156 670 156"
        fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="100" cy="290" r="4" fill="#2563eb"/>
  <circle cx="240" cy="240" r="4" fill="#2563eb"/>
  <circle cx="380" cy="175" r="4" fill="#2563eb"/>
  <circle cx="520" cy="158" r="4" fill="#2563eb"/>
  <circle cx="670" cy="156" r="4" fill="#2563eb"/>
  <text x="690" y="160" font-size="11" fill="#2563eb" font-weight="600">MMLU</text>

  <!-- Reported vs True -->
  <path d="M 100 290 Q 180 282 240 248 Q 310 215 380 195 Q 450 180 520 172 Q 580 168 670 165"
        fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="690" y="195" font-size="11" fill="#dc2626" font-weight="600">含污染 reported</text>

  <!-- Shaded gap (contamination) -->
  <path d="M 380 175 Q 450 162 520 158 L 520 172 Q 450 180 380 195 Z" fill="#dc2626" fill-opacity="0.18"/>
  <text x="450" y="208" font-size="10" fill="#dc2626" font-weight="600" text-anchor="middle">污染 gap</text>

  <!-- Region annotations -->
  <rect x="100" y="280" width="160" height="40" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="180" y="298" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="700">高区分度区</text>
  <text x="180" y="313" text-anchor="middle" font-size="10" fill="#16a34a">MMLU 2020 ~ GPT-3 43.9% vs 人类 89.8%</text>

  <rect x="280" y="220" width="160" height="100" fill="#d97706" fill-opacity="0.10" stroke="#d97706" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="360" y="238" text-anchor="middle" font-size="11" fill="#d97706" font-weight="700">逼近饱和</text>
  <text x="360" y="254" text-anchor="middle" font-size="10" fill="#d97706">区分度迅速下降</text>
  <text x="360" y="269" text-anchor="middle" font-size="10" fill="#d97706">8B 模型 65%, 前沿 88%+</text>

  <rect x="460" y="155" width="200" height="80" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="560" y="173" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">污染主导</text>
  <text x="560" y="188" text-anchor="middle" font-size="10" fill="#dc2626">reported = TrueCap +</text>
  <text x="560" y="202" text-anchor="middle" font-size="10" fill="#dc2626">Contamination + PromptSens</text>

  <text x="385" y="365" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">Goodhart: 量度一旦成为目标，就不再是好的量度</text>
</svg>
