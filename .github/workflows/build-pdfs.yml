name: Build PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (default: current branch)'
        required: false
        default: ''

permissions:
  contents: write

# Don't run two builds for the same branch concurrently.
concurrency:
  group: build-pdfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # workflow_dispatch has no inputs: the user picks the branch from the
      # "Use workflow from" dropdown on the Actions UI when triggering manually.
      # No arbitrary branch input — avoids command injection from attacker-controlled
      # values and avoids ci-cd trust (running untrusted code from a PR branch).

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Playwright/Chromium + PDF merge tool
        run: |
          bun add playwright --no-save
          bunx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Render EN compendium PDF
        run: |
          node ci/render-pdf.mjs --target=en \
            --watermark="Steven Chen" \
            --out="pdfs/EN-Maths-CS-AI-Compendium.pdf"

      - name: Render ZH main PDF
        run: |
          node ci/render-pdf.mjs --target=zh \
            --watermark="Steven Chen" \
            --out="pdfs/ZH-Maths-CS-AI-Compendium.pdf"

      - name: Render ZH 教辅 PDF
        run: |
          node ci/render-pdf.mjs --target=jiaofu \
            --watermark="Steven Chen" --no-cover \
            --out="pdfs/ZH-教辅资料.pdf"

      - name: Commit rendered PDFs
        # PDFs are not committed (they're in .gitignore and would exceed
        # GitHub's 100MB file limit anyway). The Release step below makes them
        # available as release assets instead.
        run: echo "PDFs hosted via GitHub Release assets; skipping repo commit."
