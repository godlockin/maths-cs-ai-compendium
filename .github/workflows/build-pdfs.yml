name: Build PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (default: current branch)'
        required: false
        default: ''

permissions:
  contents: write

# Don't run two builds for the same branch concurrently.
concurrency:
  group: build-pdfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve branch (dispatch input or triggering branch)
        id: branch
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          if [ -z "$BRANCH" ]; then BRANCH="${GITHUB_REF#refs/heads/}"; fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Building branch: $BRANCH"

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.name }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Playwright/Chromium + PDF merge tool
        run: |
          bun add playwright --no-save
          bunx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Render EN compendium PDF
        run: |
          node ci/render-pdf.mjs --target=en \
            --watermark="Steven Chen" \
            --out="pdfs/EN-Maths-CS-AI-Compendium.pdf"

      - name: Render ZH main PDF
        run: |
          node ci/render-pdf.mjs --target=zh \
            --watermark="Steven Chen" \
            --out="pdfs/ZH-Maths-CS-AI-Compendium.pdf"

      - name: Render ZH 教辅 PDF
        run: |
          node ci/render-pdf.mjs --target=jiaofu \
            --watermark="Steven Chen" --no-cover \
            --out="pdfs/ZH-教辅资料.pdf"

      - name: Commit rendered PDFs
        run: |
          ls -lh pdfs/
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pdfs/
          if git diff --cached --quiet; then
            echo "No PDF changes"
          else
            git commit -m "build: render PDFs via Playwright (mermaid + landscape wide tables)"
            git push origin "HEAD:${{ steps.branch.outputs.name }}"
          fi
