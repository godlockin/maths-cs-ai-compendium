name: Deploy Chinese Docs

on:
  push:
    branches: [main]
    paths:
      - 'zh/**'
      - 'mkdocs-zh.yml'
      - 'images/**'
      - '.github/workflows/deploy-docs-zh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs Material + jieba (中文分词)
        run: pip install "mkdocs<2" "mkdocs-material[imaging]" jieba

      - name: Build zh site (with /zh/ base path)
        run: mkdocs build -f mkdocs-zh.yml -d site-zh

      # Deploy zh site to gh-pages branch /zh/ subpath
      # Strategy: build site, then prepend EN site (preserves /zh/ alongside EN)
      - name: Combine zh with EN site
        run: |
          # Build EN site first
          mkdocs build -d site-en
          # Create combined site: EN at root, zh at /zh/
          rm -rf site-combined
          cp -r site-en site-combined
          mkdir -p site-combined/zh
          cp -r site-zh/. site-combined/zh/
          # Use combined as publish dir
          rm -rf site-zh site-en
          mv site-combined site-zh

      - name: Deploy to gh-pages branch (preserves /zh/ alongside EN)
        uses: peaceiris/actions-gh-pages@4f9f30408f1e648ce79bd8f50f29889a64e99889  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-zh
          publish_branch: gh-pages
          keep_files: true   # preserve existing EN site, only update /zh/
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: zh docs at /zh/ from ${{ github.sha }}'
