name: Deploy Chinese Docs

on:
  push:
    branches: [main]
    paths:
      - 'zh/**'
      - 'mkdocs-zh.yml'
      - 'images/**'
      - '.github/workflows/deploy-docs-zh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs Material + jieba (中文分词)
        run: pip install "mkdocs<2" "mkdocs-material[imaging]" jieba

      - name: Build zh site (with /zh/ base path)
        run: mkdocs build -f mkdocs-zh.yml -d site-zh

      - name: Deploy to gh-pages branch (only /zh/ subdir, keep EN site)
        uses: peaceiris/actions-gh-pages@v4.0.0  # pin to tag
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-zh
          publish_branch: gh-pages
          keep_files: true
          destination_dir: zh   # 关键: 把 site-zh 内容放到 gh-pages/zh/
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: zh docs at /zh/ from ${{ github.sha }}'
