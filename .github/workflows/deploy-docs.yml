name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install "mkdocs<2" "mkdocs-material[imaging]"

      - name: Create docs directory with symlinks
        run: |
          mkdir -p docs
          cp README.md docs/index.md
          ln -s ../images docs/images
          ln -s ../javascripts docs/javascripts
          ln -s ../stylesheets docs/stylesheets
          find . -maxdepth 1 -type d -name 'chapter *' | while IFS= read -r dir; do
            dir="${dir#./}"
            ln -s "../$dir" "docs/$dir"
          done

      - name: Build site to external dir (avoid docs_dir/site_dir conflict)
        run: mkdocs build -d /tmp/site-en

      - name: Deploy to gh-pages branch root (keep zh at /zh/)
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/site-en
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: en docs from ${{ github.sha }}'
