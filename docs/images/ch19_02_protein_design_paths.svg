<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <text x="400" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">蛋白质设计两条路: 从头设计 (RFdiffusion) 与逆折叠 (ProteinMPNN)</text>

  <!-- Top: RFdiffusion diffusion process -->
  <text x="200" y="55" fill="#444" font-size="13" font-weight="bold" text-anchor="middle">路径 A · RFdiffusion (从零生成骨架)</text>

  <!-- Timesteps -->
  <g transform="translate(20, 70)">
    <text x="0" y="12" fill="#666" font-size="10">t = T (噪声)</text>
    <circle cx="60" cy="40" r="22" fill="#ddd" stroke="#888"/>
    <circle cx="80" cy="50" r="22" fill="#ddd" stroke="#888"/>
    <circle cx="100" cy="32" r="22" fill="#ddd" stroke="#888"/>
    <line x1="120" y1="40" x2="170" y2="40" stroke="#888" stroke-width="1.5"/>
    <polygon points="167,37 167,43 174,40" fill="#888"/>

    <text x="180" y="22" fill="#666" font-size="10">t = T/2</text>
    <circle cx="190" cy="45" r="20" fill="#fbe5d6" stroke="#e67e22"/>
    <circle cx="215" cy="35" r="20" fill="#fbe5d6" stroke="#e67e22"/>
    <circle cx="240" cy="55" r="20" fill="#fbe5d6" stroke="#e67e22"/>
    <line x1="262" y1="45" x2="312" y2="45" stroke="#888" stroke-width="1.5"/>
    <polygon points="309,42 309,48 316,45" fill="#888"/>

    <text x="320" y="22" fill="#666" font-size="10">t = 0 (结构)</text>
    <circle cx="330" cy="42" r="14" fill="#27ae60" opacity="0.7" stroke="#1e8449"/>
    <circle cx="358" cy="35" r="14" fill="#27ae60" opacity="0.7" stroke="#1e8449"/>
    <circle cx="386" cy="55" r="14" fill="#27ae60" opacity="0.7" stroke="#1e8449"/>
    <circle cx="370" cy="60" r="14" fill="#27ae60" opacity="0.7" stroke="#1e8449"/>
    <line x1="330" y1="42" x2="358" y2="35" stroke="#444"/>
    <line x1="358" y1="35" x2="386" y2="55" stroke="#444"/>
    <line x1="386" y1="55" x2="370" y2="60" stroke="#444"/>
  </g>

  <!-- Forward arrow -->
  <text x="200" y="160" fill="#666" font-size="11" text-anchor="middle">diffusion: 骨架 → 噪声 → 骨架 (残基基元)</text>
  <path d="M 380 110 Q 450 110 450 175 Q 450 240 380 240"
        fill="none" stroke="#888" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="377,237 383,237 380,244" fill="#888"/>

  <!-- Conditioning -->
  <text x="600" y="55" fill="#444" font-size="13" font-weight="bold" text-anchor="middle">条件控制 (Conditioning)</text>
  <rect x="500" y="70" width="120" height="35" fill="#fef9e7" stroke="#f39c12"/>
  <text x="560" y="92" fill="#444" font-size="11" text-anchor="middle">无约束 (unconditional)</text>
  <rect x="640" y="70" width="130" height="35" fill="#fef9e7" stroke="#f39c12"/>
  <text x="705" y="92" fill="#444" font-size="11" text-anchor="middle">形状 / 拓扑</text>

  <rect x="500" y="115" width="120" height="35" fill="#fef9e7" stroke="#f39c12"/>
  <text x="560" y="137" fill="#444" font-size="11" text-anchor="middle">功能 motif</text>
  <rect x="640" y="115" width="130" height="35" fill="#fef9e7" stroke="#f39c12"/>
  <text x="705" y="137" fill="#444" font-size="11" text-anchor="middle">对称性 (symmetry)</text>

  <rect x="500" y="160" width="250" height="35" fill="#fef9e7" stroke="#f39c12"/>
  <text x="625" y="182" fill="#444" font-size="11" text-anchor="middle">binder: 目标位点 (length 50-150)</text>

  <!-- Separator -->
  <line x1="20" y1="245" x2="780" y2="245" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Bottom: ProteinMPNN inverse folding -->
  <text x="600" y="275" fill="#444" font-size="13" font-weight="bold" text-anchor="middle">路径 B · ProteinMPNN (逆折叠: 骨架 → 序列)</text>

  <!-- Input: backbone -->
  <rect x="500" y="295" width="160" height="40" fill="#cfe8f7" stroke="#3498db" stroke-width="1.5"/>
  <text x="580" y="320" fill="#444" font-size="11" text-anchor="middle">固定骨架 (Backbone)</text>

  <line x1="660" y1="315" x2="700" y2="315" stroke="#444" stroke-width="2"/>
  <polygon points="697,312 697,318 704,315" fill="#444"/>

  <!-- Network -->
  <rect x="710" y="295" width="80" height="40" fill="#fde6cf" stroke="#e67e22" stroke-width="1.5"/>
  <text x="750" y="320" fill="#444" font-size="11" text-anchor="middle">MPNN</text>

  <line x1="755" y1="340" x2="755" y2="370" stroke="#444" stroke-width="2"/>
  <polygon points="752,367 758,367 755,374" fill="#444"/>

  <!-- Output: sequence -->
  <rect x="690" y="380" width="180" height="40" fill="#e0f0e0" stroke="#27ae60" stroke-width="1.5"/>
  <text x="780" y="405" fill="#444" font-size="11" text-anchor="middle">候选序列 (Sequence)</text>

  <!-- Sequence letters visualization -->
  <g transform="translate(500, 380)" font-family="monospace" font-size="10">
    <rect x="0" y="0" width="20" height="35" fill="#e74c3c"/><text x="10" y="22" fill="#fff" text-anchor="middle">M</text>
    <rect x="20" y="0" width="20" height="35" fill="#3498db"/><text x="30" y="22" fill="#fff" text-anchor="middle">E</text>
    <rect x="40" y="0" width="20" height="35" fill="#2ecc71"/><text x="50" y="22" fill="#fff" text-anchor="middle">V</text>
    <rect x="60" y="0" width="20" height="35" fill="#f39c12"/><text x="70" y="22" fill="#fff" text-anchor="middle">L</text>
    <rect x="80" y="0" width="20" height="35" fill="#9b59b6"/><text x="90" y="22" fill="#fff" text-anchor="middle">A</text>
    <rect x="100" y="0" width="20" height="35" fill="#e74c3c"/><text x="110" y="22" fill="#fff" text-anchor="middle">D</text>
    <text x="135" y="22" fill="#666" font-size="10" font-style="italic">...</text>
  </g>

  <text x="600" y="220" fill="#27ae60" font-size="11" font-style="italic" text-anchor="middle">恢复率: 52% → 蛋白序列可溶表达 (Dauparas 2022)</text>
</svg>
