site_name: "数学、计算机与 AI 综合手册 (中文版)"
site_url: "https://godlockin.github.io/maths-cs-ai-compendium/"
site_description: "开源、直觉先行的数学、计算机、AI 全栈中文教材 · 25 章覆盖数学基础到前沿 AI"
site_author: "Henry Ndubuaku (原著) · Steven Chen (中译主编)"
repo_url: "https://github.com/godlockin/maths-cs-ai-compendium"
repo_name: "godlockin/maths-cs-ai-compendium"

docs_dir: .

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: slate
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - scheme: slate
      primary: slate
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format
            kwds:
              mode: generic
              tag: div
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables
  - footnotes

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/pyodide-runner.js

extra_css:
  - stylesheets/pyodide-runner.css

plugins:
  - search:
      lang:
        - zh
        - en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/godlockin/maths-cs-ai-compendium

