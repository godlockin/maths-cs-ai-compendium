        - article [ref=e770]:
          - heading [level=1] [ref=e771]:
            - text: 数学、计算机与 AI 综合手册
            - link "¶" [ref=e772] [cursor=pointer]:
              - /url: "#ai"
          - paragraph [ref=e773]:
            - img "Logo" [ref=e774]
          - paragraph [ref=e775]:
            - strong [ref=e776]: 在线阅读
            - text: ":"
            - link "English" [ref=e777] [cursor=pointer]:
              - /url: https://henryndubuaku.github.io/maths-cs-ai-compendium/
            - text: "|"
            - link "简体中文" [ref=e778] [cursor=pointer]:
              - /url: https://godlockin.github.io/maths-cs-ai-compendium/zh/
          - paragraph [ref=e779]:
            - link [ref=e780] [cursor=pointer]:
              - /url: https://trendshift.io/repositories/21344?utm_source=repository-badge&utm_medium=badge&utm_campaign=badge-repository-21344
              - img "godlockin%2Fmaths-cs-ai-compendium | Trendshift" [ref=e781]
          - heading [level=2] [ref=e782]:
            - text: 项目概览
            - link "¶" [ref=e783] [cursor=pointer]:
              - /url: "#_1"
          - paragraph [ref=e784]: 市面上大多数教材把好想法埋藏在密集的符号之下,跳过直觉,默认你已经懂了一半内容,并且在 AI 这类快速演进的领域里很快过时。本项目是一本开源、非传统的教科书,从零起步覆盖数学、计算机科学与人工智能三大领域,为希望深入理解这些知识(而不仅应付考试/面试)的求知者而写。
          - heading [level=2] [ref=e785]:
            - text: 背景
            - link "¶" [ref=e786] [cursor=pointer]:
              - /url: "#_2"
          - paragraph [ref=e787]: 过去几年在 AI/ML 领域的工作中,我在笔记本上写满了直觉优先、注重真实世界语境、不手挥(hand-waving)的数学、计算机与 AI 概念讲解。2025 年,几位朋友用这些笔记备战 DeepMind、OpenAI、Nvidia 等公司的面试,全部成功拿到 offer 且目前在岗位上表现优秀。与此同时,作者也于去年入选 Y Combinator。所以决定向所有人公开。
          - heading [level=2] [ref=e788]:
            - text: MCP 服务器
            - link "¶" [ref=e789] [cursor=pointer]:
              - /url: "#mcp"
          - paragraph [ref=e790]: 本仓库内置 MCP 服务器,允许任何 AI 助手(Claude Code、Cursor、VS Code 等)将本手册作为知识库使用。需要在本地克隆仓库,提供面向教学的工具与示例实现。
