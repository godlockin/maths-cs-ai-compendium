          - heading [level=2] [ref=e953]:
            - text: 前言
            - link "¶" [ref=e954] [cursor=pointer]:
              - /url: "#_4"
          - paragraph [ref=e955]: 新生儿的大脑是一个刚初始化的神经网络,从真实世界的数据与经验中训练至成年……直到永远。法语说得地道、口音纯正,意味着从小沉浸在优秀的法语与纯正口音中;同理,优秀 AI 研究者与工程师所具备的出色解题能力,源自高质量的知识输入与丰富的执行经验。
          - paragraph [ref=e956]: Kvashchev 实验是一项塞尔维亚长期研究,证明三年高强度、聚焦的创造性问题训练可以显著提升智力,尤其是流体智力,带来 10-15 个 IQ 点的增益。先天高 IQ 确实存在,正如高质量的权重初始化带来更好的训练,这一点有"先天 vs 后天"实验证据支撑。
          - paragraph [ref=e957]: 然而,高 IQ 个体真正拥有的唯一优势是更快地学习/识别模式。但只要重复使用模式,任何概念都是可以学会的。查尔斯·达尔文曾被父亲和老师们认为是一个非常普通甚至中下的学生,他自述不够机敏,感觉像一个"慢处理器",需要时间慢慢吸收数据。
          - paragraph [ref=e958]: 3-10 岁时,我学业表现良好,自然就能理解概念,从不记笔记也不复习。11-13 岁时变得有点自大,成绩掉到 80 人班级的后一半。14-15 岁时,我开始像一个普通学生一样阅读,在中学最后一个学期考到第一名。早期学校课程天然适合高 IQ 学习者,但真实世界的能力靠的是高质量的知识摄入与执行强度。
          - paragraph [ref=e959]: 事实上,大多数学业出色的人只是更勤奋,但学术系统是为快学者设计的。本手册提供完整、互联的知识流,为"达尔文式"的学习者铺平道路。你只需要初等数学和基础 Python 编程,其余都可以在这里学到,放心读、相信过程即可!
          - heading [level=2] [ref=e960]:
            - text: 如何学得更好
            - link "¶" [ref=e961] [cursor=pointer]:
              - /url: "#_5"
          - paragraph [ref=e962]: "大学第一学期我同时选了 17 门课,成绩不太理想,所以我用了这样一个技巧:"
          - paragraph [ref=e963]:
            - strong [ref=e964]: 阶段 1
            - text: :课后睡前累积阅读 每节课后、睡前阅读对应材料。下一节课开始时从头重读至当前进度,然后用额外研究填补知识空白。这让大脑把模式连接起来。
          - paragraph [ref=e965]:
            - strong [ref=e966]: 阶段 2
            - text: :考试前遮蔽阅读 读每个章节的小标题,合上书,然后在脑中(或纸上)把概念默写/默讲一遍。只重读遗漏之处,类似机器学习里的掩码语言建模。重读之后,最终用代码实现概念,你会对每个概念形成肌肉记忆。
          - paragraph [ref=e967]: 这对不太自信的朋友非常有效。事实上,其中一位朋友在高级工程数学课(讲 Hessian 和优化)上击败了我,她目前在一家大型石油天然气公司工作。灵魂的意愿比身体条件更重要(Rosenthal 实验)。
